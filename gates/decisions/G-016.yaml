format: 1
id: G-016
date: 2026-10-26
question: Which gates change when the identity types collapse to Uuid and ExternalId, and the codes of lists other systems define become ExternalIds?
decision: >-
  `OptionKey`, `FormatId`, `GeoCode`, `DeviceCategory`, `ContentCategory`,
  and `DocumentVersion` are no primitives, and their concepts leave the
  domain file, with the `code` and `geography` domains they emptied. Each use
  is an `ExternalId`, and a mapping member may carry a description that names
  where its value comes from, as a terms document's version or a property's
  supported formats do; the selection template's `included` and `pricing`
  slots say how an option is named. The one shared structure left is
  `ExternalId`, `FieldPath`, and `Text`. The nesting fixture builds its list
  of lists from `ExternalId`. The `Map` constructor drops the invalid vector
  that only `FormatId`'s pattern rejected, and PG-8 names its case
  `Map<ExternalId, Count>`. The engine tests count 38 trailing-newline
  mutants, not 41, since `FormatId`'s three pattern vectors are gone, and the
  release tests narrow a field to `CatalogRef`, which keeps a pattern. A
  test checks that the geo and device bounds are copies of one application.
  The test suite holds 317 tests, so its floor rises to 317.
rationale: >-
  A primitive exists only when it validates differently or a receiver
  processes its value differently, and none of these did: each was compared
  by exact equality as written, and `FormatId`'s pattern came from the
  examples, not from the registry that defines format IDs. Every gate still
  checks every type the model holds; the vector, the mutant count, and the
  exemption change only with the type that is gone, and the test floor
  rises, so no gate is weaker.
retires:
  - concept: option-key
    reason: An option is named by its own identity, its value or its `id`, which is compared by exact equality as an ExternalId; the selection template's description says so (D-007).
  - concept: format-id
    reason: A format ID is a code of the format registry, carried as written and compared by exact equality, an ExternalId whose field description names the registry (D-019).
  - concept: geo-code
    reason: A geo code is a code of a list the specification has yet to name, carried as written, an ExternalId whose field description says so (D-019).
  - concept: device-category
    reason: A device category is a code of a list the specification has yet to name, carried as written, an ExternalId whose field description says so (D-019).
  - concept: content-category
    reason: A content category is an ID of the IAB Tech Lab Content Taxonomy, carried as written, an ExternalId whose member description names the taxonomy (D-025).
  - concept: document-version
    reason: A terms document's version is written by its publisher and compared by exact equality, like an ExternalId, whose member description says it is the document's version (D-027).
