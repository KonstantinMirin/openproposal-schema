format: 1
id: G-157
date: 2026-11-13
question: How do the SDKs check a rule JSON Schema can't state, from one definition, and how does CI hold every SDK to the rule's vectors, starting with § 5.6.5's TIME arithmetic?
decision: >-
  A rule's check may be a program, `rule-programs.yaml` in a spec's
  folder: a small expression language (src/rule-program.ts) read on a
  value of the rule's owner, with exact decimal arithmetic and the calendar
  day of an instant in a zone. The gates run each program as its rule's
  check, and the SDK emitters write the programs into every SDK that has
  the rule's owner, with an evaluator in each runtime: TypeScript's is that
  file as it is, and Python's and Go's are ports of it. A zone's calendar
  day is the one IANA tzdata 2026e gives, the release the kernel pins:
  tools/tzdata/build.py writes the UTC offsets of every zone and link name
  from 1970 to 2100 from the hash-locked `tzdata` package into
  kernel/sources/tzdata-2026e.json, which every engine reads. A sentence
  with no RFC 2119 keyword whose check a program states is a rule on the
  program's owner, by the mapping rule `programmed-sentence`, and D-065
  reads § 5.6.5's definitions of a commitment's figures and § 5.6.1's
  bounds so: six rules on the line item, with vectors from IAB Australia's
  a3, a4, b3, d06, and d08 as invalid ones and the inclusive ends d13 and
  d14 as valid ones. Three gates are new: rule-programs, the file
  schema-valid, every operation and definition known, and every program a
  rule some lock lists; zone-table, the committed table what the builder
  writes for the pinned release and names; and sdk-rules, each SDK on every
  payload of every vector of a rule it checks, rejected at each place the
  gates' own evaluator rejects it and nowhere else. The parity and location
  cases of an owner's type count the programs' verdicts, so a case a rule
  rejects is invalid for the SDKs, as the plain generator's classes, which
  check no rule, aren't held to. The desk-tests gate fails an SDK gap for
  a rule the SDKs check, and the intake drafts a rule's finding the SDKs
  check as every engine's. IAB Australia's a3, a4, b3, d06, and d08 move
  from checker_only to findings in every engine.
rationale: >-
  No check is weaker: the rules gate holds each program to its rule's
  vectors as it holds a check written in TypeScript; the SDKs reject what
  the six rules reject, which they accepted before; three gates are new,
  each with fixtures: a program for a rule no lock lists, an operation no
  evaluator knows, a table of another release, a table that isn't what the
  package compiles, an SDK that accepts a rule's invalid vector, and one
  that rejects a valid one; and the desk-tests gate gains a fixture for an
  SDK gap the SDKs closed, beside the checker-only fixtures, which now add
  their entries. The generated code that changes is the two stack trees':
  every SDK's line item runs the six programs, the TypeScript and Python
  runtimes hold the rule check, and each tree gains its rules file and the
  time zone table, `rules.ts` and `tzdata.ts`, `_rules.py`, and `rules.go`.
  The `main` and `with-open-prs` outputs are byte-identical: no rule of
  theirs has a program.
