format: 1
id: G-106
date: 2026-10-28
question: What changes in the gates when OpenProposal takes AdCOM's lists from the registry and references its schemas, in place of the copies kernel/lists.yaml held?
decision: >-
  kernel/lists.yaml no longer copies AdCOM's List: Plcmt Subtypes - Video,
  List: Playback Methods, or List: API Frameworks. A spec's profile names
  under `imports` a registry spec on this site and the lock it pins,
  OpenProposal's AdCOM at main, and the kernel takes each of the registry's
  42 lists from the registry's committed IR and schemas (src/imports.ts):
  codes, labels (a row's name before a colon, or its text), vendor range,
  URL at the lock's commit, and the registry's vocabulary. The three lists
  it took are equal to the copies they replace, which a test holds. A
  vocabulary of a registry's list emits as a `$ref` to the registry's
  vocabulary at its absolute `$id` on adtechspec.noetis.dev, with a
  description naming the list, and no `enum`; the model and the SDK keep
  its terms. Every validator, Ajv and the reference oracle alike, loads the
  registry's committed files that a tree references, and theirs in turn
  (`withImports`); the conventions check resolves a cross-host reference
  against them; the plain generator reads a local copy of the tree whose
  cross-host references point at copies of those files, since it fetches
  nothing. The fidelity gate's five fixtures on the three lists now change
  the registry's file that decides the verdict, since a change to
  OpenProposal's terms no longer reaches its schema, and a closed
  vocabulary counts as reached where the registry's vocabulary it
  references is. A file with no absolute `$id`, as the plain generator's
  fixture is, loads as it is. Type rules § 6 states the rule. The test
  suite holds 488 tests, and MIN_TESTS is 488.
rationale: >-
  The verdicts don't change: every case of the committed corpus, 3,206
  verdicts on both locks and both variants, gives the same verdict under
  the trees before and after, and the fidelity, example, and type-example
  outputs are identical. Only two schema files change, each in the three
  definitions whose enum a `$ref` replaces; the corpus loses the four
  cases of the copied enums, which the registry's own corpus holds, and
  the release manifest and the SDKs' stated schema digest follow. Every
  fixture still fails its gate, now on the file that decides it; no gate
  is relaxed. feedback/ is byte-identical.
