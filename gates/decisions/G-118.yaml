format: 1
id: G-118
date: 2026-10-28
question: What changes in the gates when the owner withdraws D-039, so § 5.2.2's reward, instl, and skip keep the integers 0 and 1 that AdCOM writes?
decision: >-
  A decision record may be `withdrawn`: its owner dropped it and no record
  replaces it. It keeps its text, says why and when under `withdrawn`, which
  only a withdrawn record carries, and stands for nothing, as a superseded
  record doesn't: no entry, primitive, rule, or concept may cite it, no
  variant switches it, the fidelity gate takes no excuse from it, the
  feedback lists it nowhere, and the site gives it no page. D-039 is
  withdrawn. The kernel gains `IntegerFlag`, the concept `integer-flag` of
  the flag domain, a primitive whose schema is titled const branches, `0`
  (No) and `1` (Yes), as an integer-coded vocabulary's codes are; the
  kernel format lets an integer primitive state such codes and nothing
  else. The conventions and the output check accept titled codes at a
  primitive's root, and only codes, each once with a title; the SDK
  emitters read them as an enum of their codes. Mapping rule
  `restated-value-list` reads a value list that restates a primitive's
  titled codes as what the primitive's schema expresses, and `domain-row`
  types a key whose only value lists restate its concept's type, so
  `reward`, `instl`, and `skip` are `IntegerFlag` by rule, cited by the
  integer-flag concept in OpenProposal's kernel binding, with no decision.
  The as-written variant drops its D-039 switch and its own `IntegerFlag`,
  so it has 5 departures to switch off, and both builds type the three keys
  alike. OpenProposal's round trip renders titled codes in its tables'
  notation, `0` (no) | `1` (yes), so the three rows round-trip with no
  recorded difference; their example findings and their rule vectors' `true`
  are gone, the vectors writing `1`. The plain generator takes `true`,
  `false`, and `"1"` for `IntegerFlag`, which PG-15 lists. Gate fixtures
  that used D-039 now use D-037's code-block cover and D-040's switch. The
  feedback renumbers the proposals after the 40th. The test suite holds 513
  tests, and MIN_TESTS is 513.
rationale: >-
  Every check that read `superseded` now reads both statuses that no longer
  stand, so a withdrawn record excuses and shapes nothing; the conventions
  accept one more form, an integer primitive's titled codes, and check it as
  strictly as an integer-coded vocabulary's. OpenProposal's outputs change
  only where the three keys reach: its with-open-prs schemas, rules,
  corpus, type examples, SDK types, release manifests, comparison, and
  feedback. AdCOM's outputs are unchanged; its kernel binding marks
  `IntegerFlag` absent.
