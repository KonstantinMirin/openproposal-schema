format: 1
id: G-079
date: 2026-10-27
question: What changes in the gates when the kernel files keep only the definitions, and each spec's kernel binding gives what rests on its text?
decision: >-
  kernel/primitives.yaml, constructors.yaml, and domains.yaml keep each
  type's definition, constraints, vectors, showcase values, and the
  standards and design sections it rests on. What rests on OpenProposal's
  text moves, line for line, to specs/openproposal/kernel-binding.yaml,
  valid against kernel/binding.schema.json (src/binding.ts): each spec
  source with its digest and quote, each decision and decision_locks, each
  type's locks, each rule's spec sources and decisions, the fallbacks'
  statements and decisions, the member an option carries, each concept's
  requires.member, requires.decision, and lacking elements, and the
  homonyms, the bases, and the shared structures' decisions. The loaders
  merge the binding into the definitions and validate the result against
  the kernel's own schemas, so each spec gets one kernel and every kernel
  gate runs on the spec's. The load fails when a kernel file holds a key a
  binding gives, when a binding gives a definition, or when it names an
  item the kernel lacks; kernel-load has a fixture for each. kernel-sources
  has a fixture whose binding cites an element of another spec, the widgets
  fixture's, and fails. The exemptions of the homonym, money, and shared
  structure gates read the bindings too, and an exemption member that names
  no value now fails the fingerprint. The model writes what an option
  carries in its type's field order, so the merge's key order reaches no
  output. Five tests cover the binding; the suite holds 425 tests, and
  MIN_TESTS is 425.
rationale: >-
  No OpenProposal output changes: the merged kernel equals the kernel at
  the previous commit, value for value, and every committed output and the
  site build are what they were. No gate is weaker: each kernel gate checks
  the same merged kernel, the kernel's schemas validate the same documents,
  the exemptions read the same entries from their new file, and the load
  refuses three mistakes it couldn't make before. The fingerprints change
  because the loaders, the exemption paths, and the harness changed.
