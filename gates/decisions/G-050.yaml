format: 1
id: G-050
date: 2026-10-27
question: How does the fidelity gate keep a decision's reading of a list's prose item from widening the projection the list's code paths give?
decision: >-
  A profile entry's `paths` becomes `reads`: each prose item a cited
  decision reads, `item`, with the paths it reads that item as, so D-028
  reads "property names" as `properties.available[].name`. The fidelity
  oracle refuses a reading of an item the list doesn't write in prose, a
  reading of a list no MUST-contain statement introduces, and a path that
  starts at a field one of the list's code paths names, and the gate fails
  on each refusal. The readings, `mapping/*.yaml#reads`, join the gate's
  exemptions, so its fingerprint covers them and a new reading needs a gate
  decision. Three fixtures widen the summary's `formats` to the whole field
  with readings of each member the list doesn't name, read a prose item the
  list doesn't write, and read a list that only a "whichever of" statement
  gives; each fails the gate. A test checks each refusal. The gates that
  load the mapping read its type, so their fingerprints change with no
  change to what they check. The test suite holds 354 tests, so `MIN_TESTS`
  is 354.
rationale: >-
  G-036 says the oracle's one input from the mapping can only add a check,
  since a reading only narrows what a projection may hold. That is wrong: a
  reading's path joins the projection, so each object it steps into may
  hold one more member, and a reading of `formats.available[]` and
  `formats.pricing` let a summary carry most of the line item's `formats`.
  The oracle now accepts only a reading that can't reach an object a code
  path projects, every earlier check stays, and the fixtures and the test
  are added, so no gate is weaker.
