options:
  - id: members-carry-markers
    summary: "The markers are the seven of § 3, a closed list. A `mixed` field has no marker of its own: each of its sub-fields or member objects carries one."
  - id: eighth-marker
    summary: "`mixed` is an eighth marker, meaning that the field's members carry their own markers."
  - id: open-markers
    summary: The markers are an open vocabulary that an implementation may extend with namespaced terms.
chosen: members-carry-markers
rationale: >-
  § 3 says every field carries exactly one marker and defines seven. The two
  fields marked `mixed` state their members' markers instead: each `pricing[]`
  sub-field has a row with its own marker, and `buyer_requirements` says its
  first object is seller-set and its second is supplied. So `mixed` summarizes
  the members; it isn't a rule of its own. A marker is a mutability rule that
  every SDK enforces between two versions, and an unknown marker can't be
  enforced, so the list is closed. The model keeps the seven as the kernel
  vocabulary `Marker`, whose terms the marker rows define, and the rules for
  each marker belong to it.
feedback: >-
  Either define `mixed` in § 3 as "the field's members carry their own markers",
  or give `pricing[]` and `buyer_requirements` rows for their members. Each row
  carries one marker, as `pricing[]` already has. State that the seven markers
  are the complete list.
