options:
  - id: text-constructors
    summary: "Constructors with the keys the stack's tables list: editions of `Selectable` and `Settable` on the stack's lock, and `Narrowing`, `SettableRange`, and the part `Delta`, which exist only there."
  - id: kernel-constructors
    summary: "The kernel's `Selectable` and `Settable` on every lock."
chosen: text-constructors
rationale: >-
  The stack's `Selectable` has `available[]`, `included[]`, `selected[]`,
  `deltas`, and `max_select`, with options named by id; its `Settable` has
  `allowed[]`, a `default`, and a `value`, each a `Narrowing` of `include[]`
  and `exclude[]`; and `SettableRange` holds the keys of `Range[T]` with a
  `default` and a `value`. The kernel's constructors hold `pricing` and no
  `selected[]`, `default`, or `value`, which the other locks' texts write.
  Constructors of the stack's own shape, published on its lock alone, give
  each field the keys its text lists, and `Range[T]` is the kernel's, whose
  keys and rule the stack's § 2.2 states the same way.
feedback: >-
  None needed. § 3.1 and § 3.2 define each key.
