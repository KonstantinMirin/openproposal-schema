options:
  - id: narrow-reading
    summary: >-
      Read each rule as narrowly as its words allow, and give it the vectors
      that reading decides:

      - the line item's own status

      - a pin as a `sha256`

      - the channel rows and the environment rows, matched by device and
      distribution

      - the seller named by the proposal's `seller_id`
  - id: no-vectors
    summary: Leave these rules without vectors until the specification states them precisely.
chosen: narrow-reading
rationale: >-
  Type rules § 9 gives every rule a valid and an invalid vector, so leaving
  these rules without vectors fails the gate. The vectors read each rule as
  follows. "Reaches status `agreed`" is the line item's own `status`, since
  the line item is self-contained, so an agreed line item carries no
  `catalog_ref` and no `list_ref`. A `list_ref` is hash-pinned when it
  carries `sha256`. An `environments.available[]` value matches an
  impression of the line item's `channel` when one of the value's
  (distribution channel, device type) pairs can hold an impression that
  § 5.1.1 gives that channel, its first matching row: `dooh` admits only
  `dooh`, and `ctv` only `ctv`, while `display` admits `web_desktop`,
  `web_mobile`, and `app_mobile`. The `plcmt` rule reads its key row as it
  is written: "`plcmt` | REQUIRED for video ads (`channel` `video`, or video
  on `channel` `ctv`); otherwise OPTIONAL". A line item whose `channel` is
  `video` holds video ads, so it gives `plcmt`. A line item whose `channel`
  is `ctv` says in no field whether its ads are video: a format ID is
  namespaced by channel, not by medium, as `ctv/instream-15s` is, the format
  registry has no `ctv/*` entries, and the delivery protocol is a term the
  text doesn't list (D-041). So a `ctv` line item without `plcmt` is
  undecided, neither accepted nor rejected, its vectors leave it out, and
  the examples gate records each one, as the bonus example is. "The seller" as a
  `measurement_source` vendor is the vendor whose ID is the proposal's
  `seller_id`, which the line item doesn't carry, so the vectors give it as
  context. An exclusion type is a key of `exclusions` that
  `exclusions_accepted.types` can list, so `list_ref`, whose entries have no
  stated type, is none. A consumer that doesn't recognise a `channel`, such as
  a namespaced one, skips the line item and keeps the proposal. A code block
  shows part of a line item, so a rule whose verdict turns on a member the
  block leaves out while it shows another the rule reads is undecided: the
  `status` beside a `list_ref` or a `catalog_ref`, the `channel` beside
  `environments` or `placement`, and any of the members the measurement rule
  reads. So is a `measurement_source` option given as a `catalog_ref`, whose
  vendor the line item holds only once the reference is resolved. The
  measurement rule is a SHOULD NOT, so an example that breaks it is a
  warning, not an error.
feedback: >-
  Say:

  - whether "reaches status `agreed`" means the proposal's status or the line
  item's

  - how a line item names the seller as its `measurement_source` vendor

  - how a `ctv` line item says it carries video, so that the `plcmt` condition
  can be checked

  - which exclusion type a `list_ref` holds
