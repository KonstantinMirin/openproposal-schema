options:
  - id: as-listed
    summary: >-
      Each member takes the schema type its meaning names, such as a timestamp
      or a URL. A code from an AdCOM list is the code. A plural member without
      `[]` is a list.
  - id: open-objects
    summary: Each object accepts any members.
chosen: as-listed
rationale: >-
  No inline object gives its members types, so each member takes the type of
  the concept its name and the examples call for. A property's or an
  audience's `id` names a catalog entry the seller mints, a `Uuid` (D-037),
  and a `name` is `Text`. `domains` is a list of `Domain`, and with the open
  PRs `apps` is a list of the app objects that the App identity table
  describes; both are plural, the examples write lists, and the table is
  headed `apps[]`, though the object writes them without `[]`.
  `supported_formats` lists format IDs, `FormatId` like the formats themselves
  (D-019). An audience's `taxonomy_ref` names an entry of a taxonomy another
  party keeps, an `ExternalId`, its `provenance` a term of the open vocabulary
  `Provenance` (D-041), and its `addressable_scale` a `Count`. In
  `buyer_supplied`, the two permissions are booleans, `match_rate_expected` is
  a `Fraction` (D-005), `segments[]` lists the buyer's segment IDs as its own
  systems write them, and `suppression_list` is an open object (D-016). In
  `placement`, § 5.2.2 says every key takes an integer, `playmethod[]` and
  `api[]` arrays of integers, and `refresh` an object whose `min_interval_s`
  is a REQUIRED integer, so `min_interval_s` is a required member, a length of
  time (D-040). `plcmt`, `playmethod[]`, and `api[]` take any code of List:
  Plcmt Subtypes - Video, List: Playback Methods, and List: API Frameworks,
  so each is the vocabulary of its list's codes, as AdCOM 1.0 writes them at
  the commit the text links: `PlcmtSubtype`, whose row writes out all nine,
  `PlaybackMethod`, and `ApiFramework`, whose rows name some codes "such as".
  The first two are closed; List: API Frameworks also reserves the codes
  from 500 for vendors, so `ApiFramework` is open to a `VendorCode`.
  `reward`, `instl`, and `skip` are flags, the integers `0` (no) and `1`
  (yes), as AdCOM 1.0 writes them.
evidence:
  - examples/line-item-display.yaml (properties, audiences, buyer_supplied)
  - examples/line-item-ctv.yaml (properties with apps)
  - examples/line-item-rewarded-video.yaml (placement)
feedback: >-
  Type the members of each inline object, and write each list member with `[]`,
  as `domains[]` and `apps[]`. Name the values of `provenance`.
