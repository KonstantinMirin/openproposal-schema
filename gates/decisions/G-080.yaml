format: 1
id: G-080
date: 2026-10-27
question: What changes in the gates when the SDK names, the schema IDs' base, the site's copy, and the feedback's target come from the spec's profile?
decision: >-
  The profile gains names (the specification's name in prose, its edition
  and release, the base of every schema's $id, and the Python, Go, and npm
  packages), site (the publisher, the public repository, the deploy target,
  and the downloads' name), and feedback (the issue, the supporting page,
  our pull requests, the headline, the groups, the rows with their intros,
  the lint-kind table, and the suggestion). The schema emitter, the SDK
  emitters, the site, and the report read each from it; the parity
  harnesses read the package from the generated tree. The $id base stays
  https://openproposal.noetis.dev/. schemas-emit, schemas-conventions,
  sdk-generate, and fidelity take the names through their input. The site
  gate fails on a spec's name written into any file under src/site/, with a
  fixture, and an asset names the spec by a token the build fills in. The
  lint-kind table is the profile's data now, so the spec-profile gate holds
  it to every lint kind, as the table's TypeScript type once did, with two
  fixtures. Two tests build the widgets fixture's SDKs and schemas with its
  own names and find none of OpenProposal's, and check the site's names;
  the suite holds 427 tests, and MIN_TESTS is 427.
rationale: >-
  No OpenProposal output changes: every committed file regenerates to its
  bytes, feedback/comment.md and details.md keep their SHA-256, and the site
  build is the one G-077 accepted. No gate is weaker: each checks what it
  checked, with the names it read from code now read from the profile; the
  site gate and the profile gate check more than before. The fingerprints
  change because the emitters, the site, the report, and their gates
  changed.
