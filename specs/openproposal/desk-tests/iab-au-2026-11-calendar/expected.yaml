# The verdict each of IAB Australia's billable-day and calendar_zone desk-test
# line items must get on the with-our-stack lock (README.md says where the
# files come from). Five engines judge every file: the lock's schemas and
# rules, as the examples gate checks an example; the stack's own checker,
# scripts/check_examples.py at the lock's commit, run on the lock's
# specification and examples with these files added to examples/; and the
# TypeScript, Python, and Go SDKs the lock's schemas generate, under
# sdk/proposed/with-our-stack/. A file with a finding is rejected at its
# `path`, and only there, by every engine; the TIME arithmetic of § 5.6.5
# is a rule on the line item (D-065), whose program every SDK is generated
# with. Every other file passes every engine.
# The desk-tests gate in `npm run ci` fails on any other verdict, on an
# undecided check or a gap not recorded here, and on a recorded one that no
# longer holds. After a lock move, review each verdict that changed before
# you change this file.
format: 1
lock: with-our-stack
document: LineItem
checker: scripts/check_examples.py
examples:
  - billable-day-a1-mon-0600-1800.yaml
  - billable-day-a2-mon-1800-tue-0600.yaml
  - billable-day-a3-mon-1800-tue-0600-two-days-spend.yaml
  - billable-day-a4-mon-1800-tue-0600-two-days-units.yaml
  - billable-day-b1-mon-2300-tue-0100.yaml
  - billable-day-b2-mon-0900-1100.yaml
  - billable-day-b3-mon-0900-1100-min1.yaml
