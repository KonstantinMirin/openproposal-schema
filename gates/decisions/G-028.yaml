format: 1
id: G-028
date: 2026-10-26
question: Which gates change when the summary profiles project the paths § 2.1 lists and require each one its "MUST contain" list names?
decision: >-
  The model projects a profile's paths, not whole fields. A path through an
  object, a list, or a copy of a constructor makes a named object,
  `<profile><type>`, marked with the type it projects, that holds only the
  members the paths name, plus a sibling the domain model makes one require,
  as a rate requires its `currency`. A path listed under a requiring
  statement that ends with a colon, and under each "plus" block that
  continues it, is required at every step; the sources gate's reading of
  such a statement now reaches the "plus" block too, through one shared
  function. A profile entry may list `paths` a cited decision reads from a
  prose item, "property names" read as `properties.available[].name` (D-028,
  which now covers the `properties` rows): each step keeps its object's
  presence, a conditional one is optional, and the sources gate fails a
  path that steps through a member no covered element writes, with a test.
  The round trip skips the projections, which restate the document's rows.
  The 17 disagreements expected under ops-c4g.23, 15 on `main`, are gone, so
  the expected file lists none; its fixture that dropped the listing is
  three fixtures that each make a disagreement: a listed path left optional,
  the whole pricing entry in place of its two paths, and a "plus" path left
  optional. The representation module no longer depends on creative. One
  new finding, with the open PRs: the manifest example's proposal entry has
  no `linked_execution`, which the summary MUST contain, under D-028. The
  test suite holds 330 tests, so its floor rises to 330.
rationale: >-
  The summaries carried every field whole and required none of them, so a
  summary that left out `line_item_id` validated, and one that carried only
  `formats.included[]` didn't. Each listed path is now required, the
  disagreements are fixed rather than listed, every fixture of the fidelity
  gate still fails it, the sources gate reads more requiring lists and gains
  a check, and the test floor rises, so no gate is weaker.
accepts:
