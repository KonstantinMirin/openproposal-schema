options:
  - id: informative
    summary: >-
      Informative until AdCOM's objects are mapped: they show objects, and
      none parses as JSON.
  - id: validate
    summary: >-
      Validate them against the objects' schemas now.
chosen: informative
rationale: >-
  The three examples show an OpenRTB 3.0 request and response with AdCOM
  objects in them. They hold placeholders such as `...` and `"...user agent
  string..."`, and the request has a trailing comma, so none parses as JSON,
  and the objects they show have no schema until the objects phase. They
  name no list code a vocabulary must accept that the lists don't already
  give.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L4697"
feedback: >-
  Make each example valid JSON: replace the placeholders with values, and
  remove the trailing comma after `buyeruid`. Give each one a complete
  payload that implementations can use as a test fixture.
