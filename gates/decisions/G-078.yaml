format: 1
id: G-078
date: 2026-10-27
question: What changes in the gates when each specification gets a profile and a plugin, and OpenProposal's readers move into its plugin?
decision: >-
  Each spec folder holds a profile, spec.yaml, valid against
  specs/spec.schema.json: its name, its front end (its text, or a published
  schema set), the documents its field rows describe, its RFC 2119 policy,
  and the features it turns on. A specification read from its text names a
  plugin under src/specs/<plugin>/ (src/specs/plugin.ts), and the extractor
  calls it through one interface: rowKind, readRow, readTypeCell,
  readValueList, readIdentifierList, and sectionOf, with its markers and
  keyword policy. OpenProposal's layouts, markers, owners, field and
  appendix rows, type grammar, value-list and identifier-list forms, section
  numbering, rule checks, fidelity readers, and round-trip notation move
  into src/specs/openproposal/; the documents come from the profile, each
  its owner in PascalCase. A new gate, spec-profile, holds each profile to
  its plugin and its mapping: a feature it turns on is one the plugin reads
  and the mapping uses, and one it leaves off is neither; each document is
  named after its owner, with an owner and a section of its own; and the
  plugin reads statements as the profile says. It has six fixtures. The
  gates whose checks take a plugin's readers through their input, fidelity,
  round-trip, rule-checks, examples-validate, variant-examples, and the
  three type-example gates, name src/specs/index.ts#PLUGINS, and with it
  every plugin's code, and the rule checks' gates name the kernel's checks,
  src/rule-checks.ts#CHECKS, which they no longer reach through
  checkProblems. Three guard fixtures weaken a plugin's rule check, its
  fidelity reader, and its round-trip notation, and expect the gate that
  reads each to change. Five tests run a fixture spec with one table layout
  and no markers, appendices, or profiles through its own plugin: it
  extracts, maps with every element covered, resolves, and emits a schema
  that validates; the suite holds 420 tests, and MIN_TESTS is 420.
rationale: >-
  No OpenProposal output changes: the committed IR, mapping, schemas, rules,
  corpora, type examples, SDKs, comparisons, and feedback are what they were,
  and the site build is the one G-077 accepted. No gate is weaker. Every gate
  reads the code it read before: a plugin's readers reach the gates through
  their input now, so each of those gates names every plugin's code in its
  fingerprint, and the guard fixtures show that weakening a reader changes
  it. A plugin that gives no fidelity readers or round-trip notation fails
  those gates rather than skipping them. The profile gate is new.
