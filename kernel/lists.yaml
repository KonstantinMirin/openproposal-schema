# The code lists other standards keep, which the specification cites (type
# rules § 6). Each list holds its codes, with each code's label, as the
# standard writes them at the pinned commit its URL names, or, for a list its
# keeper publishes outside git, at the `version` the keeper gives it, with the
# SHA-256 of the file the URL served at that version. A vocabulary that cites
# a list takes its terms from these codes, the fidelity oracle reads a
# sentence that names a list with them, and a rule's check reads the codes of
# the list its rule rests on: ISO 4217's currency codes and the IANA zone
# names. A list that reserves codes for vendors, as AdCOM 1.0 reserves 500 and
# up in some lists, says so under `vendor`. A URL that serves only the
# keeper's latest version, as SIX serves ISO 4217's List One, names under
# `copy` the repository's copy of the file it served at `version`, so the
# SHA-256 stays verifiable. Change a list only when the URL's commit or the
# list's version changes. A list a registry spec on this site keeps, as
# AdCOM keeps its lists, is never copied here: a spec's profile imports it
# from the registry's committed outputs (src/imports.ts).
format: 1
lists:
  - name: Line.frequencyinterval
    standard: OpenDirect 2.1
    url: https://github.com/InteractiveAdvertisingBureau/OpenDirect/blob/82bc294314aba017fc639ba634aecc53adfd675f/OpenDirect.v2.1.final.md#object_line
    codes:
      - { code: Day }
      - { code: Month }
      - { code: Week }
      - { code: Hour }
      - { code: LineDuration }
