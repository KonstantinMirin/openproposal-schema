        before: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", status: draft }
        after: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c02", status: draft }
      - party: buyer
        before: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", channel: display }
        after: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", channel: video }
      - party: seller
        before: { status: draft }
        after: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", status: draft }

