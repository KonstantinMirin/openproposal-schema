# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: commercial
sections: [ "5.6", 5.6.1, 5.6.2, 5.6.3 ]
types:
  - name: PricingEntry
    kind: object
    ir: "field:5.6:pricing[]"
    source: { rule: sub-field-object }
    open: false
  - name: CostMethod
    kind: vocabulary
    ir: "field:5.6:pricing[].cost_method"
    source: { decisions: [ D-013, D-014, D-026 ] }
    open: true
    terms: [ CPM, CPC, flat ]
