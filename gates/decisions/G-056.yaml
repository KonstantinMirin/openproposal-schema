format: 1
id: G-056
date: 2026-10-27
question: Must every constructor be applied on some lock, and does removing OrderedSettable, which no field applies, weaken a gate?
decision: >-
  A new gate, `constructors-applied`, fails when no mapping entry or
  declaration applies a constructor on any lock, at any depth of its
  arguments or inside the shell of an applied constructor or of a part the
  mapping reaches, unless the constructor's `kept` cites an existing decision
  that says why it stays. A `kept` on an applied constructor is stale and
  fails. `Map` passes because `Selectable`'s `pricing` applies it. Its
  fixtures add an unapplied template, take `Map` out of `Selectable`'s shell
  and the mapping, put a stale `kept` on `Range`, and keep an unapplied
  template by a decision that doesn't exist. `OrderedSettable` is removed
  with its rule `constructor:OrderedSettable:ordered`: no settable field
  states the `min` / `max` form at the field (`geo`, `device`, and `daypart`
  declare `allowed[]`, `frequency_cap` carries its range in `max`, a
  `Range`, and `commitment` is the object of § 5.6.1). The § 3.2 bounds
  sentence is mapped to `Range`, and its bare-value sentence, now cited by
  `Settable` alone, is mapped by the rule `kernel-source`. The constructor
  tests that used `OrderedSettable` use `Range` or `Settable`, a new test
  covers the gate, the test suite holds 357 tests, and `MIN_TESTS` is 357.
rationale: >-
  The new gate adds a check and relaxes none. The other fingerprints change
  because the code they reach changed: the `Constructor` type gains `kept`,
  and the constructors format schema allows it, which every gate that reads
  the constructors or `src/constructors.ts` reaches; `src/rule-checks.ts`
  loses the check of the removed rule, and `src/mapping-sources.ts` the
  removed name; the CI script runs the new gate, which the guard reads; and
  the test tree changed. No check, fixture, or exemption is removed or
  loosened: each test kept its assertion on a constructor that exists, and
  the floor rises.
