  - ir: rule:publisher-count:734470bd
    digest: 48fdd24a313b7ff1e24d711c0da61cfa54cc7945569972aeeb8885b248187b80
    quote: "Intermediaries should be identified using Supply Chain Validation from OpenRTB requests."
  - ir: rule:dynamic-inventory:0af8b640
    digest: 901e9a716b59e2c89b45a5fcd43872e6cbf24408323b70e9410671a3a66f46f6
    quote: "Implementers are strongly encouraged to communicate and discuss the specifics of any and all inventory updates to ensure expectations are met."
options:
  - id: obligations
    summary: >-
      Each statement about what a buyer, a seller, or both do, with a deal
      or with the bid requests it covers, is an obligation of that party,
      with no schema keyword and no vector.
  - id: informative
    summary: >-
      Each is guidance, with no conformance content.
chosen: obligations
rationale: >-
  These sentences say what the parties do: buyers validate bid requests
  against the deal and apply its targeting, sellers set `auxdata` when
  non-publisher data is paid for, both sides coordinate seat IDs a priori.
  None can be checked on a deal payload, so each is an obligation of the
  party it names: the buyer, the seller, or, where both are meant, each
  implementation.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L69"
feedback: >-
  Write each party's duties in capitals, and say which side each binds: many
  say "implementers", which names both.
