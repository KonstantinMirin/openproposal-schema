format: 1
id: G-086
date: 2026-10-27
question: What changes in the gates to close the gaps an independent review of AdCOM's locks and the pipeline stages found?
decision: >-
  The spec-profile gate holds a spec's folder to an allowlist: the entries
  of the stages the spec has reached, and none other, so a file that no
  stage writes fails instead of sitting where no gate reads it; a fixture
  covers it. Rule vectors move to the outputs stage, since only the rule
  gates read them. A lock may name the upstream tag that names its commit,
  and the snapshot gate fails, wherever a clone is reachable, when the tag
  names another commit or none; a test builds a clone, moves its tag, and
  checks both. The site gate's fixture for a spec's name in the site's code
  writes OpenProposal's name and expects it again, as it did before the
  second spec joined. Each gate's line names its spec where more than one
  runs. The test suite holds 442 tests, and MIN_TESTS is 442.
rationale: >-
  Each change adds a check or restores one: the allowlist replaces a
  denylist that let an unknown entry pass, and the tag check catches a tag
  that moves. Nothing is relaxed, and no output changes.
