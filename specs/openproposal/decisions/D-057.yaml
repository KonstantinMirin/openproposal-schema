options:
  - id: obligations
    summary: "Each binds the party its subject names: a seller, a buyer, or a receiver, and otherwise every implementation; the conformance of a party's behavior is checked by its tests, not by a payload's schema. What a schema can check, each row's type and presence, its tables state, and the schemas take from them."
  - id: rules
    summary: "Each is a rule with test vectors."
chosen: obligations
rationale: >-
  The stack states its payload forms in its tables, each row with its type and
  its presence (§ 2.6), and its prose statements say what a party does: what a
  seller publishes, records, or refuses, what a buyer writes, and how a
  receiver compares, recomputes, or ignores. A statement that reads a payload
  alone the tables already give, as a type's form or a key's presence. The
  rest bind the party that acts, so each is an obligation on the party its
  subject names.
feedback: >-
  None needed.
