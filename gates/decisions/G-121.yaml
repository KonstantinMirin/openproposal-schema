format: 1
id: G-121
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of the Deals API's value domains found?
decision: >-
  A model property carried its stated default, but no schema did, so a
  currency whose default satisfied the money beside it left the money with
  no currency in the schema. The emitter now writes a property's `default`
  beside its `$ref`, an annotation the output check allows there beside the
  description, and the output check fails a default that the type its
  `$ref` names rejects, as it fails any constraint beside a reference; a
  fixture covers it, and a test follows a default from the IR through the
  model, where it satisfies the currency, to the schema. A basis no longer
  makes a defaulted sibling conditional. An integer extension that would
  match several codes is now a problem the emitter reports, not an
  exception. `CountryCode`'s rule reads every code ISO 3166-1 assigns,
  territories too, with Antarctica valid and the retired Netherlands
  Antilles invalid among its vectors, and `Ext` rejects null. The kernel's
  OpenRTB links name the anchors the text writes. LICENSE leaves
  kernel/sources/ to its files' own terms, and NOTICE keeps the iso-codes
  file's copyright line. The type rules list every domain and say how a
  specification that names an extension point uses `Ext`. The test suite
  holds 517 tests, and MIN_TESTS is 517.
rationale: >-
  The output check gains one check, and the emitter writes an annotation
  the specification states; nothing is relaxed. No OpenProposal or AdCOM
  property states a default, so their schemas don't change.
