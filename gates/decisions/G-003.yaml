format: 1
id: G-003
date: 2026-10-25
question: How does a gate's fingerprint see a change to a helper in another file, a configuration file, or the test tree, and how does the test suite fail when fewer tests run?
decision: >-
  A gate's fingerprint now digests every declaration its definition and its
  named code reach, through the imports of repository modules, in any file,
  not only in the file that declares it. The typecheck gate's fingerprint
  reads tsconfig.json, and the test suite's reads package.json and every
  file under test/. The test suite gate runs package.json's test script as
  `npm test` does, and fails when fewer than MIN_TESTS tests run, so a test
  glob that matches nothing or a deleted test file fails. The typecheck
  fixture runs the real invocation on a configuration that extends the
  repository's, with errors only its strict options reject; the test suite
  fixtures run the real test script with a failing test, with a glob that
  matches nothing, and with one test file. The guard gets the independent
  review's probes as fixtures, each a fingerprint recomputed over the tree
  with one file changed: inScope always true, ajv-formats removed, strict
  false in the corpus validators and in tsconfig.json, a test glob that
  matches nothing, and a deleted test file. Every gate's fingerprint changes,
  so this record accepts each one.
rationale: >-
  The review weakened gates through files their fingerprints didn't read: a
  helper in another file, the compiler configuration, the test glob, and the
  test files, and the guard passed each. Each change reads more, and the new
  fixtures show each probe now changes the gate's fingerprint, so no gate is
  weaker. A fingerprint still ignores code its gate doesn't reach, so an
  unrelated change needs no record.
