format: 1
id: G-063
date: 2026-10-27
question: How does the pipeline build the schemas as the specification writes them, with every change we propose switched off, and what holds that build to the text and to the proposed one?
decision: >-
  `variants/as-written.yaml`, validated by `variants/variant.schema.json`,
  which takes a primitive from `kernel/kernel.schema.json`, has one switch per
  decision record of kind `departure`, naming the record's option the variant
  takes and what it does to the pipeline's inputs before the model resolves:
  `replace`, `retype`, `withhold`, `convert`, and `rewrite`, with the
  examples' failures the switch causes under `findings`. `src/variant.ts`
  applies a variant, and `src/builds.ts` resolves each lock's proposed and
  variant builds for the generating CLIs, which take `--variant`.
  `resolveModel` takes `withhold`, the option objects the selectable
  template gives no member their text doesn't list; the schemas we propose
  pass none, so their model is unchanged byte for byte. A model's `input`
  may name its `variant`, which the SDK headers name. The kernel format
  accepts the `date` format, which JSON Schema 2020-12 defines and the SDKs
  already check. Four new gates: variant-load, on a file whose switch names
  no option; variant-check (`checkVariant` and `checkKernel` on the
  variant's primitives), with fixtures for a switch that takes the chosen
  option, a departure with no switch, a retype of an element the departure
  doesn't cover, a replaced type it doesn't introduce, and a primitive's
  valid vector its constraints reject; variant-diff (`checkVariantDiff`),
  per lock, with fixtures for a retyped property, a dropped type, and a
  dropped member no switch withholds; and variant-examples
  (`checkVariantExamples`), per lock, with fixtures for a switch's finding
  removed, a switch's finding that no longer fails, and a gap's recorded
  finding removed. `scripts/ci.ts` runs, on each lock's variant build, the
  kernel engines and sources gates on the variant's primitives, the
  schemas, rules, fidelity, type-examples, SDK, corpus-generates, and
  examples-oracle gates, the fidelity gate with no departure in force, and
  adds the variant's files to the tracked-file gates' expected files and
  its report, `comparison/as-written.json` and `.md`, to the comparison's.
  `variants/` joins the tracked directories. Eleven tests are added; the
  suite holds 380 tests, and `MIN_TESTS` is 380.
rationale: >-
  No gate is relaxed: every gate the proposed build passes runs unchanged
  on it, and the variant's build passes the same gates as a second input,
  plus the new ones, which fail on each of their fixtures. The fidelity
  gate passes on the variant with the departures left out of its records,
  so nothing excuses a disagreement there: as written, the schemas state
  what the text states in every form the oracle reads. Most fingerprints
  change only because `resolveModel`, which their code reaches, gained the
  `withhold` input, which defaults to nothing; kernel-load because the
  kernel format accepts `date`; the SDK gates because the headers can name
  a variant; the comparison gates because the comparison also writes the
  variant's report; the guard because the CI script runs the new gates;
  the untracked-file gate because its directory list gains `variants/`;
  and npm-test because of the new tests. The specification's examples fail
  10 times at 10 places on main as written, against 58 at 55 as proposed,
  and 16 at 16 with the open PRs, against 92 at 88: the gaps' 5 and 10
  failures, and the 5 and 6 that D-047's switch lists, since as written
  the production, measurement source, and reporting options have no `id`
  that `included[]` and `pricing` could name them by.
