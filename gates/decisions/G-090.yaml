format: 1
id: G-090
date: 2026-10-27
question: What changes in the gates to close the gaps an independent review of AdCOM's mapping found?
decision: >-
  The kernel engines gate fails on an oracle gap that names a primitive the
  kernel file doesn't define, which no spec's kernel would check, so a gap
  can't go stale by naming a primitive no spec holds. The kernel file itself
  must define at least one constructor and one part, though a spec's binding
  may leave them all out of its kernel. Two labeled lists are one list only
  when their codes and their labels both agree, instead of never, so a
  labeled list can't escape the list gate by its flag. A list's head noun
  takes English's -es plurals too. Tests cover the vocabulary declaration
  checks, the labeled lists in the list and duplication gates, the gap
  check, and the kernel file's constructors; the suite holds 451 tests, and
  MIN_TESTS is 451. AdCOM's decision records on its keyword reading, its
  naming, its deferred objects, its start delays, its list statements, and
  its examples correct their facts.
rationale: >-
  Each change restores or tightens a check that the multi-spec kernel had
  loosened, and no check is relaxed. OpenProposal's outputs don't change.
