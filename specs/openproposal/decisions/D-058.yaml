options:
  - id: restate-or-illustrate
    summary: "A list or a table that writes the terms of a list the text defines elsewhere restates it, which that list's schema expresses: the core error codes, `cost_method`'s terms, the metrics, and the `transaction_mechanism` tables. A list of the values a transition moves between, a code block that shows one field or a formula, a `unit` column's terms, a list of the keys of an `Object` another definition sets, and a field's core terms for options typed `VocabularyTerm` are informative. `RequestedValue.unit_bounds` repeats the requestable field's form, a `Range[Integer]`, named after `RequestedValue`. Appendix B's \"What the distribution says\" restates the counts of the field rows' markers, so its figures are what the rows give, and a figure the paragraph writes otherwise would be a round-trip difference."
  - id: vocabularies
    summary: "Each list is a vocabulary of its own."
chosen: restate-or-illustrate
rationale: >-
  § 2.6 says a list is written once and other mentions point to it. The core
  error codes repeat the `code` table, the `cost_method` terms its table, the
  metrics the `metric` table, and both `transaction_mechanism` tables
  `TransactionMechanism`'s list. The transition lists name values of `status`
  and `hold.status`; the YAML blocks show one field each; the § 4.1.1 block
  names paths a record leaves out; and the § 5.6 block is a formula. `unit` is
  a column, not a key on the entry; `asset` and `voice` are keys of a
  `FormatSpec`'s `spec`, an `Object` another definition sets; and
  `shortfall_remedy` holds `Selectable[VocabularyTerm]`, whose options the
  text types as terms. Appendix B's paragraph counts the markers its table
  and the field rows write: with § 5.9's `retention` `requestable`, 27 fields
  the buyer touches, 6 `requestable`, 71 remaining, and 6 round trips, the
  figures the rows give.
feedback: >-
  None needed.
