format: 1
id: G-048
date: 2026-10-26
question: How does the feedback gate hold the generated gist to working links into the specification, and to the record lists and lock facts the details now show?
decision: >-
  The feedback gate also renders the details and checks their lint tables:
  each finding with a place on `main` links at least one of its lines, and
  every link is the permalink of the snapshot's specification at the
  default lock's full commit, at a line the file has, that isn't blank, and
  that is under the heading of the section the link names. A finding about
  a whole table has no line, and the gate's note counts it. The gate also
  fails on a list item in a record's folded text with no blank line before
  it, which YAML would fold into the line above. Four fixtures move a
  finding past the end of the specification, move one into another section,
  give the default lock a branch name for a commit, and give a record a
  list item with no blank line. A lock that merges PRs now names the day
  its heads were live, `heads_on`, and what the integration changed beside
  the merges, `edits`, and the loader fails on either one without
  `merge_order`, on a lock with `merge_order` and no `heads_on`, and on a
  date the calendar doesn't have. The gates that load a lock read the
  loader, and the test suite gains five tests, so their fingerprints
  change with no change to what they check.
rationale: >-
  The gist the generator writes links each finding to its line, so a
  broken or moved link would mislead the working group; the gate now fails
  on one. Every earlier check stays, the loader rejects more, and the
  fixtures and tests are added, so no gate is weaker.
