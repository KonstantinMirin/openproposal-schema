format: 1
id: G-103
date: 2026-10-28
question: What changes in the gates when a committed metric's value is typed by its metric, a fraction for a rate and a measure for any other, in place of a fraction for every metric?
decision: >-
  D-005 read every `committed_metrics[].value` as a fraction from 0 to 1,
  which was too broad: the as-written schema rejected a DOOH line item
  committing 1,200,000 audience impressions. The kernel gains the
  primitive `Measure`, a number never negative, with its vectors (0,
  1200000, and 14.2 valid; -1, -0.5, and a string invalid), and the
  quantity domain the concept `measure`, which this record accepts; AdCOM's
  binding marks it absent. A basis (kernel/domains.yaml, type rules § 3a)
  may now give `others`, the concept of every term it doesn't name, an
  open vocabulary's extension terms included; the member's own type is
  then that concept's type, and each named term narrows it. OpenProposal's
  binding reads `Metric` so: `viewable_rate` and `completion_rate` make
  the value a fraction, and every other metric a measure, under D-005. So
  the value of `CommittedMetricsEntry` is a `Measure`, `if` / `then` /
  `else` narrows it to a `Fraction` for each rate, and the value requires
  its metric, as an amount requires its basis. The domains check fails a
  basis whose other-terms concept is unknown or repeated by a named term,
  or that names one term with no concept for the others; the model fails a
  basis whose member type isn't the others' concept, or that names a term
  its vocabulary doesn't hold, with tests of each. A test holds the four
  committed schema trees, under Ajv and the reference oracle, to the
  verdicts: 1,200,000 and 14.2 for a DOOH metric valid; `viewable_rate` 0.7
  valid and 70 invalid; `completion_rate` 1.01 invalid; a negative count
  invalid; a value with no metric invalid. `Measure` shares `Amount`'s
  structure, so the domain file lists `amount` and `measure` together as a
  shared structure, with D-005 and D-036 and the reason a receiver treats
  them differently, and the kernel test's Budget twin now fails against
  both. The plain generator writes no `if` / `then` and drops
  `dependentRequired`, so the corpus's three new cases of
  `CommittedMetricsEntry` join the exemptions PG-1 and PG-9 for those very
  limits. Type rules § 3a states the basis rule with `others`, and § 1 lists
  `Measure`. Every gate that reads the
  kernel, the domains, or the model changes its fingerprint. The test suite
  holds 482 tests, and MIN_TESTS is 482.
concepts: [measure]
rationale: >-
  A schema that rejected what the text allows is corrected, so the
  committed value's check is relaxed for metrics that aren't rates, where
  it was wrong; for the two rates it is as strict as before, and the new
  requirement that a value carry its metric is stricter. Every gate keeps
  its checks, the domains and model checks gain four, and the corpus
  derives the new conditions' cases. The two exemptions grow by three
  cases of the limits they already name, which the oracle and Ajv still
  check. feedback/details.md changes in D-005's
  decision alone; comment.md doesn't change.
