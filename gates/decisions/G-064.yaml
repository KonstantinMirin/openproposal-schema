format: 1
id: G-064
date: 2026-10-27
question: Which base does every emitted schema's `$id` take, now that the public site serves the schemas?
decision: >-
  `SCHEMA_BASE` in `src/emit.ts` is `https://openproposal.noetis.dev/`, so
  each file's `$id` is its path under the public site, such as
  `https://openproposal.noetis.dev/schemas/kernel/1/kernel.json`, where the
  site serves it. Every `$ref` between files stays relative. The schemas,
  rules, corpus, type examples, and release manifests are regenerated; the
  model, the SDK types, the comparison, and the feedback don't change.
rationale: >-
  Only the base string changes, which every gate whose code reaches
  `emitSchemas` or `schemaIdOf` digests, so their fingerprints change and no
  check does. The output gates still check that every `$id` is the file's
  path under the base and that every `$ref` resolves, and the release
  gates recompute every digest from the regenerated files. No release is
  frozen, so no frozen file's `$id` changes.
