format: 1
id: G-115
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of the Deals API's locks found?
decision: >-
  `lockFiles` sorted a spec's lock files by name and relied on
  `spec-lock.yaml` sorting first, so a lock named, say,
  `release-1.lock.yaml` would have become a spec's default unseen. The
  default lock now comes first whatever the others are named, and a test
  holds it with locks that sort before it. The Deals API's test now also
  pins the introduction's word that the tag spells otherwise. G-113 left out
  why the profile reads keywords in any case: the Deals API's text holds no
  RFC 2119 keyword in capitals and states no convention, and writes 28
  "should", 19 "may", 6 "required", 5 "must", and 5 "recommended" in
  lowercase, which a decision of the spec's records once its model is
  mapped. The profile's comment now says the spec will take AdCOM's lists
  once its model is mapped, and the NOTICE keeps AdCOM's paragraphs
  together. The lock of the tag keeps the name `tag-1.0-202602`, which the
  task names; no spec imports the Deals API, so no import's lock pattern
  reads it.
rationale: >-
  Every gate that reads a spec's locks reaches `lockFiles`, so each is
  fingerprinted anew; the order of every spec's locks today is unchanged,
  so no output changes.
