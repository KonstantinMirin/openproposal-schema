format: 1
id: G-126
date: 2026-10-28
question: What changes in the gates when the Deals API reaches every stage, with its scenario rows as examples, its corpus, its type examples, its round trip, its release manifests, and its lock comparison?
decision: >-
  The Deals API's profile names no stage, so every gate runs on it. An
  example entry for a row of a table whose columns after the first are
  headed by member names, as the Example Scenarios, may read a column whose
  header names no member as a member path, `columns`, as D-030 reads
  `curationfee` as `curation.curfeetype`; the model writes the row as part
  of a value, each column's code at its member, the first column, the
  row's prose, left out, and fails on a column whose header or read path
  names no member of the object at some step, on a read column the table
  doesn't have, and on columns read off an element that is no table row. The plugin's round-trip notation renders
  each attribute table from the model: the attribute's name, its Type cell,
  the JSON type in the text's words with `default` and `required`, and each
  code list in its Description cell from the property's vocabulary or
  titled codes, a code the list gives twice once per meaning, with the
  row's prose kept; a row pairs only with its own object's property, so a
  property the model moves to another object shows, and a property of the
  object that cites no row is a row the text lacks, rendered at the end.
  The ten cells where it differs from the text are
  recorded: nine Type cells whose wording D-033 reads, `integer` beside
  `int`, a `;` beside a `,`, and `recommended`, and `guar`'s codes, which
  D-018 types as the integer flag. Seven fixtures cover the new checks: an
  example row that reads a column its table lacks, one whose column names
  no member of its object, columns read off an element that is no table
  row, a code label the model changed, a default it dropped, a property it
  adds to an object, and one it moves to another. The test suite holds 530
  tests, and MIN_TESTS is 530.
rationale: >-
  No check is relaxed: the Deals API's outputs now meet every gate the
  other specs do, and the round trip compares every attribute row and code
  list of the text, and every property of each object. OpenProposal's and AdCOM's outputs are unchanged.
