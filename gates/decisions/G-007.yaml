format: 1
id: G-007
date: 2026-10-26
question: How do the gates read the line item's clock and the daypart window's one time of day, which the open-PRs lock now states with PR #123?
decision: >-
  The extractor reads "REQUIRED with" in a presence: the members it names in
  code spans, or for "either" the two code spans of the sentence before it,
  and fails where "either" has no such sentence. The emitter states a member
  required with a sibling as `dependentRequired`, and with a member of a
  sibling's object as `dependentSchemas` with an `if` on that object, beside
  the object's own `if` / `then`. A part may reject one value of one member
  with `if` / `then: false`, as a daypart window rejects a `start` of
  `24:00`. The corpus finds both as constraints, builds their baselines,
  and isolates their mutants; the SDK builders and the three runtimes check
  both; the output gate reads a dependency's required names against the
  object it keys and the member's object. The fidelity oracle's conditional
  form reads a presence required with members, with new fixtures that drop
  each dependency or widen the period one to the whole cap. A mapping rule,
  `restated-part`, maps an inline object that writes exactly a part's
  members to that part, and a part may be restated. A primitive's, part's,
  or rule's decision applies only on the locks `decision_locks` lists, and a
  primitive's lock-scoped spec source only on its lock. The round trip
  renders a part's members where a row's inline object restates it. The
  plain generator's exemptions drop the `Hour` and `Minute` cases, which no
  longer exist, and add the cases for the new keywords the generator drops,
  each under the reason that covers it, with PG-11 for `dependentSchemas`.
  The component fixture of the domain gate uses `TimeOfDay`, the component
  that replaces `Hour`. The test suite holds 305 tests, so its floor rises
  to 305.
rationale: >-
  PR #123 states `time_zone` as "REQUIRED with either", which the extractor
  couldn't parse, and the window as `HH:MM` civil times, which the kernel's
  `{ hour, minute }` object contradicted. Each change reads or states more
  of what the text says: two conditions the schema can now express in
  standard keywords instead of a rule, one constraint of the window in the
  schema instead of prose, and every new constraint isolated in the corpus
  and checked by the oracle and all three SDKs. No check accepts a value it
  rejected, every new exemption names a case the reference rejects and the
  generator can't, and the test floor rises, so no gate is weaker.
accepts:
