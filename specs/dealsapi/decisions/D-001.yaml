options:
  - id: any-case
    summary: >-
      A sentence with a requirement keyword in any case, such as "must",
      "should", "may", "required", or "recommended", is a statement with
      that keyword's level, and "strongly encouraged" reads as recommended.
      A sentence that uses the word in its ordinary sense, as "Some level of
      trust is required" does, states no requirement on a deal or a party.
  - id: uppercase
    summary: >-
      Only a keyword in capitals states a requirement, as in a text that
      adopts RFC 2119; the Deals API's text then states none.
chosen: any-case
rationale: >-
  The text writes every requirement in lowercase, "should be provided",
  "must bid on the deal", and adopts no convention that reserves capitals,
  so an uppercase-only reading would find no requirement at all. Reading
  every keyword keeps each requirement as an element a decision can cite,
  and its level sets a rule's severity: a should is a warning, a must an
  error. Some sentences use the keyword in its ordinary sense: what a field
  may hold ("This may be the same as the origin or curator"), what future
  versions may add, what a scenario may do, or what the text allows a party
  to choose ("Implementers may choose to accept incoming webhooks"). Each of
  those is informative, and it is listed here.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L185"
feedback: >-
  State which words carry requirements: adopt RFC 2119 and BCP 14, and write
  the keywords in capitals where a sentence states a requirement. Today
  "must", "should", and "may" appear in lowercase both as requirements and
  in their ordinary sense, as in "Some level of trust is required when
  buying any Deal ID", so an implementer can't tell which sentences bind
  them.
