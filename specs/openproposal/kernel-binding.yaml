homonyms:
  - member: basis
    decision: D-013
    reason: Four lists go by `basis`, so each is the vocabulary of what it bases, named after it. A commitment's and a `min_commitment[]` threshold's `basis` say what the amount is (`CommitmentBasis`); an availability's, a committed metric's, and a frequency cap's each name a list of their own.
  - member: id
    decision: D-037
    reason: An object option's `id`, which the selectable template gives every object option (D-046, D-047), is the identity the seller mints for the option, a minted ID that `included[]` and the `pricing` keys name it by; an external reference's `id` is the ID another system keeps.
  - member: status
    decision: D-013
    reason: A proposal and a line item each have a status, with different states, so each is the vocabulary of its own object.
  - member: type
    decision: D-013
    reason: Four objects name a type, and each means a different list, so each is the vocabulary of its own object, named after it.
  - member: version
    decision: D-027
    reason: A proposal's `version` and every reference to it count the proposal's revisions, which the seller increments, a count; a terms reference's `version` is the terms document's version as its publisher writes it, an external ID.
bases:
  - vocabulary: CommitmentBasis
    member: amount
    terms: { spend: amount, units: count }
    decision: D-036
shared_structures:
  - concepts: [external-id, text]
    decisions: [D-024, D-025, D-027]
