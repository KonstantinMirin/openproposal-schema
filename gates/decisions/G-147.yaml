format: 1
id: G-147
date: 2026-11-11
question: What changes in the gates when the with-our-stack lock moves to the stack's head at `7488716`, where `Screen.lat` and `Screen.lon` read "Absent when `movable` is `true`", and the emitter states an "Absent when" a boolean sibling holds a value?
decision: >-
  The lock reads op30-packages at `7488716`, where #142 to #152 and #154
  moved. Its specification differs from `63733ed` in two rows of § 5.2.8:
  `Screen.lat` and `Screen.lon` now read "Absent when `movable` is `true`",
  a value in a code span, where they read "is true". The fidelity oracle
  reads both in the form G-146 added: either member present while `movable`
  is `true` is invalid, and present while it is `false` is valid. The
  emitter states "Absent when" a boolean sibling holds a value as a
  dependency of the member on the other boolean, `dependentSchemas: { lat:
  { properties: { movable: { const: false } } } }`, with no `required`, so a
  screen with no `movable` keeps its coordinates. The corpus builds a
  baseline and an isolating mutant for each `const`, the type examples set
  `movable` to `false` where `lat` or `lon` is present, and the SDKs check
  it: the TypeScript runtime gains `absentWhen` beside `absentUnless`, the
  Python runtime's `absent` entries name which word they hold, and Go
  writes it in the type's validation. One reviewed vector of
  `rule:5.2.4:ea387bb0`, a screen with coordinates and `movable` true, now
  has `movable` false, since the row makes the screen invalid. The plain
  generator drops the dependency (PG-23), and the fidelity gate gains a
  fixture that drops it, which the gate fails.
rationale: >-
  No check is weaker: the emitter states two more constraints, the oracle
  reads 3 of the stack's 8 "Absent unless" and "Absent when" sentences, and
  5 stay unread with a condition in prose. Neither `main` nor the open PRs
  write an absence in a row, so their IR, models, schemas, rules, corpus,
  type examples, SDKs, comparison, and feedback are byte-identical. The
  golden snapshot counts the two new code spans. The fingerprints change
  because the emitter, the corpus, the type examples, the SDK emitters, the
  fidelity fixtures, the plain-generator exemptions, and the golden
  snapshot reach these gates.
