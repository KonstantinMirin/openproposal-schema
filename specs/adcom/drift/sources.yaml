# The artifacts the drift report (src/drift.ts, `npm run drift`) compares
# AdCOM's lists with, and which enum of each holds each list. Each source's
# folder is read from its snapshot under drift/snapshots/<source>/, which
# holds all of the folder and must hash to the pinned git tree, so no file
# can be left out; a reachable clone must agree with every pin. A list's
# enum is null where the artifact defines none for it. Every list of the
# registry's text is named once, and every enum the files define is named for
# one list, so the report leaves no list or enum out. The pairs are by meaning, not name: adcom-proto calls
# List: IP Location Services `LocationService`, and Prebid calls List:
# Creative Subtypes - Audio/Video `MediaCreativeSubtype`.
format: 1
# The registry lock whose lists the report reads.
lock: main
sources:
  # IAB Tech Lab's protocol buffer definitions of AdCOM, its README titled
  # "(WIP)"; enums.proto holds every enum adcom-proto defines, three of them
  # nested in message Creative.
  - id: adcom-proto
    title: adcom-proto
    upstream: https://github.com/IABTechLab/adcom-proto
    commit: 921f85e685fed869344437378f4dea2be19b7b49
    clone: vendor/adcom-proto
    reader: proto
    folder: proto/com/iabtechlab/adcom/v1/enums
    tree: c46b47d117a0a572a18cd4418e54139b5f2363e6
    license: { path: LICENSE, blob: 261eeb9e9f8b2b4b0d119366dda99c6fd7d35c64 }
  # Prebid's Go types of AdCOM, which Prebid Server uses; each list's type and
  # constants are in a file of its own under adcom1/, among the objects'.
  - id: prebid-openrtb
    title: Prebid adcom1
    upstream: https://github.com/prebid/openrtb
    commit: 0d01af1cd27503d7edd0584fadb7e740ab83cc9c
    clone: vendor/prebid-openrtb
    reader: go
    folder: adcom1
    tree: 1591f1764b7f66df16c190d5b383927c6e376a3c
    license: { path: LICENSE, blob: b7fa401fa4b79b208b1dbc4679b09b8f4691adbf }
lists:
