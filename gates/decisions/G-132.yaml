format: 1
id: G-132
date: 2026-10-28
question: What changes in the gates when AdCOM's lists are written as proto3 enums from the published schemas alone, and the enum drift report compares them?
decision: >-
  A first target, the proto target (src/targets/proto.ts, `npm run proto`,
  docs/design/target-rules.md), writes each integer-coded vocabulary of a
  spec's published schema tree as a proto3 enum. It reads only the
  documents the tree's release.json lists and the package the profile's
  new `names.proto.package` gives; AdCOM's is `adcom.v1`, and its one file
  is specs/adcom/proto/adcom/v1/lists.proto: 42 enums, 316 values, each
  enum named as its $defs key, each value the enum's UPPER_SNAKE prefix and
  the code's name by type rules § 6, numbered as the code, with
  `<ENUM>_UNSPECIFIED = 0` where the list has no code 0. Vendor ranges and
  Start Delay's media offset are no values; proto3's open enums keep them.
  Five new gates: proto-builds (no emitter problem, and the pinned protoc
  compiles every file), proto-schema-only (every module the emitter
  reaches, static or dynamic, sits under src/targets/; no target's code
  names a spec's folder or profile name, in any case; and a run on a copy
  of the tracked schemas/ alone writes the same bytes), proto-deterministic,
  proto-committed, and proto-tracked. A sixth, enum-drift-target, holds
  the proto file to the registry: an enum for every list with codes, named
  as its vocabulary, every code at its number, and no value but the unset
  one. The enum drift report gains the proto file as a column and a names
  section, for a reader and not as drift, that lists each enum and value
  adcom-proto and Prebid name otherwise. Its sentinel rule also takes a 0
  named "unspecified", as the proto file's are. `proto` is an output stage's
  entry of a spec's folder, and the suite holds 540 tests.
rationale: >-
  No check is relaxed. Every gate that reaches the profile's types
  (src/profile.ts's SpecNames gains the optional `proto`, and STAGE_ENTRIES
  the `proto` entry) changes fingerprint without changing what it checks;
  that accounts for the pipeline gates in this list. The enum drift
  sources gate reaches the refactored comparison, which gives adcom-proto
  and Prebid the same totals as before. No other spec's output changes:
  OpenProposal's and the Deals API's committed files, sdk/, and feedback/
  are byte-identical.
