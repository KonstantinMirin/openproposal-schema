format: 1
id: G-117
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of the Deals API's extraction found?
decision: >-
  An anchor on a line of its own was read only as `<a name="…"></a>`, so
  another spelling became an empty paragraph and its heading took a slug
  for its ID unseen. It is now read by its `name` or `id`, quoted either way
  or bare, beside other attributes, and an anchor that names nothing, names
  itself twice, or sits in a list or a quote fails. An expression whose
  values are joined by commas is checked value by value. A row's owner is a
  name its table defines, so `deal.id` resolves. A Type cell's default must
  be a value of its base, and a cell with a code span, a link, or HTML
  fails. A code line may follow a lead that ends in a colon, and a label in
  prose may hold an abbreviation's period. A plugin may list the
  abbreviations its text writes mid-sentence, whose period ends no
  sentence; the Deals API lists "i.e." and "e.g.", so its line 128 statement
  is one sentence. The Deals API's plugin holds the profile's documents to
  the text: each names the section of its object, no attribute holds it, and
  every other object is one an attribute holds. The extraction report
  counts the two rows that cite AdCOM's lists, and says why Implementation
  Guidance is body, not a part of its own, and how sentences that use a
  keyword in its ordinary sense are read: extraction keeps every sentence
  with a keyword, 54 per lock, and the mapping reads each, as for AdCOM.
  G-116 said no check was relaxed for an existing spec; the IR schema did
  loosen the field owner's enum and make the marker optional, which
  OpenProposal's row reader still enforces, so its IR is unchanged. Two
  extraction fixtures run on the Deals API's text, an anchor that names
  nothing and a document whose section describes another object. The test
  suite holds 511 tests, and MIN_TESTS is 511.
rationale: >-
  Each change fails a form that was read wrong or dropped, or reads one the
  text writes; the lint resolves one name more and checks one value list
  more finely. AdCOM's and OpenProposal's IR and findings are unchanged.
