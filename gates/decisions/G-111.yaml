format: 1
id: G-111
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of the titled const vocabularies found?
decision: >-
  Code titles misread some rows: Feed Types' class, as `AOD`, named several
  codes; a URL's colon split two titles; a version's period kept others
  whole; and rows that start with "- " or run on as sentences gave poor
  names. A title is now the name a row starts with before a colon and a
  space, or else its text without a leading "- ", a URL, or a final period,
  cut at its first clause outside parentheses past 60 characters; a name two
  codes share before their colons is a class, so they are named by the text
  after it, and a name still shared takes its code. The conventions check
  now fails an extension branch that also takes a code, so a value would
  match two branches; two codes with one title; an integer-coded vocabulary
  with no title or description; one written in any form but titled const
  branches, an anyOf of consts among them; and codes other than the
  model's, with five fixtures and a test that every AdCOM list's titles are
  unique. Type rules § 6 limits the enum and anyOf forms to string
  vocabularies and states the title algorithm, and the SDK naming rule now
  covers negative codes, long names, and a real collision. G-108 named § 2
  where its keyword change is in § 8, and left out that AdCOM's lists no
  longer reference its kernel, so `VendorCode` and `MediaOffset` there are
  referenced by its model alone. The copied-codes check the review found
  blind to const branches was rewritten under G-110. OpenProposal's schema
  view of a registry vocabulary is filed as follow-up work. The test suite
  holds 496 tests, and MIN_TESTS is 496.
rationale: >-
  The conventions check gains five rules and loses none; titles change and
  no verdict does. OpenProposal's with-open-prs release manifest changes in
  its imports' digests, since AdCOM's lists file changed.
