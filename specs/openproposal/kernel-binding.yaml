# The OpenProposal kernel binding (src/binding.ts): what OpenProposal adds to the
# shared kernel's definitions in kernel/primitives.yaml, constructors.yaml, and
# domains.yaml. Each item is named as the kernel names it. A spec source is
# quoted and digested; regenerate a quote and a digest with
# `npm run cite -- --all-locks <IR element ID>`.
format: 1
spec: openproposal
primitives:
