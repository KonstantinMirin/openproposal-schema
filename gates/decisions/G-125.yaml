format: 1
id: G-125
date: 2026-10-28
question: What changes in the gates when the Deals API emits its schemas, rules, and vectors, before its examples, corpus, and other outputs?
decision: >-
  The pipeline gains a stage, `schemas`, between `model` and `outputs`: a
  spec that has reached it holds its JSON Schemas, its rules, and their
  vectors, and CI runs on it the schema, rule, fidelity, and
  registry-agreement gates, and no gate of its corpus, type examples,
  examples, round trip, release, or comparison, which the `outputs` stage
  writes; the spec-profile gate holds it to no such file. The Deals API is
  at `schemas`. Its plugin gives the rule checks of its eight rules, which
  count characters, not UTF-16 units, read the pushed deal's `id` as a
  status response's context, and leave undecided only what a part of a deal
  leaves out and the rule turns on; and the fidelity oracle's readers of its
  Type cells, a presence of one level, `required`, or `recommended` or a
  bare cell, both optional as type rules § 4 reads them, its type, and its
  default or none, and of its Description cells, their codes, each a value,
  with every integer from a "values N and greater" sentence's N up, and a
  sentence that says what an empty list means. The oracle gains the form
  `default`: the schema's node for the member carries the stated default,
  and a value equal to it is accepted, or, where the row states none,
  carries none; a departure may list it. A closed list of integer codes is
  also tested with the code below its lowest and the first code missing
  between two it lists, as the Deals API's tag lists `sellerstatus` 0, 1,
  2, and 4; OpenProposal's and AdCOM's lists give no new disagreement. A
  vocabulary of a specification's own labeled list is titled with its name
  in words and described by the attribute whose codes it holds, as type
  rules § 6 asks of every integer-coded vocabulary, and a code the list
  gives twice is titled by both its meanings. The registry agreement no
  longer reads a vocabulary of the specification's own labeled list as a
  copy of a registry's list for its codes alone, as the Deals API's
  `sellerstatus`, `0` = deal is active, is no AdCOM Volume Normalization
  Mode; its labels or its name still make it one. A profile's import may
  carry allowances, each citing a decision record that must stand and cover
  the row the citation sits in, on the locks it names or on every lock: a
  list the text names other than as the registry titles it, read as the
  registry's list, and links at a branch rather than the pinned commit; an
  allowance that excuses no citation on a lock it reads fails. The Deals
  API's D-027 reads "List: Device Type" as AdCOM's List: Device Types and
  its links at AdCOM's main as the pinned commit. Twenty fixtures cover the
  new checks: a default the schema drops, changes, or adds; a required
  attribute left optional and a bare cell's made required; an empty list
  rejected; a Deals API list that loses a code or its vendor range, takes
  a code below its lowest, or, on the tag, the code it skips; a citation or
  a link with no allowance; an allowance whose decision doesn't cover the
  row or the line, no longer stands, reads another lock, or excuses
  nothing; an own labeled list titled with a registry's labels or named
  after its list; and a spec at its schemas that holds its corpus. The
  test suite holds 528 tests, and MIN_TESTS is 528.
rationale: >-
  No check is relaxed: a copy is still a copy by its labels or its name, an
  allowance excuses only a row a standing decision covers and fails when it
  excuses nothing, the oracle tests more values than before, and the new
  stage runs every gate of the files it holds. OpenProposal's and AdCOM's
  outputs are unchanged: OpenProposal's profile has no allowance and its
  model no own labeled list, and the agreement gate doesn't run on AdCOM,
  a registry.
