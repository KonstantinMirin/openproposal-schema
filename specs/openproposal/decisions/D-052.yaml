format: 1
id: D-052
status: proposed
kind: gap
author: agent
question: "Which type does a row the stack types only as `String`, `Integer`, `Number`, or `Object` take, where no shared type and no list gives it another form?"
covers:
  - ir: sentence:2.6:44d6e818
    digest: 1045ff7049795cd6efa7227143f4da7d25240241f87694d38ae71cac731f52b6
    quote: A Type cell holds `String`, `Integer`, `Number`, `Boolean`, `Enum`, `Object`, a shared type (§ 2.2), a type its section names, or a named key table.
    locks: [with-our-stack]
  - ir: sentence:2.6:0897aa20
    digest: 56b093f96c3e4131d0965e342f8f560ed38e91d18730d1ddc3805c71ae965377
    quote: "`Object` holds keys that another definition sets."
    locks: [with-our-stack]
  - ir: sentence:2.5:7b67929e
    digest: ab1ab6e188544693244f4aba8b35c9457eb3d5275cbe27af4410ffa8eebec238
    quote: An object whose content another definition sets, such as a `FormatSpec`'s `spec` (§ 5.4), is unaffected, and so are the open objects `DocumentRef` (§ 2.2), `ErrorObject` (§ 2.4), and `CostParameters` (§ 5.6.5).
    locks: [with-our-stack]
options:
  - id: plain
    summary: "A plain type for each, of no further form: any string, any integer that every JSON implementation reads exactly, any number, and, for `Object`, an object whose keys another definition sets."
  - id: per-row
    summary: "A domain concept per row, as the other locks' rows take, each a decision."
chosen: plain
rationale: >-
  § 2.6 lists `String`, `Integer`, `Number`, and `Object` among the Type cells
  and says a row that holds a shared type uses it, so a row typed only
  `String` states no further form, and `Object` holds keys another definition
  sets. A plain type for each takes what the row states and adds nothing.
  The model keeps one type for each, `PlainString`, `SafeInteger`,
  `PlainNumber`, and `OpenObject`, for its concept. A type that restates a
  JSON type and that the text doesn't name has no definition in the schema
  (type rules § 4), so each row holding `PlainString`, `PlainNumber`, or
  `OpenObject` writes `{ "type": "string" }`, `{ "type": "number" }`, or
  `{ "type": "object" }` with its own description. `SafeInteger` keeps to the
  integers every JSON implementation reads exactly, as RFC 7493 advises,
  which is a constraint, so it is one definition in the kernel that every
  such row references.
feedback: >-
  None needed.
