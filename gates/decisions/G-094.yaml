format: 1
id: G-094
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of AdCOM's schemas, release, and pages found?
decision: >-
  G-092 let a spec skip its SDK and feedback gates on its profile alone, and
  recorded a passing line in their place; that relaxed them, since removing
  `names.sdk` or `feedback` from OpenProposal's profile, which no gate
  decision guards, would have passed with sdk/ and the committed report
  unchecked. G-092's rationale that nothing was relaxed was wrong. A new
  gate, optional-outputs, now decides the skip: it fails the default spec,
  which owns sdk/, with no SDK packages, and a spec with no feedback target
  whose feedback/ git tracks, and three fixtures cover both. Where it fails,
  the SDK gates run as before. The fidelity oracle's list reader also probes
  the first code missing between two codes a list names, and 500 for a list
  that reserves no vendor range; a row value it can't read now fails the
  gate instead of dropping out, and a list with no codes gets no vector at
  infinity. Three fixtures cover a vocabulary that accepts a code inside a
  gap, one that took a vendor range its list doesn't reserve, and a row the
  reader can't read. G-092 also named src/specs/index.ts as the file that
  changed; the file is src/specs/adcom/index.ts, which PLUGINS reaches, and
  through it the list reader, so the gates that read the plugins change
  again here. The site labels a list's row by the list's heading, as "List:
  Start Delay Modes, the row of `>0`", where it wrote a broken label; the
  registry page reads citations by the longest title after "List:", keeps
  a line whose next line cites the same list, says AdCOM's text remains the
  reference, and shows a list's extension; and the registry fixture names
  the route alone. The test suite holds 464 tests, and MIN_TESTS is 464.
rationale: >-
  Each change catches more, and the skip that relaxed two gates now needs a
  gate that fails where the skipped gates would have had something to
  check. OpenProposal's schemas, rules, corpus, type examples, SDK types,
  release manifests, comparison, feedback, and site pages are byte for byte
  as before.
