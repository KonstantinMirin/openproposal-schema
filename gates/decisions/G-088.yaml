format: 1
id: G-088
date: 2026-10-27
question: What changes in the gates when AdCOM's lists become a registry of vocabularies and its objects wait for a later phase?
decision: >-
  Four mapping rules join. `deferred-module` maps every element of a module
  whose file says it is deferred, citing the decision that defers it, as
  informative, and the mapping gate fails when that decision doesn't exist
  or covers no element of the module's sections. `list-vocabulary` declares
  a vocabulary for each table of codes a section's heading alone names,
  named after the list's title in PascalCase with its head noun in the
  singular, labeled by its rows, and open to vendors' codes from the first
  number of a `500+` row; `list-code` maps each code row to its term and
  `vendor-range` each `500+` row to the vocabulary's schema. The key-table
  rule declares nothing in a deferred module. A vocabulary declaration may
  give its own vendor range, label its terms by their rows, and name a
  kernel primitive as its extension; the model fails when one of them is
  given to a closed vocabulary, or a vendor range together with an
  extension or a cited list. A labeled list's structure includes its
  labels, and it is a list of its own, as a cited list is, so two of
  AdCOM's lists with the same codes aren't twins. A spec's kernel binding
  may mark a kernel item absent, which leaves the spec's kernel, so a
  spec's kernel gates run on the types its text uses; a constructor list
  may then be empty. In a registry of lists with no document, the
  vocabularies are what the domain gate's reach starts from. The oracle's
  listed gaps are checked with each spec whose kernel has their primitive.
  A new kernel primitive, MediaOffset, with its concept in a new media
  domain, holds a start delay in seconds; OpenProposal's binding marks both
  absent. AdCOM reaches its model stage, and the test suite holds 448
  tests; MIN_TESTS is 448.
rationale: >-
  Every gate keeps its check on OpenProposal, whose outputs don't change,
  and now runs on AdCOM's mapping and model too. The two refinements, labels
  in a labeled list's structure and the registry's reach, apply only to a
  list of a specification's own and a model with no document, which
  OpenProposal has none of.
