    digest: 49bf6d4b9beae22b2597f8a40a5c4788404de441a37cae8d94838565a6b041f4
    quote: "A seller whose rate differs by market MAY declare `geo` with the selectable structure of § 3.1:"
    locks: [with-open-prs]
  - ir: rule:5.5:e6f552da
    digest: 90286fdc3a5696d9bbf62f18413d525db9e02c39dd617465d7c02e6f400f4eca
    quote: A `geo` that declares `allowed[]` and no `available[]` MUST be treated as `settable` (§ 3.2).
    locks: [with-open-prs]
  - ir: rule:5.5:51ca125e
    digest: d96c72a7f90f14538921d34eea24b252b6998bced505a5cb7bd1f6f458a12f6c
    quote: A `geo` MUST NOT declare both.
    locks: [with-open-prs]
options:
  - id: union
    summary: >-
      An untagged union of its selectable form and its settable form. A
      validator tells them apart, because each is closed and requires a
      different key.
  - id: selectable-only
    summary: The selectable structure only, as its marker says.
chosen: union
rationale: >-
  With the open PRs, `geo` is marked selectable, but § 5.5 says a `geo` that
  declares only `allowed[]` is settable and that it must not declare both, and
  the display example declares `allowed[]`. The marker can't decide the type,
  so `geo` is `Geo`, `anyOf` the copies `GeoSelection` and `GeoBounds`, both of geo codes, `ExternalId` (D-019). The
  copies are closed and require `available[]` and `allowed[]`, so no value
  fits both, which is § 5.5's "MUST NOT declare both". On `main`, `geo` is
  settable only. This is a fourth untagged union beside the three type rules §
  8 lists.
evidence:
  - examples/line-item-display.yaml (geo)
  - examples/line-item-audio.yaml (geo)
feedback: >-
  Give `geo` one marker, or a tag that says which structure it declares. It is
  the only field whose marker depends on its content.
