format: 1
id: G-022
date: 2026-10-26
question: Where does a part state a bound on one of its own lists, so every generator reads it, as a daypart window's `days` holds at least one day, each once?
decision: >-
  A part's list slot may carry `minItems` and `uniqueItems` beside its
  `$model`, which must apply `List`; the constructors format rejects them
  beside any other slot, and a bound in `dependentSchemas`, which G-014
  allowed, is gone, with the constructors check, the corpus's special cases,
  and the SDK builder's reading of it. A daypart window's `days` is
  `{ type: array, items: DayName, minItems: 1, uniqueItems: true }`. The
  corpus reads the two bounds as it reads them on any list, the SDK builder
  reads a list member's bounds into the shape the runtimes check, and the
  plain generator keeps `minItems`, so PG-12 lists only the `uniqueItems`
  mutant. A test checks that a bound sits only on a list slot, and the emit
  test checks the bounds on the list on both locks. The test suite holds 321
  tests, so its floor stays at 321.
rationale: >-
  The bounds were standard keywords nested in `dependentSchemas`, which the
  plain generator drops, so PG-12 excused two mutants where JSON Schema and
  the generator could state one of them on the list itself. On the list, the
  generator rejects a window with no day, the corpus still has both isolated
  mutants, the SDKs check the same bounds, and the exemption shrinks to the
  one the generator really loses, so no gate is weaker.
