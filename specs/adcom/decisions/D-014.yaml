options:
  - id: as-written
    summary: >-
      The four lists are vocabularies like the others, since they are
      AdCOM's lists; the removed list has no codes, so it becomes no
      vocabulary, and the schemas say nothing about `Dooh.venue` until
      AdCOM's objects are mapped.
  - id: restore
    summary: >-
      Restore DOOH Venue Types from an earlier commit.
chosen: as-written
rationale: >-
  A list no AdCOM object refers to is still a list AdCOM publishes, and
  OpenRTB 2.6 refers to it, so the registry holds it. DOOH Venue Types now
  holds only a deprecation note, so there are no codes to hold, and
  restoring them from history would publish a list the current text
  withdrew. The attribute that still names it is an object row, which the
  objects phase maps.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L1964"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L3591"
  - "https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/1debba8001f40eb14597102dec3205afddf811d4/2.6.md#L1217"
feedback: >-
  Either restore List: DOOH Venue Types, or add a venue-taxonomy attribute
  to `Dooh` that refers to List: DOOH Venue Taxonomies and make `venue` a
  venue type from that taxonomy, as OpenRTB 2.6's `venuetype` and
  `venuetypetax` do. Today a reader of AdCOM alone can't look up a value of
  `Dooh.venue`. The deprecation note also cites "AdCOM 1.1", a version that
  doesn't exist.
