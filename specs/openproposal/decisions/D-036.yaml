options:
  - id: sibling-currency
    summary: >-
      Every money value is a bare number of at least 0. Every object that
      carries one carries a `currency` (ISO 4217) beside it, required with the
      value. A currency is never inherited from an enclosing object. The
      commitment and a `min_commitment[]` threshold have a `basis` that says
      whether `amount` is money. When `basis` is `spend`, the amount is money
      and its currency is required. When `basis` is `units`, it is a whole count
      of units with no currency. Where the specification gives an object money
      and no currency, the schema carries the money alone until it adds one.
  - id: inherited
    summary: A money value with no currency beside it is in the currency of the line item's `pricing[]`.
  - id: money-object
    summary: Every money value is an object `{ amount, currency }`.
chosen: sibling-currency
rationale: >-
  The specification writes money as a bare number with a sibling currency:
  `pricing[].currency` beside `gross_rate`, `seller_rate`, and `floor`, and
  the commitment's `currency`, REQUIRED when `basis` is `spend`. OpenRTB
  writes money the same way, with `bidfloor` beside `bidfloorcur` and `price`
  beside `cur`. A CPM-style rate is a sum of money per unit of the cost
  method, so it is the same concept as a budget and takes the same type. A
  money value without its currency can't be read, so where the value is
  required the currency is required, and where the value is optional the
  currency is required when the value is present, which `dependentRequired`
  states. Where the specification gives the currency a condition, as the
  commitment does, the condition says when the value is money, and the schema
  keeps it. The commitment's `basis` is `spend` or `units`, so its `amount`
  is money for `spend` and a count of units for `units`, a whole number of at
  least 0, as `derived_units` is. A `min_commitment[]` threshold writes
  `basis`, `amount`, and `currency` as the commitment does, so it is read the
  same way: its currency is required when `basis` is `spend`, a units
  threshold has none, and its amount is a count when `basis` is `units`. An
  amount means nothing without its basis, so a threshold that gives an amount
  gives its `basis`. Inheriting a currency fails because `pricing[]` is
  a list: its entries may name different currencies, so none of them defines
  the currency of `min_spend` or of a budget bound. A `{ amount, currency }`
  object would depart further from the specification's form and from OpenRTB's
  than the missing currencies need.
evidence:
  - https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#3.2.4
feedback: >-
  Give every object that carries money a `currency` (ISO 4217) beside it. Make
  it required with the money, as the commitment does for `basis = spend`.

  - These have no currency in their object: `min_spend`, the budget bounds of
  `commitment_bounds`, a production option's `cost`, and an option's `delta_cpm`
  and `delta_flat`.

  - `pricing[]` is a list whose entries may name different currencies, so it
  can't supply one for a line-item amount.

  - State for a `min_commitment[]` threshold, as for the commitment, that
  `currency` is REQUIRED when `basis = spend`. Also state that a threshold with
  an `amount` gives its `basis`.

  - State for both that `amount` is a whole number of units when `basis` is
  `units`.
