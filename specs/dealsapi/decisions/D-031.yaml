  - ir: field:object-deal:pubcount#description/values:1
    digest: 193f92539017a3974502dd533b45b4ecd2317ca3fd69713ea6e63131a4cb5c6a
    quote: "`0` (undisclosed) | `1` (single publisher) | `2` (multi-publisher)"
