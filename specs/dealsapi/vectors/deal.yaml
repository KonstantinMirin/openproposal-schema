  # At most one of `wseat` and `bseat` in one deal (D-016).
  - rule: rule:object-deal:c221f2e9
    digest: 34e2b9506040e8a69c1ee546c635ff4fc9f6fdba9162d4aa343b9eb09674a540
    decision: D-016
    valid:
      - { value: { id: d-1001, origin: examplessp.com, terms: {}, wseat: [seat-1] } }
      - { value: { id: d-1001, origin: examplessp.com, terms: {}, bseat: [seat-2] } }
      - { value: { id: d-1001, origin: examplessp.com, terms: {} } }
