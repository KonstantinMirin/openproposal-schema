options:
  - id: obligations
    summary: "Each is an obligation of any implementation that inspects creative: what it may fetch and what it must not fire."
  - id: informative
    summary: The statements are guidance
chosen: obligations
rationale: >-
  The statements say what an inspecting implementation sends, fetches,
  requests, and reports, which no proposal or line item shows, and they use
  MUST and MAY, so they are conformance content. They bind any implementation
  that inspects, not one party. § 6.3 only points the CTV example to § 5.4,
  with no statement of its own.
feedback: >-
  Say whether creative inspection belongs to the object model or to a separate
  inspection specification that the AAMP messages reference.
