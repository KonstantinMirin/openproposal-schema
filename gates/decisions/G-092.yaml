format: 1
id: G-092
date: 2026-10-27
question: What changes in the gates when AdCOM's lists run through every output stage and AdCOM gets its pages on the site?
decision: >-
  AdCOM runs every stage now, not only through its model. The fidelity
  oracle takes a spec's own code lists from its plugin's readers
  (`readLists`): each list's codes are valid, its vendor range's first two
  codes are valid and the code below it invalid, every positive number is
  valid where a `>0` row stands, and a code no row names, a code written as
  a string, and a fraction are invalid; three fixtures fail the gate on a
  vocabulary that lost a code, gained one, or lost its vendor range. The
  round trip renders AdCOM's list tables from its vocabularies through the
  plugin's notation. A text whose sections carry anchors, not numbers,
  describes each module by what it holds, so OpenProposal's descriptions
  don't change. A line's permalink encodes each segment of the file's path,
  since AdCOM's file name has spaces; OpenProposal's path has none, so its
  links and feedback don't change. A spec with no `variants/` folder has no
  variants. The profile's `site.registry` marks a spec whose vocabularies
  are a registry other specs cite, and the site gives it a page of its
  lists and the lines and vocabularies that cite each; a fixture fails the
  site gate on a citation at a vocabulary the citing spec's build lacks. A
  spec whose profile names no SDK packages, or no feedback target, has no
  SDK types or report to check, and the run records a passing line saying
  so in their place. The spec-profile gate's fingerprint now covers
  `specs/spec.schema.json`, and the site gate's `specs/site.schema.json`, so
  a change to either format needs a gate decision. The gates whose code
  reads the profile or the plugins (src/profile.ts, src/specs/index.ts)
  change with them; the guard changes with scripts/ci.ts. The test suite
  holds 455 tests, and MIN_TESTS is 455.
rationale: >-
  The oracle and the round trip check AdCOM's lists, which they read
  nothing of before, and the site gate covers the registry's links across
  specs. The SDK and feedback gates check outputs that a spec with no SDK
  packages or feedback target doesn't have; OpenProposal's profile names
  both, so they run on it as before. Two format schemas join fingerprints.
  Nothing is relaxed. OpenProposal's schemas, rules, corpus, type examples,
  SDK types, release manifests, comparison, and feedback are byte for byte
  as before.
