options:
  - id: by-content
    summary: The § 2 diagram is informative, and each YAML block of line-item fields is an example of a line item.
  - id: informative
    summary: Every code block is informative.
chosen: by-content
rationale: >-
  The § 2 block is a diagram of the two documents, with no field. The § 5.5
  and § 5.6.3 blocks are YAML values of line-item fields
  (`exclusions_accepted`, `exclusions`, `geo`, `daypart` with `time_zone`, and
  `requires`), so each is an
  example of part of a line item, which the examples gate validates as it
  validates `examples/`.
