format: 1
id: G-109
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of OpenProposal's references into the AdCOM registry found?
decision: >-
  The imported lists dropped negative codes, as Pod Sequence's -1, and
  Start Delay Modes' `>0` row, so three of the 42 disagreed with the
  registry's vocabularies; a code is now any integer, and a row that isn't
  a code or a vendor range is the list's extension, which a test holds for
  every list against its vocabulary's codes and openness. An import of a
  spec that isn't a registry fails with that reason. The registry index
  skips a lock whose files aren't committed, leaving any reference into it
  for the validator to report, and fails two files with one `$id`. A
  release manifest now lists, under `imports`, the JCS digest of each
  registry file its tree references, so a change to AdCOM's lists changes
  OpenProposal's release and the committed-release gate fails until it is
  regenerated; the release schema allows the field. The examples walker
  reads the registry files too, and CI reads list codes from the spec's
  kernel, its imports included, as the command-line tools do. The SDK and
  model drift the review found unchecked is held by registry-agreement
  (G-107), which compares each registry-backed vocabulary's terms with the
  registry's, and its openness too once G-110 adds it. G-106's 3,206 verdicts counted each
  lock's corpus once per variant, as both variants take it. The test suite
  holds 494 tests, and MIN_TESTS is 494.
rationale: >-
  The checks gain the imported lists' agreement with the registry, the
  release's dependence on its imports, and duplicate `$id`s; nothing is
  relaxed. OpenProposal's schemas and verdicts don't change; its
  with-open-prs release manifest gains its imports' digests.
