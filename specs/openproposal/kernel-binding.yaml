  - name: CatalogRefOr
    sources:
      spec:
        - ir: rule:2.2:c610e803
          digest: d92a309b641f5804a63417966289d0dd289ae5243884b49fab292652386ab7b0
          quote: "Any field whose value is drawn from a seller-maintained catalog MAY carry a reference in place of an inline value:"
        - ir: code:2.2:1
          digest: 5b0b87b43dbc9c1a24ed8f3e2bd71d22c5d790a6f786b980bd554f64a71436a0
          quote: |-
            catalog_ref: "<seller_namespace>/<collection>/<entry_id>@<version>"
