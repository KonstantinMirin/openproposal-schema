format: 1
id: G-037
date: 2026-10-26
question: What does the display example's catalog audience finding say, when the UUID we propose doesn't name an option given as a catalog reference?
decision: >-
  The finding of the display example's `/audiences/included/0` under D-037
  says what the example writes and what we propose, and no longer promises
  that a UUID names the option: the option is a catalog reference, which
  carries no `id`, so it points to the open point of what names such an
  option, the D-007 finding at the same place. The finding still cites one
  kind of decision. The preamble of the feedback's table of examples that
  follow the text says that a reason names any open point the change alone
  doesn't settle, which holds for every row. A test checks that a UUID in
  that entry still breaks the options-named rule, so the gap finding stays.
  The test suite holds 343 tests, so its floor rises to 343.
rationale: >-
  The reason promised a remedy the options-named rule refutes. Only a
  recorded reason and a table's preamble change; every check stays, and the
  test floor rises, so no gate is weaker.
