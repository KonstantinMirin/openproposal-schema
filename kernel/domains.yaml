# The value domains (type rules § 3a), written and reviewed before the
# mapping. Each concept says what a value means, names the one model type that
# represents it, and cites what it rests on. A field or key row a concept cites
# is typed by the concept's type (mapping rule `domain-row`). Every primitive
# and part declares its concept, and every scalar property of the model
# resolves to one. Regenerate a quote and a digest with
# `npm run cite -- --all-locks <IR element ID>`.
format: 1
domains:
  - name: identity
    description: What names a record, an option, or a party's thing, compared by exact equality and never shown as prose.
    concepts:
      - name: minted-id
        meaning: The identity of a record a party of the proposal mints for the other parties to carry, such as a proposal, a line item, an asset, a commitment attempt, or a catalog entry. A reference to such a record carries the same identity.
        type: Uuid
        sources:
          standards:
            - name: RFC 9562, Universally Unique IDentifiers (UUIDs)
              url: https://www.rfc-editor.org/rfc/rfc9562
      - name: external-id
        meaning: The identity of a record, a code, or a version that another system or list defines, such as a registry entry, a DSP seat, a vendor, an order system, a buyer's brief, a seller's own template, which the specification calls opaque, a geo code, a device category, a category of the IAB Tech Lab Content Taxonomy, a published document's version, or a field of the specification, which a negotiation step names by its path, as the tables write it, such as `pricing[].gross_rate`. The proposal carries it as that system writes it and never parses it, and the field's description names the system or list.
        type: ExternalId
      - name: format-id
        meaning: The ID of a creative format in the format registry, namespaced by channel, as the specification writes `display/300x250`. It validates differently from an external ID, since it holds a channel and a format joined by one `/`, and a receiver compares it by exact equality.
        type: FormatId
  - name: reference
    description: What points at something outside the value itself, such as a catalog entry, a field, or the exact bytes of a document.
    concepts:
      - name: catalog-ref
        meaning: A version-pinned reference to an entry in a seller-maintained catalog, given in place of an inline value.
        type: CatalogRef
        components: [CatalogReference]
      - name: digest
        meaning: A SHA-256 hash that pins the exact bytes of a referenced document.
        type: Digest
        sources:
          standards:
            - name: FIPS 180-4, Secure Hash Standard (SHA-256)
              url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
  - name: text
    description: Prose for people and agents to read, never parsed or compared.
    concepts:
      - name: text
        meaning: Prose, such as a description, a planning hint, or a party's name.
        type: Text
  - name: network
    description: Names and locations on the internet.
    concepts:
      - name: url
        meaning: An absolute `https` URL that a receiver may fetch.
        type: Url
        sources:
          standards:
            - name: RFC 3986, Uniform Resource Identifier (URI) Generic Syntax
              url: https://www.rfc-editor.org/rfc/rfc3986
      - name: domain-name
        meaning: A domain name, compared by string equality, such as a property's site or an app developer's domain.
        type: Domain
        sources:
          standards:
            - name: RFC 1123, Requirements for Internet Hosts (host name syntax)
              url: https://www.rfc-editor.org/rfc/rfc1123
  - name: money
    description: Sums of money and prices, and the currency they are in. Every money value is a bare number with a sibling `currency` in the same object, as OpenRTB writes `bidfloor` and `bidfloorcur`; a currency is never inherited from an enclosing object.
    concepts:
      - name: amount
        meaning: A sum of money or a price per unit of a cost method, never negative, in the currency of the `currency` beside it, such as a budget, a minimum spend, or a CPM. The cost method says what a rate is per.
        type: Amount
        requires:
          concept: currency
        sources:
          standards:
            - name: OpenRTB 2.6, Object Imp (`bidfloor` and `bidfloorcur`)
              url: https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#objectimp
      - name: price-adjustment
        meaning: A signed change to a price or a sum of money, such as the change an option makes to the CPM or a flat surcharge or discount.
        type: PriceAdjustment
        requires:
          concept: currency
      - name: option-price-delta
        meaning: The change in price when the buyer selects an option beyond those included, given as exactly one of a change to the CPM, a flat change, or a change in percent.
        type: PriceDelta
        requires:
          concept: currency
      - name: currency
        meaning: The ISO 4217 currency of the money values in the same object.
        type: CurrencyCode
        sources:
          standards:
            - name: ISO 4217, Codes for the representation of currencies
              url: https://www.iso.org/iso-4217-currency-codes.html
  - name: place
    description: Where something is or runs, named by a code another standard keeps.
    concepts:
      - name: country
        meaning: A country, named by its ISO 3166-1 alpha-3 code, such as `USA`, as OpenRTB 2.6 writes `geo.country`.
        type: CountryCode
        sources:
          standards:
            - name: ISO 3166-1, Codes for the representation of names of countries (alpha-3)
              url: https://www.iso.org/iso-3166-country-codes.html
  - name: ratio
    description: Proportions and relative changes.
    concepts:
      - name: fraction
        meaning: A proportion from 0 to 1, such as a viewable rate or an expected match rate.
        type: Fraction
      - name: percent-change
        meaning: A relative change to a price in percent, from −100 up.
        type: PercentChange
  - name: quantity
    description: Numbers of things, which add up, never negative.
    concepts:
      - name: count
        meaning: A whole number of things, never negative, such as impressions, reachable units, options, or a proposal's revisions, which its `version` counts and every reference to the proposal repeats.
        type: Count
      - name: measure
        meaning: What a metric that isn't a rate measures, never negative and not always whole, such as audience impacts or a modelled audience a seller commits to; a rate metric's value is a fraction instead.
        type: Measure
  - name: time
    description: Time has five concepts. A point in time, a point in time written in UTC, and a span need no clock. A daypart window is calendar time, read on the line item's clock, which the time zone names. A frequency cap's period is a term of a vocabulary, `FrequencyCapPeriod`, not a span; it is a calendar period on that clock, such as a day from midnight to midnight, or the whole flight, which runs between two points in time (D-044).
    concepts:
      - name: instant
        meaning: A point in time, such as the end of an offer window, the expiry of a hold, or the start of a flight.
        type: Timestamp
        sources:
          standards:
            - name: RFC 3339, Date and Time on the Internet (date-time)
              url: https://www.rfc-editor.org/rfc/rfc3339
      - name: utc-instant
        meaning: A point in time that the specification says is written in UTC, such as when a deal was created, starts, or ends.
        type: UtcTimestamp
        sources:
          standards:
            - name: RFC 3339, Date and Time on the Internet (section 5.6, date-time, whose offset `Z` is UTC)
              url: https://www.rfc-editor.org/rfc/rfc3339#section-5.6
            - name: RFC 3339, section 4.3, Unknown Local Offset Convention (`-00:00`, a time in UTC whose local offset is unknown)
              url: https://www.rfc-editor.org/rfc/rfc3339#section-4.3
      - name: duration
        meaning: A length of time, such as how long a hold runs, an attribution window, or a production lead time.
        type: Duration
        sources:
          standards:
            - name: RFC 3339, Appendix A, ISO 8601 collected ABNF (duration)
              url: https://www.rfc-editor.org/rfc/rfc3339#appendix-A
      - name: daypart-window
        meaning: A window of the week in which a line item's ads may serve, given as days and a start and an end civil time of day, read on the line item's clock.
        type: DaypartWindow
        components: [TimeOfDay, DayName]
        sources:
          standards:
            - name: Google Ad Manager API, DayPart
              url: https://developers.google.com/ad-manager/api/reference/latest/LineItemService.DayPart
      - name: time-zone
        meaning: The clock a line item's calendar values are read on, its daypart and its frequency cap's period, a zone of the IANA time zone database or `viewer_local`, where the ad renders.
        type: TimeZone
        sources:
          standards:
            - name: IANA Time Zone Database
              url: https://www.iana.org/time-zones
  - name: term
    description: Terms of a vocabulary. A core term is spelled as the specification lists it, and an extension term is namespaced by its definer's domain.
    vocabularies: true
    concepts:
      - name: namespaced-term
        meaning: A term outside a vocabulary's core list, written `<domain>:<term>`, where the domain is the definer's identity domain.
        type: NamespacedTerm
        sources:
          standards:
            - name: RFC 1123, Requirements for Internet Hosts (host name syntax)
              url: https://www.rfc-editor.org/rfc/rfc1123
      - name: vendor-code
        meaning: A code outside a list's own codes that the list reserves for vendors, as AdCOM 1.0 reserves 500 and up in List API Frameworks, which extends a vocabulary of the list's codes.
        type: VendorCode
        sources:
          standards:
            - name: AdCOM 1.0, List API Frameworks (500+ Vendor-specific codes)
              url: https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#list_apiframeworks
  - name: media
    description: Positions within a piece of media, such as a video or an audio stream, which an ad's placement in it names.
    concepts:
      - name: media-offset
        meaning: A point within a piece of media, counted in whole seconds from its start, such as where a mid-roll ad starts.
        type: MediaOffset
        sources:
          standards:
            - name: AdCOM 1.0, List Start Delay Modes (>0 Mid-Roll, the value the start delay in seconds)
              url: https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#list_startdelaymodes
  - name: extension
    description: Members a specification leaves to the parties to define.
    concepts:
      - name: extension
        meaning: An object for members the specification doesn't define, which the parties agree on, such as the Deals API's `ext`, a "placeholder for deal-specific extensions". A receiver keeps the members it doesn't know, and checks only that the value is an object.
        type: Ext
  - name: flag
    description: Values with two states. A flag a text writes as a boolean is a JSON boolean; a flag it writes as the integers `0` and `1`, as AdCOM 1.0 and OpenRTB 2.6 write theirs and the Deals API's `guar` copies them, keeps the integer, which validates differently, so it is a concept of its own.
    concepts:
      - name: flag
        meaning: A yes or no, written as a JSON boolean.
        type: boolean
      - name: integer-flag
        meaning: A yes or no written as an integer, `0` for no and `1` for yes, as AdCOM 1.0 and OpenRTB 2.6 write a flag such as a placement's `instl` or a deal's `guar`.
        type: IntegerFlag
        sources:
          standards:
            - name: OpenRTB 2.6, Object Imp (`instl`, `rwdd`, and the other integer flags)
              url: https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#objectimp
shared_structures:
  - concepts: [external-id, text]
    reason: >-
      Each is a string with no constraint, and a receiver processes each one
      differently. It compares an external ID by exact equality with the ID
      the system or list that defines it keeps, and never parses it or shows
      it as prose; it shows text to people and never compares it. Where an ID
      or a code comes from, a registry, a list, a publisher, or the
      specification's own field tables, doesn't change how it is processed,
      so it is the field's description, not a type of its own.
  - concepts: [currency, country]
    reason: >-
      Each is three capital letters, and a receiver processes each
      differently. It reads a currency code as the currency of the money
      beside it, from ISO 4217's list; it reads a country code as a place a
      deal runs, from ISO 3166-1's list, and never as money. Some codes name
      both, as `CHE` is Switzerland and the WIR Euro, so each is checked
      against its own list.
  - concepts: [amount, measure]
    reason: >-
      Each is a number that is never negative, and a receiver processes each
      one differently. It reads an amount as money in the currency beside it,
      and adds or compares it only with amounts in that currency; it reads a
      measure in what its metric counts, such as audience impacts, never
      as money, and compares it only with measures of the same metric.
