format: 1
id: G-160
date: 2026-11-13
question: How does a rule whose check reads the value that holds its owner, as § 5.6.4's `impression_multiplier`, run in every SDK, and how does CI hold the SDKs to its vectors, which give that holder as context?
decision: >-
  A rule program may name its owner's holder, `on`, as `LineItem` for a
  rule on its `delivery_counting` that reads its `pricing`: the program
  reads the holder's value as ["up"], and ["given", key] says whether the
  holder shows a member. The SDK emitters attach the rule to the holder's
  type, with the places of the owner's values in it, which the model gives
  (src/rule-places.ts: each the members from the holder, `*` for a list's
  items or a map's values, stopping at a nested holder); each runtime runs
  the program on every owner value at those places and reports each
  violation at its place. The gates' check gives the program its holder
  from the check's context: the nearest holder whole, as the examples gate
  gives a value's holders, or the members a vector gives, such as
  `LineItem.pricing`; a program's `undecided`, where it holds, makes the
  check undecided and the SDK silent, so a vector that shows too little
  stays undecided as it was. The sdk-rules gate checks each vector of such
  a rule in its holder's least type example, with the members the context
  gives and the vector's value at the owner's first place, and fails where
  the rule's own verdict doesn't hold there; the parity and location cases
  count the programs on every value of a type a program runs on, wherever
  it sits. `rule:5.6.4:e58650b7` is the first such program, and its check
  written in TypeScript is gone; a rule with a program and a written check
  throws, so one definition decides each rule. The operations gain `up`,
  `given`, `keys`, and `contains` on text. IAB Australia's p11 is rejected
  at `/delivery_counting` by all five engines, and its SDK gap is gone; the
  desk-test fixtures for SDK gaps start from a copy of the set as it stood
  with the gap.
rationale: >-
  No check is weaker: the rule's vectors keep their verdicts in the rules
  gate, now from its program; the SDKs reject what it rejects, which they
  accepted before, three more of the stack's 208 single-payload rule
  vectors, 152 in each SDK; the gate that held the gap now holds the SDKs
  to the finding; and each SDK-gap fixture still fails its gate. The other
  fingerprints change because their code includes the rule checks or the
  evaluator. The generated code that changes is the two stack trees': the
  line item runs the rule on `delivery_counting` in each SDK, each SDK's
  evaluator reads holders and places, and the Go programs are written as
  raw strings joined around each backtick a message holds. The `main` and
  `with-open-prs` outputs are byte-identical.
