    open: true
  - name: CancellationPolicyOption
    kind: object
    ir: field:5.6:cancellation_policy
    source: { decisions: [ D-016, D-019 ] }
    open: true
    description: "A cancellation right the seller offers, priced in `pricing` beside the others. The specification states no members, so the option accepts any beside the `id` that names it."
  - name: ExclusivityOption
    kind: object
    ir: field:5.6:exclusivity
    source: { decisions: [ D-016, D-019 ] }
    open: true
    description: "An exclusivity term the seller offers, priced in `pricing` beside the others. The specification states no members, so the option accepts any beside the `id` that names it."
  - name: CreativePolicy
    kind: object
    ir: field:5.6:creative_policy
    source: { decision: D-016 }
    open: true
    description: "The content and category restrictions on creative. The specification states no members, so the object accepts any."
  - name: Commitment
    kind: object
    ir: key:5.6.1:commitment.proposal_id
    locks: [ with-open-prs ]
    source: { rule: key-table-object }
    open: false
  - name: Commitment
    kind: object
    ir: key:5.6.1:commitment.basis
    locks: [ main ]
    source: { rule: key-table-object }
    open: false
  - name: HoldStatus
    kind: object
    ir: key:5.6.2:hold_status.hold_available
    source: { rule: key-table-object }
    open: false
  - name: Requires
    kind: object
    ir: "key:5.6.3:requires.all_of[]"
    locks: [ with-open-prs ]
    source: { rule: key-table-object }
    open: false
