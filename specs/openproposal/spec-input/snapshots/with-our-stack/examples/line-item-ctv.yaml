# OpenProposal 3.0 — Example: CTV line item (spec § 6.3)
line_item_id:   "weather-app-ctv"
status:         published
channel:        ctv
properties:
  available:
    - id: "weather-app"
      child_audience: general
      apps:
        - { store: roku_channel_store, bundle: "000000",
            store_url: "https://channelstore.roku.com/details/000000/weather-app",
            developer_domain: "weather-app.example" }
      seller_relationship: owner
      seller_accounts: [{ asi: "ssp-a.example", sid: "pub-1001" }]
  included: ["weather-app"]
environments:   { available: ["ctv"], included: ["ctv"] }
placement:      { plcmt: 1, ssai: 3 }      # Instream (1); all server-side (3) (§ 5.2.2)
break_position:                                # where in the stream, priced (§ 5.2.3)
  available:
    - { id: "midroll-any",  delay: -1, slotinpod: 0, maxseq: 4 }   # Generic Mid-Roll (-1), Any ad in the pod (0)
    - { id: "preroll",      delay: 0,  slotinpod: 0 }              # Pre-Roll (0), Any ad in the pod (0)
    - { id: "first-in-pod", delay: -1, slotinpod: 1, maxseq: 4 }   # Generic Mid-Roll (-1), First ad in the pod (1)
  included:     ["midroll-any"]
  deltas:       { "preroll": { delta_cpm: 4.00 }, "first-in-pod": { delta_cpm: 9.00 } }
  max_select:   1
formats:        { available: ["ctv/instream-15s", "ctv/instream-30s", "ctv/instream-6s"],
                  included: ["ctv/instream-15s"],
                  deltas: { "ctv/instream-30s": { delta_cpm: 8.00 } } }
format_specs:
  "ctv/instream-15s":
    spec_ref: "registry.example/ctv/instream-15s@1"
    spec:                                   # copied from version 1; values illustrative
      duration:    { nominal_s: 15, tolerance_ms: 500 }
      source:      vast_mezzanine
      mezzanine:   { required_for: [ssai], min_resolution: "1920x1080" }
      loudness:    { standard: atsc_a85, target: -24, tolerance_db: 2 }
      creative_id: { universal_ad_id: required }
  "ctv/instream-30s":
    spec_ref: "registry.example/ctv/instream-30s@1"
    spec:        { duration: { nominal_s: 30, tolerance_ms: 500 } }
  "ctv/instream-6s":                        # seller-defined: no spec_ref
    spec:        { asset: video_file, duration: { nominal_s: 6, tolerance_ms: 250 } }
creative_delivery: { method: seller_hosted, protocols: [13], secure_required: true }   # VAST 4.2 (13)

frequency_cap:  { count: { min: 1, max: 4, default: 3 }, period: day, per: household }
time_zone:      viewer_local
accepted_exclusions:                   # what this seller can enforce (§ 5.5)
  types:
    domains:  { enforcement: pre_serve, max_entries: 5000 }
    keywords: { enforcement: best_effort, max_entries: 500 }

pricing:
  - { pricing_id: "ctv-pa-cpm-usd", cost_method: CPM, list_rate: 45.00, min_rate: 39.60,
      price_valid_until: "2026-12-01T23:59:59Z", currency: USD,
      price_type: 1 }                  # First Price

commitment_bounds: { spend: { min: 25000.00 } }

cancellation_policy:
  available:
    - { id: "notice-30d", notice_duration: "P30D", max_share: 1, fees: [{ calculation: none }] }
    - { id: "notice-14d", notice_duration: "P14D", max_share: 1, fees: [{ calculation: none }] }
    - { id: "notice-48h", notice_duration: "PT48H", max_share: 1,
        fees: [{ calculation: cancelled, share: 0.10 }] }
  included:     ["notice-30d"]
  deltas:       { "notice-14d": { delta_fraction: 0.03 }, "notice-48h": { delta_fraction: 0.06 } }
  max_select:   1

hold_terms:     { available: false }   # private_auction: no inventory reserved

committed_metrics: [{ metric: completion_rate, level: 0.95, direction: at_least }]
measurement_source:
  available:    [{ id: seller-measured, measured_by: seller }]
  included:     ["seller-measured"]
controlling_measurement:
  available:    [{ id: seller-count, counted_by: seller,
                   discrepancy_threshold: 0.10, final_after: "P30D" }]
  included:     ["seller-count"]
  max_select:   1
visibility:        public
transaction_mechanism:
  available:  [{ id: private_auction, delivery_type: non_guaranteed }]
  included:   ["private_auction"]
  max_select: 1
serving_mode:      dai
deal_origin:       "ssp-a.example"

# Inspecting this line item's VAST creative is subject to § 5.4.1.
