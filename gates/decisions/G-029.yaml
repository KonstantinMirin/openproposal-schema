format: 1
id: G-029
date: 2026-10-26
question: Which gates change when every rule that one payload decides has a deterministic check, and the examples gate runs the checks over the examples?
decision: >-
  A new gate, rule-checks, fails a rule whose vectors are payloads that has
  no check in src/rule-checks.ts and rests on no list the repository leaves
  unpinned, a check on a rule about two versions or a receiver's response,
  and a check that doesn't give each of its rule's vectors its verdict; three
  fixtures miss an invalid vector, add a payload rule with no check, and add
  a valid vector the check rejects. Eleven rules have checks: the selectable
  option names and prices, the order of a range, an ordered bound, and a
  daypart window, and the line-item rules on resolved catalog references,
  environments per channel, measurement vendors without OMID, `plcmt` for
  video, hash-pinned list references, and accepted exclusion types. ISO
  4217's currency codes and the IANA zone names aren't pinned, so their two
  rules have none. The examples gate runs each check on every value of the
  type its rule reads, in the union branches that accept the value, and the
  document's checks on a code block's fields as part of the document; a
  violation is a failure of kind `rule` that names its rule and rests on the
  rule's elements and on those along its path, and a check that turns on
  what the example leaves out is undecided and listed in the gate's line.
  The findings format adds the kind `rule` and the `rule` it breaks, and a
  finding's key adds the rule; a new fixture removes a rule finding. Five
  findings, four on `main` and five with the open PRs: the display and
  rewarded-video examples name options in `included[]` and `pricing` that no
  option carries as its `id`, under D-007 and D-046. The feedback calls such
  a finding "breaks a rule". The test suite holds 334 tests, so its floor
  rises to 334.
rationale: >-
  The examples gate checked the schemas only, so an example that broke a
  rule the model states passed. Every rule one payload decides now runs on
  every example, the checks are held to the rules' vectors, the violations
  are recorded findings, not exemptions, and the test floor rises, so no
  gate is weaker.
