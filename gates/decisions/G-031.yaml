format: 1
id: G-031
date: 2026-10-26
question: Which gates change when the object options' `id` splits into a gap and a departure, a finding cites causes of one kind only, and the feedback counts distinct places, SHOULD warnings, and undecided checks?
decision: >-
  D-046 keeps what names an object option and the presence of the `id` the
  property and audience options write; the new departure D-047 gives the
  production, measurement source, and reporting options, whose members the
  text lists without one, their `id`. `Selectable`'s `carries` names the
  departure, and the model cites it on each closed option that gains the
  member, so the constructor-sources gate checks it as it checks `decision`.
  The display and rewarded-video findings on those options and their names
  in `included[]` and `pricing`, and the three round-trip differences, cite
  D-047 and use the departure template. The examples gate fails a finding
  that cites a gap and a departure, so each finding sits in one table. The
  feedback counts distinct places by example and location, those that only
  disagree with the text, only follow it, or do both, which add up to the
  places, counts SHOULD warnings apart from the errors, lists the undecided
  checks with their recorded reasons, renders one row per place, and lists
  each union once, with its forms on each lock and a summary's union in its
  projected form. Two feedback fixtures drop an undecided check's reason and
  give it an internal citation. The test suite holds 339 tests, so its floor
  rises to 339.
rationale: >-
  The findings called the display example's measurement sources and reports
  disagreements with the text, though they follow it and our proposal
  departs from it, and the feedback counted one place twice and a union
  twice. The departures are now labeled as departures, one more check holds
  each finding to one kind of cause, the counts add up, every fixture fails
  its gate, and the test floor rises, so no gate is weaker.
