options:
  - id: by-subject
    summary: >-
      A statement about one line item's or proposal's fields, or about two
      versions, is a rule owned by the smallest object it mentions. A statement
      about delivery, disclosure, or how a seller treats a request is an
      obligation. A statement the schema already says maps to the schema.
  - id: all-obligations
    summary: Every statement outside the tables is an obligation.
chosen: by-subject
rationale: >-
  Rules on a line item: `plcmt` for video ads, environments that match the
  channel, the OMID condition on third-party measurement, exclusion types
  within `exclusions_accepted.types`, `list_ref` and `terms_ref` pinned and
  resolved or frozen at `agreed`, a consumer skipping an unknown channel (type
  rules § 9), and the requestable `materials_due` and `committed_metrics[]`,
  which compare two versions. Rules on a proposal: `negotiation_history[]` is
  append-only. Rules on `HoldStatus`: the hold transitions `none` →
  `requested` → `held` → `expired`, `released`, or `converted`. "Each property
  MUST carry `domains`, `apps` or both" is the property option's schema, and
  offering one inventory "through more than one" mechanism is the selectable
  structure's list. The rest are obligations of the seller: serving only its
  channel, delivering only to impressions that match `placement`, rejecting an
  app entry whose platform it can't determine or an unaccepted exclusion type,
  never presenting `best_effort` as a guarantee, never disclosing a buyer's
  exclusions, and never requiring `proposal_template_id`.
feedback: >-
  Put each cross-field requirement in the section of the object that holds all
  its fields, and mark seller behavior apart from requirements on the
  document.
