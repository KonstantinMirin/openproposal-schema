format: 1
id: G-067
date: 2026-10-27
question: What changes when the repository's text cites only documents it holds, its locks name clones under vendor/, the workflow runs on the push that creates the branch, and the repository carries its licenses?
decision: >-
  Comments and documents name gates by their number in the README's CI
  table, and design sources cite only documents under docs/design/. The
  feedback gate's internal-citation pattern drops the alternative for
  sections of a document the repository doesn't hold; its path alternative
  still catches every docs/ path. Each lock's clone source is a path under
  vendor/, which git ignores, so no lock or note names a path outside the
  repository; a missing clone is skipped, as before, and the snapshot
  serves. The workflow's GATE_BASE falls back to the pushed commit when the
  push creates the branch, so the first push of a new repository fetches a
  commit that exists. The site check no longer bans one other protocol's
  name, and its local-path fixtures use a file URL; the release scan, which
  fails on that name in any file of the published tree, the site's sources
  included, holds it instead. package.json and its lock declare the code's
  license, Apache-2.0, beside the new LICENSE, LICENSE-CODE, and NOTICE.
  The site counts the examples' failures as distinct places, as the
  feedback does, and links each decision page to its record in the public
  repository. This record accepts each gate at its new fingerprint.
rationale: >-
  A citation of a document a reader can't open explains nothing, a path
  outside the repository resolves on one machine only, and a first push
  names no previous commit, so its fetch would fail before any gate ran.
  The one check removed moves to the release scan, which reads every file
  the site is built from; every other check stands, and each fixture still
  fails its gate. Most fingerprints change because the code comments, the
  kernel's design sources, package.json, and the site's sources they
  reach changed, not because a check did.
