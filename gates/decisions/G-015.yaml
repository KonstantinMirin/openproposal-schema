format: 1
id: G-015
date: 2026-10-26
question: How do the gates read the AdCOM code lists that § 5.2.2's placement keys take, now that each is a vocabulary that cites its list?
decision: >-
  `kernel/lists.yaml` holds AdCOM 1.0's List: Plcmt Subtypes - Video, List:
  Playback Methods, and List: API Frameworks at the commit § 5.2.2 links, and
  a list may record the codes it reserves for vendors. `PlcmtSubtype`,
  `PlaybackMethod`, and `ApiFramework` are vocabularies that cite their
  lists; a vocabulary that cites a list is open exactly when the list
  reserves vendor codes, and then its extension is `VendorCode`, whose
  minimum must be the list's first vendor code. The fidelity oracle reads
  the sentence "`plcmt`, `playmethod[]` and `api[]` take any code in List: …
  respectively" with the lists' codes, as a closed value list per member,
  with two fixtures that drop a listed code and accept an unlisted one. The
  value-list gate keys a vocabulary by the list it cites, so two lists whose
  codes are the same numbers aren't one list, and two vocabularies of one
  list still fail. The SDKs take an open vocabulary's extension type from
  the model. PG-7 lists `VendorCode`'s integral floats in place of the two
  primitives'. Tests check the vocabularies' schemas, the sentence's
  reading, and the value-list keying. The test suite holds 316 tests, so its
  floor rises to 316.
rationale: >-
  The sentence names the lists without writing their codes, so the oracle
  couldn't read it, and the two primitives accepted any positive integer,
  which the sentence rules out for a code no list holds. Each check now
  reads more of what the text says, the value-list gate still fails on one
  list defined twice, the exemptions name the same strict-integer cases for
  the one integer primitive left, and the test floor rises, so no gate is
  weaker.
retires:
  - concept: api-framework
    reason: An API framework is a code of AdCOM's List API Frameworks, a list another standard keeps, so it is a term of the vocabulary ApiFramework, which cites the list, not a primitive of its own (ops-c4g.27).
  - concept: playback-method
    reason: A playback method is a code of AdCOM's List Playback Methods, a list another standard keeps, so it is a term of the vocabulary PlaybackMethod, which cites the list, not a primitive of its own (ops-c4g.27).
