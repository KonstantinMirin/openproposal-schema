format: 1
id: G-027
date: 2026-10-26
question: Which gates change when every object option of a selectable field carries a required `id`, which the constructor gives?
decision: >-
  `Selectable`'s `K` parameter `carries` the member `id` (D-046): where `K`
  isn't `T`, the model gives each object type that is an option, or that a
  `CatalogRefOr` option holds, the property `id`, typed `K`, required, and
  marked `given` by the constructor, with no element of its own where the
  text writes no `id`. The property and audience options keep their `id`
  row and make it required. The model fails an option that types its `id`
  as anything but `K`, with a new fixture; the constructor check fails a
  `carries` decision that doesn't exist, with a test. The beside-a-reference
  gate allows `given` on a model property, which is provenance, not a
  constraint. The duplication gate sets aside an open option whose only
  property is the given `id`, as it set aside the open option with no
  property before, and a new fixture makes two such options state their own
  `id` and fails them as twins. The examples walk rests a copy's member, and
  each item of a list member, on its template's row for the key, so a name
  in `included[]` rests on § 3.1's `included[]` row too. The findings: 6 new,
  4 on `main` and 6 with the open PRs, where a measurement source or a
  reporting option has no `id`, under D-046; the production options' `id`s
  are readable names now, invalid under D-037, not undefined keys; and the
  four findings that name an option by its `vendor` or `feed_type` cite
  D-046 too. Three round-trip differences record the `id` the production,
  measurement source, and reporting rows gain. One rule's vectors give their
  measurement source options an `id`. The test suite holds 328 tests, so its
  floor rises to 328.
rationale: >-
  The rule that `included[]` and `pricing` name an object option by its `id`
  was unsatisfiable for the options that have none. Every schema now
  requires the `id`, which rejects payloads it accepted before, and only
  where D-046 says so; the examples that disagree are recorded findings, not
  exemptions; two gates gain a failure with a fixture each; the set-aside
  covers exactly the objects it covered before; and the test floor rises, so
  no gate is weaker.
