options:
  - id: open-object
    summary: A named object that accepts any members, so the field validates as an object and the members stay the field's owner's to define.
  - id: invent-shape
    summary: Members chosen from the prose and the examples.
  - id: text
    summary: A string.
chosen: open-object
rationale: >-
  Seven fields are typed Object and described only in prose: `assent`,
  `specifications`, `content_detail`, `specs`, `third_party_tags`, `approval`,
  and `creative_policy`. The cancellation rights and exclusivity terms that
  `cancellation_policy` and `exclusivity` offer, and the `suppression_list`
  member of `buyer_supplied`, are the same case. Type rules § 4 names every
  object, so each one is a named object, and it accepts any members, because
  the specification states none and members chosen here would be invented
  fields. `specs` is defined by the format registry and `assent` by WS1, which
  confirms that their structure lives elsewhere. `specifications` is typed
  String/Object, so its object branch is the open object
  `SpecificationsDetail` (D-017). A daypart's time window isn't among them:
  the window follows the ad server convention (D-004). Each open object's
  schema and SDK type carry what its row says of it, so a reader sees what
  it holds though its members are unstated. The structures the feedback
  proposes, read from each row's prose, stay proposals: the schema keeps the
  objects open until the text states their members.
evidence:
  - examples/line-item-display.yaml (suppression_list)
feedback: >-
  Define each of these objects, or say where it is defined, as `specs` does for
  the format registry. Until then an implementation can't validate or compare
  them, and two implementations will fill them differently. Name the members of
  a cancellation right and an exclusivity term, beside the `id` that names each
  option. Say whether `specifications` is free form. For the rest, each row's
  prose suggests a structure, which we propose as the starting point:

  - `assent` as `{ buyer, seller }`. Each party's record is
  `{ version, at, signature }`: the version it assents to, when, and a signature
  in the scheme the row calls WS1.

  - `third_party_tags` as `{ wrapper_types[], vast_versions[] }`.

  - `approval` as `{ review_sla, revision_policy }`, the SLA a length of time.

  - `content_detail` as
  `{ shows[], series[], sections[], network_verticals[] }`.

  - `creative_policy` as `{ content_restrictions[], category_restrictions[] }`,
  the content and the category restrictions its row names. Say whether a
  category restriction names a category of the IAB Tech Lab Content Taxonomy, of
  its Ad Product Taxonomy, or of another list.

  - `suppression_list` as `{ source, size, match_method }`, the members the
  display example writes.
