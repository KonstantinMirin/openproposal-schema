format: 1
id: G-139
date: 2026-11-07
question: What changes in the gates when a third lock, with-our-stack, reads the final text of the 17-PR stack, with kernel editions of the types its text defines in other forms?
decision: >-
  The kernel holds the stack's own forms of `Digest`, `Url`, `Duration`,
  `Domain`, `Amount`, `NamespacedTerm`, and `FormatId`, and of `Selectable`,
  `Settable`, `Range`, `List`, and `Map`, as editions its binding publishes
  on the stack lock alone (src/editions.ts). Each gate that reads the kernel
  reads the view of the lock it checks: the kernel checks, duplication,
  domain sources, constructor sources and applications, the corpus, the
  rule checks, and the SDK parity run on each lock's view, and the
  duplication gate checks the twins of each view and that every shared
  structure names a concept some lock's type represents. The fixtures that
  named the first Selectable or the first rule of the first vectors file
  name every Selectable, and the first rule the fixture's lock reads. The stack's readers, mapping rules, and model
  are inert on the other locks: their IR, mapping, models, schemas, rules,
  corpus, type examples, SDKs, release, round trip, examples, comparison,
  and feedback are byte-identical. The feedback profile's `locks` names the
  locks the report reads, and each other lock has a report of its own; the
  feedback gate runs on each report with its own layout. A lint line's
  section skips fenced code. The fidelity readers place a selectable row's
  values in `available[]` and read a map field's example whole. The examples
  gate gives a rule check the values that hold the checked value, by their
  types. The plain-generator exemptions add PG-16 to PG-22 for the stack and
  scope PG-6 to the old locks and PG-15 to the open PRs and the stack.
rationale: >-
  No check on the old locks is weaker: each view of the kernel is the
  kernel those locks read before, and every new path runs only where a lock
  publishes an edition or the stack's text writes a form the old texts
  don't. The tests read each lock's view and pass on every lock. The
  concept `geo-code`, which G-016 retired, is back: the stack's § 5.5 writes
  a `GeoCode` type of its own, which only the stack lock publishes.
concepts: [geo-code]
