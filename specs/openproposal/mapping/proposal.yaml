# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: proposal
sections: [ "4", "4.1", "4.2" ]
lock_sections: { with-our-stack: [ 4.1.1, 4.1.3, 4.1.4, "4.3", 4.3.1, 4.3.2, 4.3.3, 4.3.4, "4.4" ] }
depends: [ commercial, creative, guarantees ]
lock_depends: { with-our-stack: [ line-item ] }
types:
  - name: Assent
    kind: object
    ir: field:4.1:assent
    locks: [ main, with-open-prs ]
    source: { decision: D-016 }
    open: true
    description: "The buyer's and the seller's assent records, with their timestamps, for the binding version; the signature scheme is WS1. The specification states no members, so the object accepts any."
  - name: Proposal
    kind: document
    ir: field:4.1:proposal_id
    source: { rule: document-owner }
  - name: ProposalType
    kind: vocabulary
    ir: field:4.1:type#description/values:1
    locks: [ with-our-stack ]
    source: { rule: row-vocabulary }
    open: false
    terms: [ standard, custom ]
  - name: HistoryEntry
    kind: object
    ir: key:4.1:HistoryEntry.version
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
  - name: HistoryEntryAction
    kind: vocabulary
    ir: key:4.1:HistoryEntry.action#meaning/values:1
    locks: [ with-our-stack ]
    source: { rule: row-vocabulary }
    open: false
    terms: [ published, requested, granted, countered, declined, withdrawn ]
  - name: HistoryPath
    kind: object
    ir: key:4.1:HistoryPath.line_item_id
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
  - name: RequestedValue
    kind: object
    ir: key:4.1:RequestedValue.list_rate
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
  - name: Package
    kind: object
    ir: key:4.1.4:Package.package_id
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
  - name: MinCommitment
    kind: object
    ir: key:4.1.4:MinCommitment.line_item_id
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
    holds: [ { kind: named, name: CommitmentAmount } ]
  - name: Specifications
    kind: union
    ir: field:4.2:specifications
    locks: [ main, with-open-prs ]
    source: { decisions: [ D-016, D-017 ] }
    any_of: [ { kind: named, name: Text }, { kind: named, name: SpecificationsDetail } ]
  - name: SpecificationsDetail
    kind: object
    ir: field:4.2:specifications
    locks: [ main, with-open-prs ]
    source: { decisions: [ D-016, D-017 ] }
    open: true
    description: "Structured detail at media-kit depth. The specification states no members, so the object accepts any."
  - name: ChangeRequest
    kind: object
    ir: key:4.4:ChangeRequest.id
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
