question: Does the feedback gate catch the model, a constructor's copy, and a profile in the working group's text, as a review found them there?
decision: >-
  The internal-term check also fails on "the model", on "copy" in the sense
  of a constructor's copy, as "its selectable copy" or "a copy of a
  constructor", and on "profile", in the text for the working group; "copy"
  as a verb, as § 5.2.2 copies an AdCOM list, stays plain English. The
  records that used them say instead "its selectable form", "the generated
  schemas leave", "the generated table writes", "the proposal's summary",
  and "a separate inspection specification". Two fixtures give a reason and
  a summary those terms. The round-trip and examples gates read the records
  whose reasons changed, so their fingerprints change with no change to what
  they check.
rationale: >-
  The check missed internal terms a review found in the generated text. It
  catches more now and drops nothing, and two fixtures are added, so no gate
  is weaker.
