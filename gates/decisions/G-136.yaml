format: 1
id: G-136
date: 2026-10-28
question: What changes in the gates when AdCOM's proto package becomes com.postindustria.adcom.v1, a code's title drops its gloss and reads a name before a colon with no space, and a decision record may name a code its row doesn't?
decision: >-
  The owner's decisions on the proto target and the code titles. AdCOM's
  profile names the package com.postindustria.adcom.v1, and its file moves
  to proto/com/postindustria/adcom/v1/lists.proto; the proto gates'
  fixtures name the new path. The generic title rule (src/emit.ts
  rowName, withoutGloss, codeTitle) reads a row's name before a colon with
  or without a space after it, as "Interstitial:Video ads …" names
  Interstitial, but never a URL's colon or one a digit follows, and drops a
  gloss: a parenthesized aside that starts "i.e.", "ie.", or "e.g.",
  closed or not, and a tail that starts so; any other aside, such as
  "(deprecated)", stays. A decision record may give the codes of a list whose
  rows give no usable name short names, under a new `names` field, by each
  row's IR element, which the record must cover; only a standing record
  names a code, and model-resolves fails a record that names a row it
  doesn't quote, or a row that is no code (fixtures). The term entries stay
  the list-code rule's, since a decision covers only what no rule decides.
  AdCOM's D-019, D-020, and D-021, gaps, quote the rows of List: Agent
  Types 1 and 3, List: Playback Methods 1, 2, 4, 5, and 6, and List:
  User-Agent Source 1 and 2, name each code, and ask AdCOM to name
  every code. The release differ reports a decided name's change as an
  annotation. 29 titles change: 20 from the rule, 17 in AdCOM and 3 in
  the Deals API, and 9 from the decisions; 26 proto value names change. The
  target rules record the package's folders, the code 0 that keeps the
  spec's name as the spec's choice, and that names follow the spec alone,
  with compatibility by number. The target rules also record, for every spec once the target writes
  messages, how a service on the proto and a client on the schemas exchange
  the same JSON, and how its message fields are numbered: seeded from
  adcom-proto's numbers alone, kept in an append-only numbering file, and
  held by buf breaking, which arrive with the first messages. The README
  says to read and write AdCOM's enums by number.
  The suite holds 543 tests.
rationale: >-
  No check is relaxed. Only titles and names change: no code, no term, no
  verdict, and no number. The corpus, the type examples, the rules, and
  every vector are unchanged; the release differ finds 9 annotation
  changes in AdCOM's model on each lock and no reported change in any
  spec's schema files, whose digests alone move; all 316 proto values keep
  their numbers. The pipeline gates in this list change fingerprint
  because they reach the mapping's, the model's, or the emitter's code.
