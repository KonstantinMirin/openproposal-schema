format: 1
id: G-035
date: 2026-10-26
question: Which gates change when `Party` moves to the kernel beside `Marker`, and each open object carries a description of what its row says it holds?
decision: >-
  A type entry that defines a vocabulary may name `kernel` as its `module`,
  for a vocabulary no module owns; the mapping schema allows it on a
  vocabulary only, and the entry stays in the file of the module that owns
  its section, so the bijection and section gates hold. `Party`, the two
  parties every § 3 marker names, is the kernel's now, emitted in
  kernel.json, and the creative module no longer depends on proposal. An
  open object's declaration may give a `description`, which the model, the
  schemas, and the SDK types carry; each open object gives one from its
  row's prose, and the D-016 feedback proposes a structure for each, read
  from that prose, which the schema doesn't adopt. A vocabulary whose terms
  rest on no element is no longer taken for the marker vocabulary. The test
  suite holds 341 tests, so its floor rises to 341.
rationale: >-
  The model placed a kernel concept in one module and made another module
  depend on it, and the open objects emitted no description although their
  rows describe them. Every gate keeps its checks, the module and section
  gates still hold every entry to its section's file, and the test floor
  rises, so no gate is weaker.
