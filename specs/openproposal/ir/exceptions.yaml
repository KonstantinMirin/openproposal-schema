# Exception registry for stage 2 findings.
#
# Each entry names one finding by its id, gives a fixed verdict, and says why.
# Verdicts (src/exceptions.ts):
#   accepted        the finding is correct, and the specification is fine as written
#   false_positive  the lint misreads the specification here
#   mapping         stage 3 resolves it with a reviewed mapping entry
#   feedback        it goes to the working group as implementation feedback
# `locks` limits an entry to some lock names; without it, the entry applies to
# every lock. An entry that names no current finding is stale and fails the build.
#
# Only findings with a settled verdict belong here. Open findings are the
# implementation feedback, so they stay open until someone decides them.
exceptions:
  # Names from other standards and protocols. The specification cites them; it doesn't define them.
  - { finding: "unresolved_identifier:App", verdict: accepted, reason: "AdCOM 1.0 distribution channel name, cited in the § 5.2.1 environments table.", locks: [with-open-prs] }
  - { finding: "unresolved_identifier:Site", verdict: accepted, reason: "AdCOM 1.0 distribution channel name, cited in the § 5.2.1 environments table.", locks: [with-open-prs] }
  - { finding: "unresolved_identifier:Dooh", verdict: accepted, reason: "AdCOM 1.0 distribution channel name, cited in § 5.1.1 and § 5.2.1.", locks: [with-open-prs] }
  - { finding: "unresolved_identifier:Placement", verdict: accepted, reason: "AdCOM 1.0 object name, cited as the source of the § 5.2.2 keys.", locks: [with-open-prs] }
