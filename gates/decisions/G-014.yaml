format: 1
id: G-014
date: 2026-10-26
question: How does a part bound its own list member, as a daypart window's `days` holds at least one day, each once, and how does a part scope each decision to its locks?
decision: >-
  A part's `dependentSchemas` may bound its own list member while it is
  present, `{ <m>: { properties: { <m>: { type: array, minItems, uniqueItems } } } }`,
  and the constructors check fails a bound that names another member or a
  member that is no list. A part lists each decision with the locks it
  applies on, in place of one `decision_locks` for all. The corpus reads the
  bound's `type` as implied by the member's own, relaxes both together, and
  builds the member within the bound; its mutants are the empty list and a
  day twice. The SDK builder reads the bound as a shape's `bounds`, which the
  TypeScript, Python, and Go runtimes check. The plain generator drops the
  bound, so PG-12 lists its two mutants. A test checks the emitted bound on
  both locks; the copy-keyword test allows `minItems` and `uniqueItems`,
  which are 2020-12 keywords; the clock test reads the window's decisions on
  each lock; the constructors test checks a bound's member. The test suite
  holds 314 tests, so its floor rises to 314.
rationale: >-
  A window with no day never applies and a day named twice names one window
  twice (D-045), and the constraint belongs to one member of one part, so it
  stays in the part (type rules § 4) as standard keywords the schema states,
  checked by the oracle, the corpus, and all three SDKs. No check accepts a
  value it rejected: the corpus gains two isolated cases, the new exemption
  names two cases the reference rejects and the plain generator can't, and
  the test floor rises, so no gate is weaker.
