format: 1
id: G-023
date: 2026-10-26
question: Which gates change when a declared vocabulary may say what its terms mean, as a frequency cap's period says it spells OpenDirect's codes and which terms are calendar periods?
decision: >-
  A vocabulary the mapping declares may carry a `description`, what its
  terms mean where no row says; the mapping format allows it on a vocabulary
  only. The model keeps it, the emitter puts it before the list's citation
  and the terms' codes, and the SDKs add it to the vocabulary's doc comment.
  `FrequencyCapPeriod` says that each term spells an OpenDirect 2.1
  `Line.frequencyinterval` code, that `hour`, `day`, `week`, and `month` are
  calendar periods on the line item's clock, a `day` from midnight to
  midnight and a week from Monday, and that `flight`, OpenDirect's
  `LineDuration`, is no calendar period but runs between the flight's start
  and end. A test checks the emitted description on both locks. The test
  suite holds 322 tests, so its floor rises to 322.
rationale: >-
  The description adds prose and changes no value a schema accepts, so every
  gate checks what it checked; the mapping format rejects a description on
  any other kind, and the test floor rises, so no gate is weaker.
