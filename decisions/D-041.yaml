options:
  - id: named-open-vocabulary
    summary: Each field gets a named open vocabulary with the core terms the specification lists, none yet, so each accepts namespaced terms `<domain>:<term>` only.
  - id: bare-term
    summary: Each field takes any bare term, letters and digits joined by underscores, as the examples write them.
chosen: named-open-vocabulary
rationale: >-
  Each of these fields holds terms: an audience's `provenance`, a creative
  delivery's `protocol`, an asset's `approval_status`, an availability's
  `unit` and `basis`, a guarantee's `basis`, a report's `delivery_mechanism`,
  and, on `main`, an external reference's `role`. The text lists no terms for
  them, and the examples write bare terms such as `modeled`, `javascript_tag`,
  `mrc`, `seller_reported`, `vast_4_2`, `api`, and `s3`. Every open
  vocabulary of the specification is a core list that implementations extend
  with namespaced terms. A bare term is open in the wrong direction: it
  accepts any word as if it were core and rejects the namespaced extension. A
  named vocabulary per field gives each concept a type, and its core grows as
  the specification lists terms. The schema departs from the examples: until
  the specification lists a field's core terms, the field accepts only
  namespaced terms.
feedback: >-
  List the core terms of each field whose values are terms. These are an
  audience's `provenance`, `creative_delivery.protocol`, an asset's
  `approval_status`, `availability`'s `unit` and `basis`,
  `committed_metrics[]`'s `basis`, and `reporting`'s `delivery_mechanism`. The
  examples use `modeled`, `first_party`, `javascript_tag`, `vast_4_2`, `mrc`,
  `seller_reported`, `api`, and `s3`, which aren't listed. Until they are, each
  field accepts only namespaced extension terms.
sets_aside:
  - { type: AssetApprovalStatus, field: "assets[].approval_status", ir: "field:5.4:assets[]#description/object:1" }
  - { type: AvailabilityBasis, field: availability.basis, ir: "field:5.6:availability#description/object:1" }
  - { type: AvailabilityUnit, field: availability.unit, ir: "field:5.6:availability#description/object:1" }
  - { type: CreativeDeliveryProtocol, field: creative_delivery.protocol, ir: "field:5.4:creative_delivery#description/object:1" }
  - { type: ExternalReferenceRole, field: "external_references[].role", ir: "field:5.10:external_references[]", locks: [ main ] }
  - { type: MeasurementBasis, field: "committed_metrics[].basis", ir: "field:5.7:committed_metrics[]#description/object:1" }
  - { type: Provenance, field: "audiences.available[].provenance", ir: "field:5.3:audiences#description/object:1" }
  - { type: ReportingDeliveryMechanism, field: "reporting.available[].delivery_mechanism", ir: "field:5.7:reporting#description/object:1" }
