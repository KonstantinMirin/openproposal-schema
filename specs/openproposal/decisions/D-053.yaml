options:
  - id: text-grammar
    summary: "A term is ASCII letters, digits, `_`, and `-`, and an extension term is `<domain>:<term>`. A row's own list or the value table its key heads is a vocabulary named after the row's object and key, open for a `VocabularyTerm` and closed for an `Enum` or an `Integer`. `MediaChannel`, `ExclusionType`, and `Environment` keep the names the text gives them; `Environment` is closed, as it isn't a `VocabularyTerm`. A `VocabularyTerm` row that lists no core terms is an open list of its own, named the same way, whose terms their definers give. The options of `shortfall_remedy`, which its row says are `makegood`, `credit`, and `none`, are the list `Preemption.remedy` writes with the same terms, which § 2.6 says is written once."
  - id: kernel-grammar
    summary: "The kernel's term grammar, with no `-`."
chosen: text-grammar
rationale: >-
  § 2.2 defines a `VocabularyTerm` as a bare core term or `<domain>:<term>`, a
  term being ASCII letters, digits, `_`, and `-`, and § 2.6 says a
  `VocabularyTerm` field lists its core terms, an `Enum` is a closed list
  written in its row, and every other list is closed. A list the text doesn't
  name takes the name of the row that writes it, its object's and its key's,
  so `AssentEntry.role` is `AssentEntryRole`. `MediaChannel` and
  `ExclusionType` are `VocabularyTerm`s by their own sentences, and
  `Environment` is a value of its table.
feedback: >-
  None needed.
