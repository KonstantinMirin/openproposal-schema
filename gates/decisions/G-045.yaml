format: 1
id: G-045
date: 2026-10-26
question: How does the ISO 4217 pin stay verifiable when SIX serves List One at a URL that names no version?
decision: >-
  A code list its keeper publishes outside git may name `copy`, the
  repository's copy of the file its URL served at `version`, under
  `kernel/sources/`. The kernel-check gate fails on such a list whose URL
  names no version and that has no copy, on a copy whose SHA-256 isn't the
  list's, and, for ISO 4217's List One, on a copy published on another date
  or holding a code or a label the list doesn't, or missing one it does.
  `kernel/sources/iso-4217-list-one-2026-09-17.xml` is the file SIX served
  at 2026-09-17, whose SHA-256 is the pinned one; the IANA URL names its
  release, so it needs no copy. Three fixtures drop the copy, drop a code,
  and change the SHA-256. The other gates read the kernel's and the lists'
  code, so their fingerprints change with no change to what they check.
rationale: >-
  The pin's SHA-256 named a file the URL would stop serving at the next
  amendment. The gate adds checks and three fixtures and drops none, so no
  gate is weaker.
