# The disagreements the fidelity gate (gates/fidelity.ts) expects, each group under
# the open task that removes them. The gate fails on a disagreement listed nowhere,
# on a listed one whose detail changed, and on a listed one that no longer occurs,
# so the task that fixes the model removes its entries. This file is an exemption:
# changing it changes the gate's fingerprint, which a gate decision must accept.
format: 1
groups: []
# Constraints the schema can't state, left to a rule. The gate passes such an
# invalid vector only when the listed rule applies to an object on the
# constraint's path and gives an invalid vector the constraint rules out, and
# fails an entry that no longer disagrees.
ruled:
  - constraint: "key:5.2.2:placement.plcmt#conditional@line_item.placement.plcmt"
    locks: [ with-open-prs ]
    rule: "rule:5.2:f3d3f9e8"
    reason: >-
      § 5.2.2 makes `plcmt` REQUIRED for video ads, a condition on the line
      item's `channel`, which sits outside the `placement` object, so the
      `Placement` schema can't state it. The rule states it, with an invalid
      vector of a video line item whose placement has no `plcmt`.
  - constraint: "field:5.9:retention#conditional@line_item.retention"
    locks: [ with-our-stack ]
    rule: "rule:5.9:d8611936"
    reason: >-
      § 5.9 makes `retention` REQUIRED when `serving_mode` is `embedded`,
      which D-060 states as a rule of the line item, as it does every stack
      `REQUIRED when` cell, with an invalid vector of an embedded line item
      that has no `retention`.
  - constraint: "field:5.9:sov_share#conditional@line_item.sov_share"
    locks: [ with-our-stack ]
    rule: "rule:5.9:ceef2a21"
    reason: >-
      § 5.9 makes `sov_share` REQUIRED when `sov_basis` is `impressions`,
      which D-060 states as a rule of the line item, with an invalid vector
      of a line item sold on impressions that has no `sov_share`.
