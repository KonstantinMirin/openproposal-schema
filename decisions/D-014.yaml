options:
  - id: by-role
    summary: "Closed: the states, actions, parties, and switches that the protocol itself acts on. Open: lists of market options that sellers and vendors extend, such as channels, environments, routes, and cost methods."
  - id: all-closed
    summary: Every list is a closed `enum`
  - id: all-open
    summary: Every list is open.
chosen: by-role
rationale: >-
  A closed list is right where a receiver must act on every value: the
  lifecycle states (`ProposalStatus`, `LineItemStatus`, `HoldState`), the
  negotiation actions and parties (`NegotiationAction`, `Party`), and the
  switches that change how a document is read (`ProposalType`,
  `LinkedExecution`, `Visibility`, `HoldScope`, `CommitmentBasis`,
  `AvailabilityType`, `PlcmtSubtype`, `ExclusionType`,
  `Enforcement`, `CredentialType`, `AgreementType`, and the kernel's
  `Marker`). `CredentialType` and `AgreementType` already end in `custom` and
  `other`. Every other list names options in a market that moves: the
  specification says so for `channel` (§ 5.1.1 tells a consumer to skip an
  unknown one), the store platforms ("and other store platforms"),
  `cost_method` ("etc."), and `environments` (open question 7), and the same
  holds for activation routes, delivery methods, frequency-cap bases,
  remedies, feed types, credential schemes, buying routes, transaction
  mechanisms, serving modes, metrics, and reference roles. An open vocabulary
  is the core `enum` or a `NamespacedTerm` (type rules § 6), so an extension
  never collides with a future core term.
evidence:
  - docs/design/initial-design.md (channels and vocabularies)
feedback: >-
  Say for each value list whether it is closed or extensible, and how an
  extension term is spelled. The skip rule for an unknown `channel`, "and other
  store platforms", and "etc." in `cost_method` imply extensible lists. None
  says how to extend them.
