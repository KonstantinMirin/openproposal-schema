findings:
  - example: calendar-zone-d09-zone-with-hour.yaml
    path: /pricing/0/cost_parameters/rate_unit
    kind: invalid
    reason: >-
      `calendar_zone` beside `rate_unit: hour`: `calendar_zone` is absent
      unless `rate_unit` is `day` (§ 5.6.5), so the file fails at the
      `rate_unit` the condition reads.
  - example: calendar-zone-d10-zone-with-week.yaml
    path: /pricing/0/cost_parameters/rate_unit
    kind: invalid
    reason: >-
      `calendar_zone` beside `rate_unit: week`: `calendar_zone` is absent
      unless `rate_unit` is `day` (§ 5.6.5), so the file fails at the
      `rate_unit` the condition reads.
  - example: calendar-zone-d11-bad-zone-name.yaml
    path: /pricing/0/cost_parameters/calendar_zone
    kind: invalid
    reason: >-
      `Sydney/Australia` is no name in the IANA time zone database, which an
      `IanaZone` names (§ 2.2); the schemas list the names of release 2026e
      (D-064).
  - example: billable-day-a3-mon-1800-tue-0600-two-days-spend.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.5:aa43e614
    reason: >-
      The flight, Monday 18:00 to Tuesday 06:00 Sydney, is 12 hours, so with
      no `calendar_zone` § 5.6.5 counts 1 elapsed day, rounded half up, and a
      `TIME` amount on `spend` is that day's seller total, A$1,500; the file
      commits A$3,000 (D-065).
  - example: billable-day-a3-mon-1800-tue-0600-two-days-spend.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.5:d956510e
    reason: >-
      The same 12-hour flight counts 1 elapsed day, and the file writes
      `derived_units: 2` (§ 5.6.5, D-065).
  - example: billable-day-a4-mon-1800-tue-0600-two-days-units.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.5:aa43e614
    reason: >-
      The `a3` flight with `basis: units` and an `amount` of 2: with no
      `calendar_zone` § 5.6.5 counts 1 elapsed day, and a `TIME` amount on
      `units` is that count (D-065).
  - example: billable-day-b3-mon-0900-1100-min1.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.1:78efd2ce
    reason: >-
      A 2-hour flight on a day rate counts 0 elapsed days, rounded half up (§
      5.6.5), and a commitment fits the committed entry's `unit_bounds` (§
      5.6.1), which `min: 1` sets above 0 (D-065).
  - example: calendar-zone-d06-two-day-flight-one-unit-spend.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.5:aa43e614
    reason: >-
      With `calendar_zone: Australia/Sydney`, the Monday 18:00 to Tuesday
      06:00 flight touches two calendar days, so § 5.6.5 counts 2 units and a
      seller total of A$3,000; the file commits A$1,500 (D-065).
  - example: calendar-zone-d08-two-day-flight-units-1.yaml
    path: ""
    kind: rule
    rule: sentence:5.6.5:aa43e614
    reason: >-
      The `d06` flight with `basis: units` and an `amount` of 1: the flight
      touches two Sydney calendar days, so § 5.6.5 counts 2 units, and a
      `TIME` amount on `units` is that count (D-065).
