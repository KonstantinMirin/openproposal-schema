# The kernel's and the constructors' rule programs (src/rule-program.ts): the
# checks of the rules kernel/primitives.yaml and kernel/constructors.yaml
# state, which every specification's types share. The gates run each one as
# its rule's check, and the SDK emitters write it into every SDK with the
# rule's owner: a primitive, a part, or a constructor's template, which runs
# it on every application. A spec's own programs are in its folder.
format: 1
defs:
  # § 2.2, Selectable: the options in `available[]`, by name: a string option by its value, an object option by its `id`;
  # a `catalog_ref` option has no name (D-007).
  available_options: [if, [islist, [get, [$], available]], [get, [$], available], [list]]
  option_names:
    [concat,
      [filter, [def, available_options], o, [isstr, [var, o]]],
      [filter, [map, [def, available_options], o, [if, [ismap, [var, o]], [get, [var, o], id], null]], n, [isstr, [var, n]]]]
  included_names: [filter, [if, [islist, [get, [$], included]], [get, [$], included], [list]], n, [isstr, [var, n]]]
  priced: [if, [ismap, [get, [$], pricing]], [get, [$], pricing], null]
  # § 2.2, Range: the bounds compared as their type orders them: numbers as numbers, timestamps as the instants they
  # name, and durations by their calendar and exact parts, where one is no greater than another when neither of its
  # parts is (D-062), so a pair neither bounds, as P1M and P30D, isn't ordered.
  range_min: [get, [$], min]
  range_max: [get, [$], max]
  range_numbers: [and, [isnum, [def, range_min]], [isnum, [def, range_max]]]
  range_instants: [and, [isnum, [moment, [def, range_min]]], [isnum, [moment, [def, range_max]]]]
  range_durations: [and, [islist, [duration, [def, range_min]]], [islist, [duration, [def, range_max]]]]
  duration_min: [duration, [def, range_min]]
  duration_max: [duration, [def, range_max]]
  durations_ordered: [and, [le, [at, [def, duration_min], 0], [at, [def, duration_max], 0]], [le, [at, [def, duration_min], 1], [at, [def, duration_max], 1]]]
  durations_reversed: [and, [ge, [at, [def, duration_min], 0], [at, [def, duration_max], 0]], [ge, [at, [def, duration_min], 1], [at, [def, duration_max], 1]]]
  range_bounded: [and, [ismap, [$]], [has, [$], min], [has, [$], max]]
  range_reversed:
    [and, [def, range_bounded],
      [or,
        [and, [def, range_numbers], [gt, [def, range_min], [def, range_max]]],
        [and, [def, range_instants], [gt, [moment, [def, range_min]], [moment, [def, range_max]]]],
        [and, [def, range_durations], [not, [def, durations_ordered]], [def, durations_reversed]]]]
  range_unordered: [and, [def, range_bounded], [def, range_durations], [not, [def, durations_ordered]], [not, [def, durations_reversed]]]
  # § 3, DaypartWindow: a time of day, `HH:MM` from `00:00` to `24:00`, as minutes since midnight; null for any other value.
  window_start_parts: [if, [matches, [get, [$], start], "[0-9]{2}:[0-9]{2}"], [split, [get, [$], start], ":"], null]
  window_end_parts: [if, [matches, [get, [$], end], "[0-9]{2}:[0-9]{2}"], [split, [get, [$], end], ":"], null]
  window_start_h: [num, [at, [def, window_start_parts], 0]]
  window_start_m: [num, [at, [def, window_start_parts], 1]]
  window_end_h: [num, [at, [def, window_end_parts], 0]]
  window_end_m: [num, [at, [def, window_end_parts], 1]]
  window_start:
    [if, [or, [and, [lt, [def, window_start_h], 24], [lt, [def, window_start_m], 60]], [and, [eq, [def, window_start_h], 24], [eq, [def, window_start_m], 0]]],
      [add, [mul, [def, window_start_h], 60], [def, window_start_m]], null]
  window_end:
    [if, [or, [and, [lt, [def, window_end_h], 24], [lt, [def, window_end_m], 60]], [and, [eq, [def, window_end_h], 24], [eq, [def, window_end_m], 0]]],
      [add, [mul, [def, window_end_h], 60], [def, window_end_m]], null]
rules:
  # ISO 4217 List One, at its pinned publication: the alphabetic codes it assigns now. A value the schema rejects, by its
  # pattern, is no code to look up.
  kernel:CurrencyCode:assigned:
    owner: CurrencyCode
    violations:
      - when: [and, [isstr, [$]], [matches, [$], "[A-Z]{3}"], [not, [listed, ISO 4217, [$]]]]
        path: ""
        message: [str, [json, [$]], " is no code ISO 4217 assigns"]
  # ISO 3166-1, as the iso-codes project lists it at its pinned release: the alpha-3 codes of the countries it assigns.
  kernel:CountryCode:assigned:
    owner: CountryCode
    violations:
      - when: [and, [isstr, [$]], [matches, [$], "[A-Z]{3}"], [not, [listed, ISO 3166-1 alpha-3, [$]]]]
        path: ""
        message: [str, [json, [$]], " is no alpha-3 code ISO 3166-1 assigns"]
  # The IANA time zone database, at its pinned release: the names of its zones and links; `viewer_local` is the text's own.
  kernel:TimeZone:listed:
    owner: TimeZone
    violations:
      - when: [and, [isstr, [$]], [ne, [$], viewer_local], [matches, [$], "[A-Z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*"], [not, [listed, IANA time zone database, [$]]]]
        path: ""
        message: [str, [json, [$]], " is no zone the IANA time zone database lists"]
  # Each `included[]` entry and each `pricing` key names an option in `available[]`.
  constructor:Selectable:options-named:
    owner: Selectable
    violations:
      - each: [if, [and, [ismap, [$]], [islist, [get, [$], included]]], [get, [$], included], null]
        as: [i, x]
        when: [not, [and, [isstr, [var, x]], [contains, [def, option_names], [var, x]]]]
        path: [pointer, included, [var, i]]
        message: [str, "names no option of `available[]`: ", [json, [var, x]]]
      - each: [if, [ismap, [$]], [def, priced], null]
        as: [k, x]
        when: [not, [contains, [def, option_names], [var, k]]]
        path: [pointer, pricing, [var, k]]
        message: [str, "the `pricing` key ", [json, [var, k]], " names no option of `available[]`"]
  # A `pricing` key prices an option outside `included[]`.
  constructor:Selectable:priced-beyond-included:
    owner: Selectable
    violations:
      - each: [if, [ismap, [$]], [def, priced], null]
        as: [k, x]
        when: [contains, [def, included_names], [var, k]]
        path: [pointer, pricing, [var, k]]
        message: [str, "prices ", [json, [var, k]], ", which `included[]` holds"]
  # `min` is no greater than `max`.
  constructor:Range:ordered:
    owner: Range
    undecided: [def, range_unordered]
    violations:
      - when: [def, range_reversed]
        path: ""
        message: "`min` is more than `max`"
  # A duration range's `min` is no greater than its `max`, part by part (D-062).
  constructor:Range:duration-ordered:
    owner: Range
    undecided: [def, range_unordered]
    violations:
      - when: [def, range_reversed]
        path: ""
        message: "`min` is more than `max`"
  # A window's times compare as times of day; a value the schema rejects, such as `9:00`, compares as nothing.
  kernel:DaypartWindow:ordered:
    owner: DaypartWindow
    violations:
      - when: [and, [ismap, [$]], [isnum, [def, window_start]], [isnum, [def, window_end]], [le, [def, window_end], [def, window_start]]]
        path: ""
        message: [str, "`end` ", [get, [$], end], " isn't later than `start` ", [get, [$], start]]
