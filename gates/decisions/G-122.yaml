format: 1
id: G-122
date: 2026-10-28
question: What changes in the gates when the Deals API reaches its model, with its mapping, its 32 decision records, and its kernel binding?
decision: >-
  specs/dealsapi/ holds four mapping modules, overview, deal, buyer-seat,
  and guidance; 32 decision records, the plan's D1 to D30 with the names of
  the code lists and the guidance's obligations, one of them a departure,
  the ISO 3166-1 country codes; and a kernel binding whose concepts cite the
  rows they type, `cur` as the money's sibling. The mapping rules read a
  field's type by what its plugin parses, so the Deals API's `string array`
  is OpenProposal's `Array[String]`, and OpenProposal's raw types map to
  them one to one. An owner of field rows that another owner's object field
  holds, as `terms` holds `Object: Terms`, is a closed object named by its
  heading (rule `held-object`), the field has it (rule
  `held-object-field`), and it is no document; the naming check takes the
  heading's name. `domain-row` types a field whose only value lists restate
  its concept's type, as `guar`'s "where 0 = …, 1 = …" restates
  `IntegerFlag`. `enum-row` reads an integer field, or a list of integers,
  with one value list. `restated-value-list` takes two lists that both
  label their codes as one only with the same labels, and `concept-row`
  leaves a table whose columns are headed by member names to a decision,
  as the Example Scenarios are partial deals. A vocabulary type entry may
  state a vendor range, as `pricetype`'s "500 and greater", and an integer
  list whose codes all carry labels is a labeled list, so lists of the same
  codes and different labels are two lists; a code a list gives twice, as
  the tag's `sellerstatus` gives 4, holds both labels. A property may carry
  its stated default beside its type in the model. List's own vectors name
  `ExternalId`, which every spec that binds List has, where they named
  OpenProposal's `FormatId`. A lock's name may join its parts with a dot,
  as `tag-1.0-202602`. The constructors format lets a part take any
  members, as `Ext`. Three mapping fixtures run on the Deals API: a labeled
  list read as another's restatement, a scenario row read as a concept row,
  and a heading-named object declared by a decision. The test suite holds
  520 tests, and MIN_TESTS is 520.
rationale: >-
  The new rules apply only where a text has object tables or labeled code
  lists, which OpenProposal and AdCOM don't, so their mappings and outputs
  are unchanged; each widened pattern admits a lock name or a part's form
  a spec writes, and every check that read them still runs.
