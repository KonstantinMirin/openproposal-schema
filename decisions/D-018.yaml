options:
  - id: none
    summary: >-
      None. Each field takes its full form only. A seller-set value is the full
      form: one option in `available[]` and the same option in `included[]`, or
      one value in `allowed[]`.
  - id: one-value
    summary: Every field also takes one value of its option type.
chosen: none
rationale: >-
  § 3.1, § 3.2, and § 5.5 let a field carry a bare value and treat it as
  seller-set, but they never say what a bare value is (D-008). For most fields
  any choice would invent structure: a bare `geo` could be one code or
  several, a bare `frequency_cap` would replace its `max`, and the examples
  write none. The full form states every seller-set value already. With no
  bare value, the constructors take no `B`, and the untagged fallback union of
  type rules § 8 doesn't occur.
feedback: >-
  State the type of the bare value for each selectable and settable field, or
  drop the fallback in § 3.1, § 3.2, and § 5.5.
