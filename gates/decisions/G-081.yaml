format: 1
id: G-081
date: 2026-10-27
question: What changes in the gates to close the gaps an independent review of the multi-spec layout found?
decision: >-
  A new gate, layout-tracked, fails on a file tracked under the root's
  spec-input/, schemas/, rules/, corpus/, type-examples/, comparison/, or
  feedback/, which the tracked-file gates no longer read since they read
  each spec's folder, and on anything but a format schema under the root's
  ir/, mapping/, decisions/, vectors/, examples/, variants/,
  field-examples/, roundtrip/, plain-generator/, or releases/; it has two
  fixtures. CI checks every folder under specs/, so one without a profile
  fails its load instead of being skipped, and the spec-profile gate fails
  a profile that calls a spec with locks a schema set, with a fixture. The
  lint names each owner the field rows have, not only OpenProposal's two.
  A spec plugin's rule check that takes a kernel or constructor rule's ID
  fails the build instead of replacing it. A plugin needs no stub: the row,
  type-cell, value-list, identifier-list, marker, and conventions readers
  are optional, and a row kind no reader reads fails extraction. The site
  reads its worked example and the type map's default type from the
  profile, and its assets name the issue and the default type by tokens the
  build fills, failing on a token it doesn't know. Unused imports are gone,
  and the extraction report's links point into the spec's folder. Four
  tests cover these and a fifth that every relative link in the README and
  docs/ resolves; the suite holds 431 tests, and MIN_TESTS is 431.
rationale: >-
  Each change adds a check or keeps one, and no output changes: every
  committed file regenerates to its bytes and the site build is the one
  G-077 accepted. The new gate restores the coverage of the root's old
  folders that the move to specs/ left, and the CI change keeps a spec from
  leaving every gate by losing its profile.
