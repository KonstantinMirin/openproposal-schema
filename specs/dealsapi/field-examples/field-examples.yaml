# Per-field example values for readers' example payloads (src/field-examples.ts).
# Each entry names a member by the IR element its property rests on and the member's name,
# for a member the specification's examples give no value. The values are for the type
# examples only, not conformance vectors; the type-examples gate checks each one against the
# member's emitted schema and the rules, and fails on one the specification's examples now
# give, or whose element or member no longer exists. A second value is for a second option.
format: 1
fields:
  # Deal ----------------------------------------------------------------------------
  - ir: field:object-deal:id
    member: id
    values: [ ssp-deal-2026-q4-0193 ]
  - ir: field:object-deal:name
    member: name
    values: [ "Business news, US and Canada, Q4 2026" ]
  - ir: field:object-deal:created
    member: created
    values: [ "2026-10-15T09:30:00Z" ]
  - ir: field:object-deal:origin
    member: origin
    values: [ examplessp.example ]
  - ir: field:object-deal:seller
    member: seller
    values: [ examplepub.example ]
  - ir: field:object-deal:desc
    member: desc
    values: [ "Weekday business news readers on desktop and mobile web and in the publisher's app." ]
  - ir: field:object-deal:bseat
    member: bseat
    values: [ [ agency-seat-0007 ] ]
  - ir: field:object-deal:adtypes
    member: adtypes
    values: [ [ 1, 2 ] ]
  - ir: field:object-deal:sellerstatus
    member: sellerstatus
    values: [ 0 ]

