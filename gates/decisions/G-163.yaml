format: 1
id: G-163
date: 2026-11-13
question: How do OpenProposal's last rules checked in TypeScript, the six of src/specs/openproposal/rule-checks.ts on `main` and `with-open-prs`, come to run in every SDK, and does any rule check written in TypeScript remain?
decision: >-
  The six checks are programs in specs/openproposal/rule-programs.yaml, and
  the written ones are gone; the spec plugin's checks are its programs:
  § 2.2's agreed line item with a `catalog_ref`, § 5.2.1's environments that
  hold no impression of the channel, § 5.2.2's viewability measured by the
  seller only without OMID 1.0, § 5.2's `plcmt` for video, and § 5.5's
  hash-pinned `list_ref` and accepted exclusion types. Each keeps its
  messages, its places, and its undecided cases. The evaluators gain
  `["part"]`, whether the value is the part of a document a code block of
  the specification shows, which the examples gate gives and no SDK's
  payload is, and `["places", x, key]`, every member of a name at any
  depth, which § 2.2's rule reads for its references; and `table` reads a
  key a table holds, never one an object inherits. § 5.2.2's rule reads the
  seller of the proposal that holds the line item, so it runs on the
  proposal; on `with-open-prs` no proposal holds a line item, line items
  being documents of their own, so no value an SDK checks holds both, and
  the program says so (`unheld`): no SDK of that lock runs it, the gates
  read the seller a vector's context gives, and the sdk-rules gate names
  the rule. A holder that holds no value of its rule's owner, with no such
  reason, fails SDK generation, a fixture of the sdk-generate gate. The
  guard's fixture for a spec's rule check that finds nothing now weakens a
  program, which the rule-programs gate's fingerprint holds.
rationale: >-
  No check is weaker: each program decides every vector of its rule as the
  written check did, which the rule-checks gate and the rule-checks tests
  hold, and the SDKs reject what five of the six reject, which they
  accepted before; the sixth, § 5.2.2's, no SDK on `with-open-prs` could
  decide before or now, for want of the seller, and its two invalid
  vectors count as unreached. Counting the single-payload rule vectors on
  which each SDK reaches the gates' own verdict, an unreached vector as
  failed, `main` passes 23 of 23, `with-open-prs` 50 of 52, and the stack
  208 of 208. No rule check written in TypeScript remains for OpenProposal,
  the kernel, or the constructors; the Deals API's eight, in
  src/specs/dealsapi/rule-checks.ts, remain, and that spec has no SDK. The
  generated code changes in the SDKs alone: on `main` and `with-open-prs`,
  in each of their four trees, the line item's file, which runs the rules
  (on `main` § 2.2's, on `with-open-prs` § 2.2's, § 5.2.1's, § 5.2's, and
  § 5.5's two), and the rules file, which holds their programs and the
  evaluator's new operations; on the stack, the rules file's evaluator.
  Every other output of `main` and `with-open-prs` is byte-identical.
