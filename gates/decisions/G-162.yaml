format: 1
id: G-162
date: 2026-11-13
question: How do the kernel's and the constructors' rules, which every spec's types share, come to run in every SDK, on every lock, from one definition each?
decision: >-
  The checks of src/rule-checks.ts for the kernel's and the constructors'
  rules are programs in kernel/rule-programs.yaml, and the written ones are
  gone: CurrencyCode and CountryCode assigned and TimeZone listed, which
  read a pinned list, Range ordered and duration-ordered, Selectable's
  options named and priced beyond included, and DaypartWindow ordered. The
  gates' checks of those rules are the programs. A primitive's rule runs on
  the primitive's every value, in each SDK's scalar check, and a
  constructor's on every application of its template, in the template's
  shape. A program that reads a pinned list reads its codes from the
  programs, which carry each list a program reads, from kernel/lists.yaml,
  so each SDK holds the codes it checks; a lock whose rules count no
  calendar day carries a time zone table with no zones. A range's bounds
  compare by their kind, numbers as numbers, timestamps as the instants
  they name, offsets and fractions of a second included, and durations
  part by part (D-062), so the check needs no parameter type, which no SDK
  is given; a range whose `T` the model doesn't order is now decided by its
  bounds, where it was undecided. The evaluators gain the operations these
  read, `moment`, `duration`, `matches`, `split`, `num`, `pointer`, `json`,
  `listed`, and `map`, and a violation may apply once per item of a list
  or member of a map, at a path an expression gives. The parity cases count
  the rules on a template's application, by its copy or its template, and
  the sdk-rules gate holds each SDK to a constructor rule's vectors in the
  copy its arguments make. The rule-programs gate checks the kernel's file
  too, with two fixtures: a program for a rule the kernel doesn't state,
  and one that reads a list the kernel doesn't pin. The rule-checks
  fixture that removed a range's parameter type now gives a duration range
  neither part of which bounds the other, and the type-examples fixture
  that dropped USD from the codes now drops it from the programs' list.
rationale: >-
  No check is weaker: each program decides every vector of its rule as the
  written check did, and the rule-checks gate holds it to them; the SDKs
  reject what these rules reject, which they accepted before, on every
  lock. Counting the single-payload rule vectors on which each SDK reaches
  the gates' own verdict, `main` passes 22 of 23 where it passed 13,
  `with-open-prs` 42 of 52 where it passed 29, and the stack 208 of 208
  where it passed 199; the ten left are the six rules of OpenProposal's
  src/specs/openproposal/rule-checks.ts. The generated code changes on
  every lock, and for `main` and `with-open-prs` only in the SDKs, in
  their four trees, `sdk/`, `sdk/proposed/`, `sdk/with-open-prs/`, and
  `sdk/proposed/with-open-prs/`: the
  TypeScript `kernel.ts` (CurrencyCode's, and on `with-open-prs`
  TimeZone's, scalar check, and Range's, Selectable's, and DaypartWindow's
  shape) and `runtime.ts` (the rule checks), with `rules.ts` and
  `tzdata.ts`, a table with no zones, new; the Python `kernel.py` and
  `_runtime.py`, with `_rules.py` new; and the Go `kernel_types.go`, with
  `rules.go` new. Their schemas, rules, corpus, and every other output are
  byte-identical.
