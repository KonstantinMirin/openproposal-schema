format: 1
id: G-161
date: 2026-11-13
question: How do the stack's other single-payload rules, the presence rules of D-060, come to run in every SDK, from one definition each?
decision: >-
  Each of the 48 presence rules that src/specs/openproposal/stack-checks.ts
  checked in TypeScript is now a program in rule-programs.yaml, and the file
  is gone: 24 read their owner's value alone, and 24 its holder's (a
  history entry's `action`, a line item's `channel`, `pricing`,
  `properties`, or `transaction_mechanism`, a pricing entry's
  `cost_method`, a proposal's `status`, and, for a change request, the
  proposal's line items). Each requires its key where its condition holds,
  at the owner, with the message the written check gave, and is undecided
  where the written check was. The vectors of two rules named a context no
  SDK can read, a member of a type that doesn't hold the owner, and are
  rewritten to name the holder's members: rule:5.6:62e21e38, whose context
  was `Commitment.pricing_id`, now gives `LineItem.commitment`, and
  rule:4.4:9754e43c, whose context was `LineItem.external_references`, now
  gives `Proposal.line_items`, with each change request's baseline naming
  its line item. Each vectors entry says so. A vector of a rule on a holder
  is built in the holder with each object on the way its type's least
  example, so the holder the SDKs read is one its schema accepts. The
  sdk-rules gate gains a fixture: an SDK that accepts an invalid vector in
  its holder.
rationale: >-
  No check is weaker: each program decides every vector as the written
  check did, in the rules gate, and the SDKs now reject what the 48 rules
  reject, which they accepted before. Counting the stack's 208
  single-payload rule vectors on which each SDK reaches the gates' own
  verdict, the schemas and every rule check as the examples gate gives
  it, 199 pass in each SDK, where 161 did before step 2; the nine left are
  the kernel's and the constructors' rules. The two rewritten vectors keep
  their verdicts, and still break only their rule. The other fingerprints
  change because their code includes the rule checks. The generated code
  that changes is the two stack trees': the types that run the rules call
  them: `Proposal`, `HistoryEntry`, `HistoryPath`, `LineItem`,
  `PricingEntry`, `PropertyOption`, `Asset`, `MaterialsDue`,
  `AudienceSelectable`, `Fee`, `CommitResult`, and `ImpressionMultiplier`; and each SDK's programs hold them. The `main` and
  `with-open-prs` outputs are byte-identical.
