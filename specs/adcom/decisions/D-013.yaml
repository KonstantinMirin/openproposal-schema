format: 1
id: D-013
status: proposed
kind: gap
author: agent
question: "AdCOM types 0 or 1 flags as integers, and the protocol buffer definitions as booleans; eight attributes are a single value in one and an array in the other, in both directions, such as `playmethod`; and `Banner.link` is an object in AdCOM and a string there. Which does the schema follow?"
