format: 1
id: G-144
date: 2026-11-10
question: How do payloads that IAB Australia wrote to desk-test the stack become fixtures that CI holds to their verdicts?
decision: >-
  A spec's folder may hold desk-test sets, `desk-tests/<set>/`, each with its
  payloads, a README that says where they come from, and `expected.yaml`
  (desk-tests/desk-tests.schema.json), which names the lock, the document
  every payload is, the lock's checker, every payload, the location and kind
  of each expected rejection, and the undecided checks. The new
  desk-tests-load gate validates the file; the new desk-tests gate, after a
  lock's examples, judges every payload with the lock's schemas and rule
  checks, as the examples gate judges an example, and with the lock's own
  checker, run on a fresh tree of the lock's specification and examples with
  the payloads added, and fails on any verdict, location, or undecided check
  the file doesn't record. A lock may pin scripts of the specification
  repository under `scripts`, by blob, which its snapshot keeps and a
  reachable clone confirms; the stack lock pins `scripts/check_examples.py`.
  The first set is IAB Australia's 23 line items, on the stack lock: 9 are
  rejected and 14 are clean.
rationale: >-
  No check is weaker: every gate whose code reaches the lock or the snapshot
  checks what it did, and the snapshot gate also checks each pinned script's
  blob, against the pin and, where a clone is reachable, at the commit. The
  desk-tests gate adds two engines' verdicts on 23 payloads that no other
  gate reads, and it runs on the gates' fixtures for a removed expected
  rejection, a clean payload that fails the schemas, a payload the checker no
  longer rejects, a clean payload it rejects, a rejection at another
  location, an unlisted payload, a removed undecided check, and a failed
  checker run. The test suite gains a test of the lock's scripts and their
  snapshot, and its minimum count rises to 548. The spec-profile gate knows
  `desk-tests` as a folder of the outputs stage, whose gates read it, so any
  other unknown folder still fails it. The guard changes with the CI
  script.
