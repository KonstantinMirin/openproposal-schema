format: 1
id: G-146
date: 2026-11-11
question: What changes in the gates when the with-our-stack lock moves to the stack's head at `63733ed`, and the fidelity oracle and the emitter read a row's "Absent unless" and "Absent when" sentences?
decision: >-
  The lock reads op30-packages at `63733ed`, where all 17 of our heads moved.
  Its text adds `retention` to `RequestedValue` (§ 4.1), a `Range[Duration]`
  named `RequestedRetentionRange` after its object, as `unit_bounds` is
  (D-058), and says that `action_type`'s core terms come from ECAPI 1.0's
  Standard Events and Additional Events tables both, as D-063 read them. The
  fidelity oracle gains the form `absent`: a sentence of a row's Meaning or
  Description, "Absent unless <condition>" or "Absent when <condition>", in
  the condition grammar a REQUIRED when cell reads, as § 2.6 has a key that
  must be absent under a condition say so there. The member present while
  the absence holds is invalid, and present while it doesn't is valid; for
  "Absent unless", the condition's member absent holds it too. A key table a
  label introduces places its rows at the type the label names for this form
  only. Any other absence that states a condition is listed as unread. The
  model keeps each such sentence with its property, and the emitter states
  "Absent unless" a sibling holds one of its values as a dependency of the
  member, `dependentSchemas: { calendar_zone: { properties: { rate_unit:
  { const: day } }, required: [rate_unit] } }`. The corpus builds a baseline
  and an isolating mutant for both of its keywords, the type examples set
  `rate_unit` to `day` where `calendar_zone` is present, and the SDKs check
  it: the TypeScript and Python runtimes gain the check only in a build whose
  types state one, and Go writes it in the type's validation. The plain
  generator drops the dependency (PG-23) and `RequestedRetentionRange`'s
  `minProperties` (PG-17).
rationale: >-
  No check is weaker: the oracle reads one more form, the emitter states one
  more constraint, and the gates' fixtures add two that drop the dependency
  or hold it to another unit, which the fidelity gate fails. On the stack the
  oracle reads 1 of the 8 "Absent unless" and "Absent when" sentences,
  `calendar_zone`'s; 7 name a condition in prose and stay unread, and 7
  absences in other forms, such as "Absent on every other entry", are listed
  unread too. Neither `main` nor the open PRs write an absence in a row, so
  their IR, models, schemas, rules, corpus, type examples, SDKs, comparison,
  and feedback are byte-identical. The fingerprints change because the
  model, the emitter, the corpus, the SDK emitters, and the oracle reach
  most gates.
