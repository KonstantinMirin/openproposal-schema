format: 1
id: G-082
date: 2026-10-27
question: What changes in the gates when the site becomes one site for every specification, each under its own path, with no downloads?
decision: >-
  The site gate builds one site for the specs specs/site.yaml lists, once
  after every spec's gates instead of inside OpenProposal's, with each
  spec's pages under its path and a root page that lists the specs. Its
  check runs on the whole site: a link into a spec's type map is read by
  that spec's own router, filled with its locks and variants, and checked
  against that spec's data; and a link into the public repository must name
  a tracked path under sdk/ or specs/, the folders the export publishes
  whole, since the site now links the repository in place of downloads.
  Every existing fixture keeps its check on OpenProposal's pages at their
  new paths, and five fixtures are new: a repository link outside those
  folders, a repository link to a path the tree doesn't hold, a root page
  link to a spec page the site lacks, a root page link into a spec's type
  map at a type its build lacks, and a spec's type map with no router. The
  spec profile's site settings lose the publisher, repository, deploy
  target, and archive name, which the site's settings now give, and gain
  each lock's label, phrase, and aliases; the extraction, fidelity, rule,
  example, type-example, comparison, feedback, round-trip, and profile
  gates reach the profile's types, so their fingerprints change with no
  change to what they check. The test suite holds 433 tests, and MIN_TESTS
  is 433.
rationale: >-
  No check is removed or relaxed: each one now covers every spec's pages,
  and the repository links add one. OpenProposal's committed outputs don't
  change, and its pages on the site keep their bytes apart from the
  intended changes: the files page replaces the downloads and their
  archives, the navigation and footer name it Files, the landing page's
  button and How it's built name the files instead of the downloads, the
  type map wraps a long word instead of widening the page, and its note on
  an open vocabulary names the vendor codes a list reserves.
