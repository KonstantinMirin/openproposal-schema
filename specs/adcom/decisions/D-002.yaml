options:
  - id: singular-pascal
    summary: >-
      The words of the list's title after "List:", joined, each capitalized
      and the rest of it in lowercase, so an acronym reads as a word, with
      the head noun, the last word before a " - " qualifier or else the last
      word, in the singular: API Frameworks gives Api and Framework joined,
      Plcmt Subtypes - Video gives Plcmt, Subtype, and Video, and Slot
      Position in Pod keeps In before Pod.
  - id: anchor
    summary: >-
      The list's anchor, such as `list_apiframeworks`, which links already
      use.
  - id: plural-pascal
    summary: >-
      The title in PascalCase as written, plural, such as `ApiFrameworks`.
chosen: singular-pascal
rationale: >-
  A vocabulary names the type of one value, so its name is singular, as the
  type rules name every type; a list's title names the whole list, so it is
  plural. The anchors can't serve: one misspells its title
  (`list_doohmultipliermeasurementmourcetypes`), one lacks the prefix
  (`user-agent_source`), one is singular where its title is plural
  (`list_idmatchmethod`), and one shortens it (`list_poddedupe`). Writing an
  acronym as a word, `Api` and `Dooh`, keeps the word boundaries of a name
  such as `DoohVenueTaxonomy` readable. The rule that derives the names
  applies this reading to every list, so each name follows from its title
  alone.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L3523"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L3744"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L4490"
feedback: >-
  Give each list a short machine name beside its title, and use it in the
  list's anchor, so every implementation and every tool names a list the
  same way. Today the anchors are the only stable names, and four of them
  don't follow the pattern the others do:
  `list_doohmultipliermeasurementmourcetypes` misspells "source",
  `user-agent_source` has no `list_` prefix, `list_idmatchmethod` is
  singular, and `list_poddedupe` shortens its title.
