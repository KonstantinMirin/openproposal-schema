options:
  - id: informative
    summary: >-
      Informative: each says what a code means, which the code's label
      carries, or how a list is used, which no value of the list can show.
  - id: obligations
    summary: >-
      An obligation on the party that sends or renders a code, such as the
      player that plays an instream placement with its sound on.
  - id: rules
    summary: >-
      A rule per statement, checked on payloads.
chosen: informative
rationale: >-
  A value of a list is one code, and none of these statements constrains
  which code a sender writes. Most say what a code means, such as how an
  instream placement plays its sound, and that sentence is part of the
  code's label, which the vocabulary's description keeps. The rest say how a
  list is used, such as which attribute carries it, or describe the list
  itself, as "required by an ad" does in its ordinary sense. None of them
  can be checked on a code alone, so none becomes a rule. Several bind a
  party, as "Instream video must be set to sound on" binds the player, and
  several constrain an object's attribute, as the native assets' recommended
  lengths do; each such obligation or rule belongs to the attribute that
  carries the code, which the objects phase maps, and that phase revisits
  these statements. In a registry of codes, they are what the codes mean.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L4204"
feedback: >-
  Keep each code's definition to what the code means, and move a requirement
  on the party that sends or renders it, such as "Instream video must be set
  to sound on by default", to the attribute that carries the code, where an
  implementation can check it.
