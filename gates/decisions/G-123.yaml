format: 1
id: G-123
date: 2026-10-28
question: What changes in the gates when the review of the Deals API's mapping narrows the lock-name pattern, the labeled-list rule, and the vendor and held-object checks, and gives the kernel a UTC timestamp?
decision: >-
  Only a lock name may hold a dot. G-122 widened the token pattern of every
  format it touched, so a module, a rule, a decision option, a concept, a
  variant, and a vectors module took a dot too; each keeps the hyphen-only
  token again, and the lock lists keep the dotted pattern, the vectors
  format through a `lockName` it adds. G-122's claim that each widened
  pattern admits a lock name or a part's form held for the lock lists only.
  Mapping rule `restated-value-list` reads a labeled list as a primitive's
  titled codes only where its labels are the titles, in any case, as `0`
  (no) | `1` (yes) are `IntegerFlag`'s, or where the kernel binding cites
  the list's row for the primitive's concept, as the Deals API's `guar`;
  the codes alone say nothing, so a list `0` = undisclosed, `1` = single
  publisher is no flag, and a list that labels any of its codes is read by
  its labels. G-122 said OpenProposal and AdCOM hold no labeled
  lists; OpenProposal's with-open-prs text holds four, its three flags,
  which the labels and the binding both match, and `linked_execution`'s,
  of strings. A specification's own vendor range is checked the same way
  from a type entry as from a declaration: it starts where `VendorCode`
  does, it is the vocabulary's only extension, and it makes the vocabulary
  open. An attribute holds another object's rows only where it is an
  object or a list of objects, never a union with another type. The kernel
  gains `UtcTimestamp`, the time domain's concept `utc-instant`, an RFC 3339
  date-time whose offset is zero, for a specification that says its
  timestamps are UTC, as the Deals API's `created`, `startdate`, and
  `enddate`; OpenProposal and AdCOM bind it as absent. The reference
  oracle rejects its leap second as it rejects `Timestamp`'s, so gap OG-1
  lists both. Two gate fixtures'
  expected messages are what the rules check reports, and one fixture
  covers the labeled flag. The type rules say a property may carry the
  default its row states beside its `$ref`. The test suite holds 524 tests,
  and MIN_TESTS is 524.
rationale: >-
  Each check is stricter or, for the patterns, back to what it was before
  G-122; none is relaxed. The resolved models of OpenProposal and AdCOM on
  every lock are byte-identical, and so are their committed outputs; the
  new type leaves both specs' kernels, as their bindings say.
