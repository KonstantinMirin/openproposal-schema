    quote: "{ id, name, taxonomy_ref, provenance, addressable_scale }"
  - ir: field:5.6:cancellation_policy
    digest: 6c8bbcd373f89f5fdf8c0e6a3e9f43bc0e26cc1b5ba35a4f13c2dd246f37dba4
    quote: "`cancellation_policy` | Object | selectable | `available[]` of cancellation rights with `pricing` per option"
  - ir: field:5.6:exclusivity
    digest: 5012d5c8189fd4016ce87f254fff0fa14c929365d9efc3f2256ccfcf80b73c46
    quote: "`exclusivity` | Object | selectable | `available[]` of exclusivity terms with `pricing`"
options:
  - id: required-id
    summary: >-
      An object option is named by its `id`. Every object option carries one,
      required: the identity the seller mints for it.
  - id: own-member
    summary: Each option is named by a member of its own that sets it apart, such as a measurement source's `vendor` or a report's `feed_type`.
  - id: optional-id
    summary: An object option may carry `id`, and one without it can't be named in `included[]` or `pricing`.
chosen: required-id
rationale: >-
  § 3.1 keys `pricing` by `option_id`, and `included[]` lists which options
  are in the base rate, so every option that can be included or priced needs
  a name. A string option is its own name. The text doesn't say what names an
  object option, and the property and audience options write `id` with no
  presence. A member of an option's own, such as `vendor` or `feed_type`,
  isn't unique: a seller can offer one vendor with two attribution windows,
  or one feed type at two cadences. An optional `id` leaves an option that
  `included[]` and `pricing` can't name. So an object option is named by its
  `id`, which it carries, required: the constructor gives it, as a rule of
  the selectable template, to each object type that is an option, and the
  mapping keeps the members the text writes. The property and audience
  options keep the `id` they write and make it required, and the
  cancellation and exclusivity options, whose members the text doesn't
  state, carry it too. An option given as a `catalog_ref` has no `id`
  (D-007). The `id` is a UUID, as every ID a party mints is (D-037). Giving
  an `id` to the production, measurement source, and reporting options, whose
  members the text lists without one, changes what the text settles, so that
  part is a change we propose (D-047).
evidence:
  - examples/line-item-display.yaml (properties and audiences)
feedback: >-
  Say that `included[]` and the `pricing` keys name an object option by its
  `id`. Mark the `id` of a property and an audience option REQUIRED. Give the
  cancellation and exclusivity options an `id` once their members are defined.
