format: 1
id: G-153
date: 2026-11-12
question: How do the oracle, the emitter, the corpus, and the SDKs read a key "Absent on a core term other than `X`", as the stack's `cost_parameters.action_definition` is on a core cost method other than `CPA`?
decision: >-
  The grammar reads one more absence sentence, "Absent on a core term other
  than `X`" or "Absent on any core term other than `X`", and nothing wider.
  The term is the member beside the object that holds the key whose
  vocabulary's core terms hold `X`: on the stack, `cost_method` beside a
  pricing entry's `cost_parameters`. The key is absent while that member is
  any other core term, and `X` or an extension term may carry it. The
  fidelity oracle reads the core terms from the IR, the paragraph that
  declares "`cost_method` is a `VocabularyTerm`" and lists them, and places
  the key at each field row typed by its label's object, here
  `pricing[].cost_parameters`, with the condition one object up; the
  absences it lists unread in another form fall from 8 to 7. The emitter
  states it on the holder, from the model's vocabulary, as
  `dependentSchemas: { cost_parameters: { if: { properties: { cost_method:
  { enum: [the nine other core terms] } }, required: [cost_method] }, then:
  { properties: { cost_parameters: { type: object, properties: {
  action_definition: false } } } } } }`, so the key fails at its own
  location, `/pricing/k/cost_parameters/action_definition`, as the stack's
  checker reports it; the `type` restates the member's for strict
  validators, and the corpus lists it as implied. The corpus reads a
  member's `false` schema as a constraint, with an isolating mutant that
  names the key on a `CPM` entry, and each SDK checks it through a new
  `absentOn` shape check, at the key. The type examples leave the key out
  of a pricing entry whose `cost_method` the text gives as another core
  term. The plain generator drops the dependency, PG-24.
rationale: >-
  No check is weaker: the schemas state one more constraint, the oracle
  reads one more absence with 11 vectors (9 core terms with the key
  invalid, `CPA` and an extension term valid), the corpus gains its mutant
  and the sdk-locations gate its plain and paired cases, and three new
  fidelity fixtures drop the dependency, add `CPA` to its terms, or keep an
  extension term from carrying the key, each of which fails. A test reads
  the constraint from the stack's IR, and the suite's minimum count rises
  to 553. The `main` and `with-open-prs` outputs
  and models are byte-identical: no row of theirs states the form, and the
  runtime check sits in the absence helpers a runtime holds only where a
  type states an absence. The generated code that changes is the two stack
  trees': `PricingEntry` in TypeScript, Python, and Go, the TypeScript and
  Python runtimes' `absentOn` check, and the schema release digest the
  provenance constants carry. The fingerprints change because the grammar,
  the emitter, the corpus, the type examples, and the SDK builder reach
  most gates.
