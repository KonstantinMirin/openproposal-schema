format: 1
id: G-137
date: 2026-10-28
question: What changes in the gates when AdCOM's proto package becomes com.postindustria.ads.adcom.v1 and the review of G-136 is answered?
decision: >-
  The owner's package for every spec is `com.postindustria.ads.<spec>.v1`,
  so AdCOM's is com.postindustria.ads.adcom.v1, and its file moves to
  proto/com/postindustria/ads/adcom/v1/lists.proto. The spec-profile gate
  fails a proto package whose segment before the version isn't the spec's
  folder name without its hyphens (fixture); nothing in it names a
  publisher or a standard. Every finding of the review of G-136 is fixed. A
  spec that imports a registry's list takes each code's name from the
  registry's schema, so OpenProposal's and the Deals API's types name
  AdCOM's codes as AdCOM's schema and proto do, and the registry agreement
  fails a code named otherwise (fixture). D-020 names only Playback Methods
  1, 2, 5, and 6, as the owner listed them, in the form code 3 has, and its
  rationale says what it restates. The title rule splits at a colon with no
  space only before a capital, never inside parentheses, so "urn:iab:x" and
  "mailto:x" name nothing; a gloss marker is lowercase, an aside's nested
  parentheses go with it, and a tail is cut only outside parentheses
  (tests). A name a record gives applies only on the locks its cover is on
  (test); two records that name one code fail model-resolves, and a decided
  name another code's name shares fails schemas-emit (fixtures). A decided
  name may run to 48 characters, the code name rule's limit. Each decision
  page lists the names its record gives. The target rules say where
  adcom-proto's field numbers will be read from, and that protojson writes
  enum numbers with MarshalOptions' UseEnumNumbers and reads either form.
rationale: >-
  Every changed check is stricter, or a fixture shows it fails. Only titles
  and names change: 28 published titles differ from before G-136, 25 in
  AdCOM and 3 in the Deals API, and 25 proto value names; every code,
  verdict, and number is unchanged, the corpus, type examples, rules, and
  vectors don't change, the release differ finds annotation changes alone
  in every model and no reported change in any schema file, and the
  registry agreement passes on every lock.
