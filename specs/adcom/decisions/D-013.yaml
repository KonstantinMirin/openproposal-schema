options:
  - id: defer
    summary: >-
      Until AdCOM's objects are mapped, the schemas say nothing about these
      attributes; when they are, they follow the text: integer flags, an
      array where the text writes "array", and `link` an object.
  - id: proto
    summary: >-
      Follow the protocol buffer definitions' types.
chosen: defer
rationale: >-
  The text is normative, and it changed `playmethod` from one integer to an
  integer array within 1.0, which neither the protocol buffer definitions
  nor the Prebid Go types followed. A payload the text allows, such as
  `"playmethod": [1, 2]`, fails a reader built from those definitions. The
  objects phase types each attribute as the text writes it, and this record
  keeps the rows quoted until then.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L1404"
  - "https://github.com/IABTechLab/adcom-proto/blob/921f85e685fed869344437378f4dea2be19b7b49/proto/com/iabtechlab/adcom/v1/placement/placement.proto#L387"
  - "https://github.com/prebid/openrtb/blob/0d01af1cd27503d7edd0584fadb7e740ab83cc9c/adcom1/video_placement.go#L67"
feedback: >-
  Regenerate the protocol buffer definitions from the specification, or mark
  them as not normative and say which differences are deliberate. Today 24
  integer flags are booleans there, 8 attributes differ between an array and
  a single value, `playmethod` among them, and `Banner.link` is a string
  where AdCOM writes an object.
