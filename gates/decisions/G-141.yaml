format: 1
id: G-141
date: 2026-11-09
question: How do the schema files layer, so that no reference runs sideways within the kernel, between modules, or between documents?
decision: >-
  Three tiers, and the layer gate fails a sideways reference (type rules § 3,
  src/placement.ts). The model places each type it emits (`home`): a
  document, a profile, an object a profile projects, an object that includes
  a profile or holds a document, and a type that holds another module's
  object, union, or copy compose, and so does every type that references one
  of them; they go to `documents/1/composition.json`, once each. A copy goes
  with the types it is built from, or with the one module that uses it, or
  the kernel when several do. A module's scalar that another module or the
  kernel uses moves to the kernel. Each document's or profile's file is a
  root, a `$ref` to its definition in the composition and nothing else, so no
  document references another and the line item a proposal and a package
  hold is defined once. The convention-layers gate adds, beside its layer and
  cycle checks: inside the kernel, a primitive references at most a
  primitive that stands alone and a composite only primitives; a module
  references only the kernel and itself; nothing below the top tier
  references the composition; and every emitted type has a home. The output
  gate fails a root file that references anything but its document's
  definition. A type's `module` stays the module that owns its section, so the
  module gates and the SDK packages are as they were. The fidelity fixtures
  and the tests read a document's definition through its root.
rationale: >-
  The new checks only add failures, each with a fixture: a module's object
  that references another module's object, a kernel part that references
  another part, a kernel primitive that references a part, a module's object
  that references the composition, a type with no home, and a document root
  that references another document. Measured on with-our-stack, the kernel's
  42 internal references fall to 28, all from a composite to a primitive, and
  module-to-module references fall from 13 edges to none, and
  document-to-document from 9 edges to none; main and the open PRs lose their
  module-to-module edges too. Every example and vector keeps its verdict.
