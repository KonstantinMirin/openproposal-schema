format: 1
id: G-119
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of D-039's withdrawal found?
decision: >-
  An example finding, an undecided check, and a round-trip difference
  accepted any decision record that exists as their excuse, so a withdrawn
  or superseded one still excused them; each now fails on a record that no
  longer stands, as a mapping entry does. The kernel-load gate fails a kernel
  file whose titled codes carry a range, the output check fails a
  primitive's titled codes with a range beside them or one title twice, and
  the conventions fail a primitive's oneOf that isn't titled codes, with
  four fixtures; tests hold `isTitledCodes` to its eight ways of failing,
  the SDK model to an enum of IntegerFlag's codes and to an error for any
  other oneOf, and a withdrawn record to naming no record that replaces it.
  The variant test that checked a conversion the vectors no longer need now
  checks D-041's. `IntegerFlag` also cites AdCOM 1.0's DisplayPlacement at
  its pinned commit, where it writes `instl` "where 0 = no, 1 = yes". The
  README no longer says D-039 holds, and counts the domain file's 11 domains,
  25 concepts, and 2 shared structures; type rules § 8 lists a primitive's
  titled codes among the forms `oneOf` takes. The SDKs' constant names for
  titled codes wait for the SDK emitter, filed as follow-up work. The test
  suite holds 516 tests, and MIN_TESTS is 516.
rationale: >-
  Three checks are stricter and four fixtures are new; nothing is relaxed.
  No output changes but the kernel's IntegerFlag source list, which no
  schema carries.
