format: 1
id: G-140
date: 2026-11-09
question: Should the schema define a named type that only restates a JSON type, such as `PlainString`, `ExternalId`, `Text`, or an open object with no member?
decision: >-
  No. A type the specification doesn't name whose schema is its `type` alone,
  a primitive of `type` alone or an open object with no member, is written
  inline at each use, `{ "type": "string" }`, `{ "type": "number" }`, or
  `{ "type": "object" }`, with the use's own description (type rules § 4,
  src/placement.ts). The model marks it `inline` and keeps it, so the
  domain-model, mapping, and naming gates still type every row by its
  concept's type, and the SDKs, which the model generates, keep its name: the
  SDK-names gate takes the schema's definitions and its inline types, and fails
  on a type defined twice or both defined and inlined. A map keyed by such a
  string names no `propertyNames`. A primitive with a constraint keeps one
  definition: the stack's `PlainInteger`, bounded to the integers every JSON
  implementation reads exactly (RFC 7493, D-052), is renamed `SafeInteger`,
  and its narrowing `SafeIntegerNarrowing`. A type the specification names
  keeps its definition, as the stack's § 2.2 `Amount` does. The rule checks'
  context, the examples walker, and the example builders read an inline type
  from the model, or from the node the emitter writes for it, so every rule
  vector, example verdict, corpus baseline, and type example value is what it
  was. The plain-generator exemption PG-22 trades the commit result's
  `availability`, which no longer names its keys, for the `ext` maps' corpus
  cases, which the generator keys by `Domain`.
rationale: >-
  No gate is weaker. The model and its gates are unchanged for these types;
  only where the schema writes them moves, and a JSON type at each use states
  exactly what a reference to the restating type stated. Every example and
  vector of every build gets the verdict it had: a harness that validates the
  committed corpus, rule vectors, type examples, primitive vectors, the
  specification's examples, and the IAB Australia desk-test line items
  against every build before and after finds no difference. Dropping
  SafeInteger's bound would change what the stack accepts, so it stays a
  constraint, and a definition.
