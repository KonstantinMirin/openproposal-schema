format: 1
id: D-025
status: proposed
kind: gap
author: agent
question: "Which payloads does the Deals API define, when it states no paths, request body, responses, or authorization?"
covers:
  - ir: field:object-deal:id
    digest: aaddfa0cb70710aabb5451db0b5e92e7742131f02f5f813adb9ec840edf64da9
    quote: "`id` | string; required | A unique identifier for the direct deal in origin's namespace."
  - ir: field:object-buyerseat:version
    digest: 5d8347a4aab6be0ffe130b75daacb6b2f8256fb276f5650f58178098ce88baec
    quote: "`version` | string, required | Version of the Deal API in use"
options:
  - id: two-documents
    summary: >-
      Two: the deal the origin system pushes, and the buyer seat's status
      the receiving system returns; the request that asks for a status, its
      paths, and its authorization are left out.
  - id: openapi
    summary: >-
      An HTTP description of both endpoints, with paths and authorization,
      which the text would have to state.
chosen: two-documents
rationale: >-
  The text defines the objects of two exchanges, the deal the origin system
  pushes and the status the receiving system returns, and says nothing of
  the request for a status, the paths, the responses' codes, or
  authorization, so only the two payloads are defined.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L78"
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L152"
feedback: >-
  Specify the endpoints: the paths, the request that asks for a deal's
  status, the responses and their codes, and how each side authorizes the
  other.
