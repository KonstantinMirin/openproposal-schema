options:
  - id: profiles
    summary: "Profiles: each projects the paths its `text` block lists from the document, with the keys a table adds, and `BuyerWrites` reads `<selectable>` as each field marked `selectable` and `<settable>` as each marked `settable` but `frequency_cap`, every path optional."
  - id: objects
    summary: "Objects of their own, with keys restated."
chosen: profiles
rationale: >-
  § 2.6 says a lead-in that reads "`X` lists these paths" is followed by a
  `text` block with one path per line, and a table that "adds this key" gives
  `X` those keys beside the listed paths. § 2.1 says a summary is a strict
  path subset of the full object, and § 3.4 that `BuyerWrites` is a strict
  path subset of the line item with every path optional. A profile projects
  exactly those paths.
feedback: >-
