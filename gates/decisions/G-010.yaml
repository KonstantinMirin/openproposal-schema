format: 1
id: G-010
date: 2026-10-26
question: How does a kernel part cite more than one decision, as the daypart window does on `main`?
decision: >-
  A part lists its decisions under `decisions`, one for each member or
  constraint its sources don't state, and `decision_locks` scopes them all;
  the model carries each one on the locks it applies on. The daypart window
  cites D-004 for its shape and for its `start` that is never `24:00`, and
  D-038 for the clock that reads it, both on `main` only. A test checks
  that a part's decisions exist and that the old single `decision` key no
  longer loads. The test suite holds 309 tests, so its floor rises to 309.
rationale: >-
  The window's `start` constraint comes from D-004, which chose `HH:MM`
  ends where only `end` can be `24:00`, and the part cited only D-038, the
  clock. Every gate that reads a part's decisions reads each one, a missing
  one still fails the constructors check, and the test floor rises, so no
  gate is weaker. The other gates' fingerprints change because they reach
  the model's resolver, whose lock-scoped decisions now read a list.
