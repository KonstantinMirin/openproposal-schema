# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: deal
sections: [ deal-api-specification, object-deal, object-terms, object-inventory, object-curation ]
types:
  - name: Deal
    kind: document
    ir: field:object-deal:id
    source: { rule: document-owner }
  - name: Terms
    kind: object
    ir: field:object-terms:startdate
    source: { rule: held-object }
    open: false
  - name: Inventory
    kind: object
    ir: field:object-inventory:inclinventory
    source: { rule: held-object }
    open: false
  - name: DeviceType
    kind: vocabulary
    ir: field:object-inventory:devicetype
    source: { decision: D-027 }
    open: false
    terms: [ "1", "2", "3", "4", "5", "6", "7", "8" ]
    list: { name: "List: Device Types" }
  - name: CategoryTaxonomy
    kind: vocabulary
    ir: field:object-inventory:cattax
    source: { decision: D-027 }
    open: true
    terms: [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
    list: { name: "List: Category Taxonomies" }
  - name: Curation
    kind: object
    ir: field:object-curation:curator
    source: { rule: held-object }
    open: false
