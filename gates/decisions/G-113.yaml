format: 1
id: G-113
date: 2026-10-28
question: What changes in the gates when a third spec, the Deals API, joins with only its locks?
decision: >-
  specs/dealsapi/ holds the Deals API's profile, which says the spec has
  reached its input stage, and its two required locks: `main` at 3028ddc,
  the default, and the tag 1.0-202602 at 938a5d1, each with a snapshot of
  deal1.0.md whose blob the lock pins. CI runs the input gates on both
  locks with no clone, and the stage gate holds the folder to no file of a
  later stage. The plugin registry gains the Deals API's plugin, which
  holds no table layout yet and reads keywords in any case, so every gate
  that reaches the registry is fingerprinted anew; none of their checks
  changes. A test pins both locks' commits, blobs, and tag, and the two
  lines the snapshots differ in. The test suite holds 498 tests, and
  MIN_TESTS is 498.
rationale: >-
  No check is added or relaxed: the gates reach one more plugin through the
  registry, and AdCOM's and OpenProposal's outputs don't change.
