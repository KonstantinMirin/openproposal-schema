format: 1
id: G-097
date: 2026-10-28
question: What changes in the gates when AdCOM's drift report is renamed enum drift, so its name no longer collides with gate 8's check that generated files are current?
decision: >-
  The report that compares the registry's lists with other artifacts'
  enums is now the enum drift report. Its folder is enum-drift/ (the
  root's format schema enum-drift/sources.schema.json, and AdCOM's
  specs/adcom/enum-drift/ with enum-drift.json and enum-drift.md), its
  command is `npm run enum-drift`, its code is src/enum-drift.ts, and its
  gates are gates/enum-drift.ts. The four gates drift-sources,
  drift-deterministic, drift-committed, and drift-tracked are retired and
  return as enum-drift-sources, enum-drift-deterministic,
  enum-drift-committed, and enum-drift-tracked, with the same checks and
  fixtures on the new paths. enum-drift replaces drift in the outputs
  stage's folders (spec-profile), the folders no file may be untracked in
  (untracked), and the root's format folders (layout-tracked). The site
  gate changes with AdCOM's landing page, which names the report and links
  it at its new path. The guard changes with scripts/ci.ts. The test suite
  is unchanged at 472 tests; npm-test changes with the moved test file,
  and the guard's test now drops each gate a record retires from the gates
  it expects to run, as the guard does, since this is the first record that
  retires a gate.
retires_gates:
  - { gate: drift-sources, reason: "Renamed enum-drift-sources, with the same checks and fixtures on the report's new folder." }
  - { gate: drift-deterministic, reason: "Renamed enum-drift-deterministic, with the same check on the report's new command." }
  - { gate: drift-committed, reason: "Renamed enum-drift-committed, with the same check on the report's new folder." }
  - { gate: drift-tracked, reason: "Renamed enum-drift-tracked, with the same check on the report's new folder." }
rationale: >-
  A rename: every check and fixture of the four gates carries over to its
  new ID unchanged, apart from the paths and names it reads, so nothing is
  relaxed. The report's content is unchanged apart from its own name and
  command in its heading and first line; its numbers are the same.
  OpenProposal's outputs don't change.
