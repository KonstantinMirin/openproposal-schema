format: 1
id: G-116
date: 2026-10-28
question: What changes in the gates when the extractor reads the Deals API's text, its IR is committed, and the lint gains a kind?
decision: >-
  The extractor reads an anchor on a line of its own, `<a name="…"></a>`,
  which CommonMark parses as a paragraph of two inline tags, as the name of
  the heading right after it, and fails one that a heading doesn't follow,
  one that ends the text, and a heading named both ways. A field row may
  carry no mutability marker, for a text whose rows have none, and may keep
  its whole Type cell and the default it states beside the base type; the
  IR schema's field owner is any snake-case name, and a profile's document
  may name its section by an anchor. The Deals API's plugin reads its
  `Attribute | Type | Description` tables as field rows owned by the object
  their `Object:` heading names, its Type cells by the grammar of plan §
  4.2, its `` `n` = label `` lines and its "where n = label, n = label"
  prose as value lists, its keywords in any case with "strongly encouraged"
  as RECOMMENDED, and its Example Scenarios table as rows of values. A code
  span such as `inclinventory.adtype=1,2` is an expression with values
  joined by commas. The lint gains `value_list_duplicate_code`, a list that
  gives one value twice, and no longer reports an object field as without
  structure where it names another owner's rows, as `terms` names `Object:
  Terms`; neither occurs in AdCOM's or OpenProposal's text, so their IR and
  findings are unchanged, and OpenProposal's extraction report gains the new
  kind's row of zeros. The Deals API has its own extraction report,
  docs/dealsapi-extraction-report.md, generated from both locks' committed
  IR and kept current by a test. Three extraction fixtures run on the Deals
  API's text: an anchor that names no heading, a Type cell with an unknown
  qualifier, and an attribute table outside an Object: section. The test
  suite holds 506 tests, and MIN_TESTS is 506.
rationale: >-
  The extractor accepts a form it used to reject only where the form is
  read whole, and fails every variant of it a text could misread; the lint
  gains a kind and narrows one check to the objects a text describes. No
  check is relaxed for an existing spec, and their outputs don't change.
