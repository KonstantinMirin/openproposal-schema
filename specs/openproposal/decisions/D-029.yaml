options:
  - id: by-subject
    summary: >-
      A statement about one payload, or about two versions and the acting party,
      is a rule. A statement about what a party does, which no payload shows, is
      an obligation. A statement the schema already says maps to the schema.
  - id: all-obligations
    summary: Every statement outside the tables is an obligation.
chosen: by-subject
rationale: >-
  "Each line item MUST be fully self-contained" is what the line-item schema
  states: it is a document of its own and references no proposal. Replacing
  every `catalog_ref` at `agreed` is a rule on an agreed line item, which
  carries no `catalog_ref`. A seller's right to revise a seller-set field
  while the status is `draft` or `published`, and a buyer's right to ask for a
  value outside the declared space, compare two versions and the acting party,
  so they are rules of the `Marker` vocabulary. The rest are obligations, each
  on the party it names: a consumer doesn't inherit a value from the proposal;
  a buyer may commit a subset of the line items; and a seller keeps catalog
  entries immutable, resolves references during discovery, returns a summary
  and a full representation as § 2.1 says, gives in a summary the placement
  keys that the line item declares, which a summary alone doesn't show, publishes a current manifest with
  `ETag` and `Last-Modified`, declares everything a field needs to resolve,
  makes a field's default explicit, and recomputes `addressable_scale` and
  `availability`.
feedback: >-
  Mark the behavioral requirements of § 2 and § 3 as obligations on a named
  party. Keep them apart from what a schema or a rule can check.
