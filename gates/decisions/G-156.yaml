format: 1
id: G-156
date: 2026-11-13
question: How do IAB Australia's 30 billable-day and calendar_zone line items join CI, with an unlisted zone name rejected by every engine and the TIME arithmetic only the checker computes recorded as such?
decision: >-
  The second desk-test set, `iab-au-2026-11-calendar`, holds Jonas
  Jaanimagi's 30 line items, gist `945498af` at revision `18af0615`, with
  their verdicts on the stack lock. Three are rejected by every engine at
  one location: `d09` and `d10` at the `rate_unit` a `calendar_zone`'s
  condition reads, and `d11` at its `calendar_zone`, `Sydney/Australia`.
  For `d11`, a primitive may take a pinned list's codes as its values,
  `listed:`, which the kernel writes into its `enum`; `IanaZone` takes the
  zone and link names of tzdata 2026e that the kernel already pins with
  its SHA-256 for `ZoneName`'s rule (D-064), so the schemas, the reference
  validator, and the three SDKs reject a name it doesn't list, and no
  constants are generated for the names. Five files are rejected by the
  checker alone, at the line item: `a3`, `a4`, `b3`, `d06`, and `d08`,
  whose `TIME` units § 5.6.5 states in sentences with no RFC 2119
  keyword, so no rule carries them. The expected file gains
  `checker_only`, required, as `sdk_gaps` is, each entry with the IR
  elements its check reads and the reason: the checker must reject the
  payload there, the schemas, the rules, and the SDKs must accept it, an
  element must be one of the lock's IR, and an entry beside a finding at
  the same place fails. The other 22 pass every engine, `d13` and `d14`
  among them. The TypeScript runtime's object checks now run whatever a
  member's own check found, as Zod skips a plain check once a member's
  issue aborts, as an `enum` member's does: without it, a `calendar_zone`
  outside the list hid the `rate_unit` failure beside it.
rationale: >-
  No check is weaker: the gate gains a set of 30 payloads in five engines
  and the checker-only record with checks of its own, and five fixtures: a
  checker-only finding not recorded, one the checker no longer makes, an
  SDK that makes one, one that reads no element of the IR, and one beside
  a schemas finding. `IanaZone` rejects more: every name tzdata 2026e
  doesn't list, which the stack's checker rejects too, and its vectors
  gain `Sydney/Australia`, `America/Springfield`, and `UTC+11` as invalid
  and `Australia/Sydney` and the link `Australia/NSW` as valid. The test
  that holds every SDK to a dependency's failure beside a member's own
  failed on the TypeScript runtime until its object checks ran always. The
  `main` and `with-open-prs` outputs are byte-identical but for the
  TypeScript runtime, `runtime.ts`, in their four trees, whose object
  checks now run as Zod checks that always run on an object; their schemas,
  models, and every other SDK file are unchanged.
