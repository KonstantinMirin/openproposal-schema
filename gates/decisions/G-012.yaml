format: 1
id: G-012
date: 2026-10-26
question: How do the mapping and the round trip read the daypart row of PR #123 at 9783ec8, which lists the window's days as one value list?
decision: >-
  Mapping rule `restated-value-list` also maps a value list whose values,
  in order, are a kernel primitive's `enum` to what that primitive's schema
  expresses, so the daypart row's `monday` | … | `sunday` is
  `{ role: schema, in: DayName }`, with no decision. The round trip renders
  a value list that gives a member of a part the row's type holds from the
  primitive that member's items are, so the row's days are rendered from
  `DayName`. A test checks the entry and the rendering, and that a
  `DayName` without `sunday` renders differently. The test suite holds 311
  tests, so its floor rises to 311.
rationale: >-
  The amendment states the day list in the row, where it was a range
  before, and the list is exactly `DayName`'s, so a rule maps it, and the
  round trip compares the model's days with the text's instead of leaving
  the list unrendered. A list that matches no primitive or vocabulary, or
  two, still needs a decision, and a `DayName` that drifts from the text
  fails the round trip, so no gate is weaker.
accepts:
  - { gate: comparison, fingerprint: 26b29f3097f3eab432bc0c860c2b7538b9c793e9bef5a686e7922caee29edda6 }
