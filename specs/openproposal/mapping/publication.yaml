# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: publication
sections: [ "2.3" ]
depends: [ proposal ]
lock_depends: { with-our-stack: [ representation ] }
types:
  - name: ProposalsEntry
    kind: object
    ir: block:2.3:2/object:1
    locks: [ with-open-prs ]
    source: { decision: D-028 }
    open: true
    includes: ProposalSummary
    members:
      version:
        type: { kind: named, name: Count }
        presence: optional
        description: "The proposal's revision number, its current `version`, which the entry MUST match."
      full_url: { type: { kind: named, name: Url }, presence: optional }
    description: "One proposal the manifest publishes: its Summary Representation, its `version`, and the `full_url` of its full record. The specification doesn't name the key that holds its line items' summaries, so the entry accepts members it doesn't name."
  - name: ProposalManifest
    kind: document
    ir: key:2.3:ProposalManifest.generated_at
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
  - name: ManifestEntry
    kind: object
    ir: key:2.3:ManifestEntry.full_url
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
    includes: ProposalSummary
  - name: HoldLimits
    kind: object
    ir: key:2.3:HoldLimits.per_buyer
    locks: [ with-our-stack ]
    source: { rule: key-table-object }
    open: false
