# Optional extractor input: upstream `main` plus the open PRs of the with-open-prs lock,
# plus our stack of 17 PRs, #137 to #152 and #154, at the stack's tip.
# The stack is op30-packages on github.com/KonstantinMirin/OpenProposal: each of our PRs
# is a branch merged up from the ones it builds on, the first starts from the open PRs'
# integration, and every head the with-open-prs lock merges is an ancestor of `commit`.
# `merge_order` lists those 14 heads, then our 17 in stack order.
# `base` is the upstream `main` the stack contains: since round 27, IAB's `main` at
# ebb9fb8 (#162, Contribution Terms) is merged into op30-shared-types and carried up, so
# every commit of `commit` that no head in `merge_order` holds is `main`'s at ebb9fb8 or
# the stack's own. The with-open-prs lock, built on 44dfaaf, keeps that base, and the
# `main` lock stays at 44dfaaf: #162 changes no line of spec/, examples/, or scripts/.
# The stack exists in a fork, so the lock carries a snapshot of the specification and
# examples/ at `commit`, and the scripts it pins, which `npm run fetch -- --lock
# specs/openproposal/spec-input/with-our-stack.lock.yaml --snapshot` writes from the clone;
# CI runs every gate from it.
