format: 1
id: G-087
date: 2026-10-27
question: What changes in the gates to close the gaps an independent review of AdCOM's extraction found?
decision: >-
  The extraction fails where it read something as words that it shouldn't:
  an HTML tag the Markdown parser left as text, markup an HTML table cell
  holds that the reader doesn't know, such as a comment, a character
  reference it doesn't know or that names no character, a tag inside a code
  span, a second code span opened inside one, and a closing bold tag with no
  opening one. An anchor whose href has no quotes, which GFM's autolink
  splits into text and a link, is put back together, so its text reads as
  GitHub shows it. Every AdCOM object table names its object, a heading of
  several words in PascalCase. AdCOM's lint reports every anchor that
  departs from the pattern, with how, and a list or object heading with no
  anchor. Tests cover each case; the suite holds 445 tests, and MIN_TESTS is
  445.
rationale: >-
  Each change makes the extraction stricter or its output truer to the
  text, and no check is relaxed. OpenProposal writes no HTML, so its IR and
  findings regenerate to their bytes.
