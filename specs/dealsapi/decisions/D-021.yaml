options:
  - id: closed-with-ext
    summary: >-
      Each object accepts only the members its table names, and `ext`, on
      every object, takes an object of any members, which the parties agree
      on.
  - id: open
    summary: >-
      Each object accepts any member, and a receiver ignores the members it
      doesn't know.
chosen: closed-with-ext
rationale: >-
  Every table lists its object's members and gives each object an `ext`
  "for deal-specific extensions", so the text names where a member it
  doesn't define goes. The text never says what a receiver does with a
  member outside the table, and no row forbids one, so whether an object
  is open or closed is a point it leaves open. That differs from a minimum
  the rows would rule out: an object with none of its optional members is
  one each row allows, so the schema keeps it valid. A member outside the
  table is one no row describes, and the text gives such members a place,
  `ext`, so closing the object sends them there. A closed object also lets
  the schema find a misspelled member, which an open one accepts as an
  extension.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L101"
feedback: >-
  Say whether a receiver must reject, or must ignore, a member that no table
  names, and whether a sender may put one anywhere but `ext`.
