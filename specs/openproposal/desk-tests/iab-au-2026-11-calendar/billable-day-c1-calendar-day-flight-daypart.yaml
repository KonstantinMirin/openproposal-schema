# Flight written as Mon and Tue whole Sydney days; delivery window as a daypart
line_item_id: "c1-calendar-day-flight-daypart"
status: published
channel: display
properties:
  available:
    - id: "sports-news-home"
      domains: ["sports-news.example"]
      child_audience: general
      seller_relationship: owner
  included: ["sports-news-home"]
environments:
  available: ["web_desktop", "web_mobile"]
  included: ["web_desktop", "web_mobile"]
formats:
  available: ["display/970x250"]
  included: ["display/970x250"]
format_specs:
  "display/970x250":
    spec: { w: 970, h: 250 }
creative_delivery: { method: buyer_hosted, other_protocols: [javascript_tag], secure_required: true }
daypart:
  allowed:
    - { days: [monday],  start: "18:00", before: "24:00" }
    - { days: [tuesday], start: "00:00", before: "06:00" }
  default:
    include:
      - { days: [monday],  start: "18:00", before: "24:00" }
      - { days: [tuesday], start: "00:00", before: "06:00" }
time_zone: "Australia/Sydney"
pricing:
  - pricing_id: "home-day-aud"
    cost_method: TIME
    cost_parameters: { rate_unit: day }
    list_rate: 1500.00
    agreed_rate: 1500.00
    currency: AUD
commitment:
  basis: spend
  amount: 3000.00
  flight:
    start: "2027-02-28T13:00:00Z"
    end: "2027-03-02T12:59:59Z"
  derived_units: 2
  advertisers:
    - domain: brand-a.example
visibility: named
eligible_buyers: ["agency-a.example"]
transaction_mechanism:
  available:
    - { id: direct_io, delivery_type: share_of_voice }
  included: ["direct_io"]
  max_select: 1
sov_basis: impressions
sov_share: 1
