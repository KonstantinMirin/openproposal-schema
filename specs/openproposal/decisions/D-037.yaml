options:
  - id: uuid
    summary: A UUID in the RFC 9562 string form, which JSON Schema's `uuid` format checks.
  - id: opaque-string
    summary: Any string the minting party chooses.
chosen: uuid
rationale: >-
  The specification types these IDs as strings and says only that each is an
  identity. A party mints each one, and other parties and systems carry it
  back, so two independently minted IDs must not collide, and every party must
  compare an ID the same way. A UUID needs no coordination to be unique, and
  JSON Schema's `uuid` format checks its string form, which RFC 9562 reads
  without regard to case. An ID that another system keeps, such as a DSP seat
  or a registry entry, stays as that system writes it, and so does
  `proposal_template_id`, which links a proposal to the seller's own template
  and which the text calls opaque to buyers. A reference to a minted record,
  such as a commitment's `proposal_id` or `requires.all_of[]`, carries the
  same identity, so it is a UUID too. With the open PRs, the text says an
  `idempotency_key` is opaque and that the seller MUST NOT interpret it. A
  UUID stays opaque: the schema checks only how it is written, and the seller
  still compares it for equality and reads nothing from it. The schema
  departs from the text, which lets the buyer write any string, and from the
  examples, which write readable names.
evidence:
  - https://www.rfc-editor.org/rfc/rfc9562
feedback: >-
  Write every ID a party mints as a UUID (RFC 9562), and every reference to one.
  That covers `proposal_id`, `line_item_id`, `asset_id`, `correlation_id`,
  `idempotency_key`, and the `id` of a property or an audience option. A UUID
  keeps `idempotency_key` opaque: a seller checks how it is written and compares
  it, and still reads nothing from it. The examples write readable names such as
  `business-daily-display`, which two sellers can mint alike.
