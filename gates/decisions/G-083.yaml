format: 1
id: G-083
date: 2026-10-27
question: What changes in the gates when a second spec, AdCOM, joins with only its locks, and when the gates of every spec run in one CI run?
decision: >-
  A spec's profile may say, in `through`, the last pipeline stage a spec
  still being added has reached: its input, its IR, or its model. CI runs
  the spec's gates through that stage and records one line that says the
  later stages don't run on it yet; a spec that has reached only its input
  is checked by its snapshot and spec-input gates. The spec-profile gate
  now runs on every spec at every stage, and fails a spec that holds a file
  of a stage after the one it names, so no file exists that its gates would
  skip; two fixtures cover it. A profile may leave out the SDK packages, for
  a spec with no SDK types, and the SDK emitters fail on such a spec's
  model instead of writing packages with no names. Each gate's inputs are
  kept per spec, so a fixture changes the input of the spec it was written
  for, OpenProposal's unless it names another, where the first spec in
  folder order is now AdCOM. The fixture type gains its spec, so every
  gate's fingerprint changes with no change to its check. The site gate's
  fixture for a spec's name in the site's code accepts any spec's name,
  since the first profile's name is now AdCOM's. AdCOM is locked at main
  26c59ba and at the tag AdCOM1.0-202607 (d67a6a8), both required, each
  with its snapshot. The test suite holds 434 tests, and MIN_TESTS is 434.
rationale: >-
  No check is removed or relaxed. A spec added in stages is checked as far
  as it goes, and the profile gate holds it to the files of those stages,
  so nothing it holds goes unchecked. Running OpenProposal's fixtures on
  OpenProposal's inputs keeps each fixture testing what it was written to
  test now that two specs feed the same gates. OpenProposal's outputs and
  pages don't change.
