format: 1
id: G-001
date: 2026-10-25
question: Which gates does CI run, with which known-bad fixtures and exemptions, and which concepts does the domain model hold, as the baseline the guard compares every later change with?
decision: >-
  Every gate moves into gates/, each with its check and at least one known-bad
  fixture, and the fidelity gate joins them. This record accepts each gate at
  its current fingerprint and the domain model's concepts as they stand.
rationale: >-
  An independent review found four defects that every gate passed: a twin
  type, missing currencies, a wrong units condition, and feedback that blamed
  the examples. The gates had never been shown to fail. Each gate now fails on
  fixtures that reproduce such defects, and the fidelity gate checks the
  schemas against what the specification states, not only that each
  statement was placed. From here, a change to a gate, its fixtures, or an
  exemption it reads needs a later record, so a gate can't be relaxed in the
  change that needs it relaxed to pass.
