options:
  - id: row-rules
    summary: "Each is a rule of the row's object, with vectors, and the check reads the condition as the text states it: on the value, on what the object's container holds, or, for a request, on what the receiver does. Where the text names a reading, the rule takes it: a deal mechanism is one the § 5.9 table marks Yes, a line item counts impressions where any of its counts is in impressions, as § 5.6.4 defines it: a `pricing[]` entry whose cost method's unit is impressions or viewable impressions (`CPM` or `CPMV`), and so a `commitment` under it, an `availability` whose `unit` is one of those, or a `committed_metrics[]` tuple whose `metric` is `impressions`, a term requires keys where its § 5.6.5 row names `cost_parameters`, a version is frozen once the proposal leaves `draft` or `assent[]` holds an entry, the committed entry is the one the line item's `commitment.pricing_id` names, or its only entry, and a line item with no `commitment` has none, and more than one seller audience can be in effect where there are two options and `max_select` allows two."
  - id: schema-only
    summary: "Leave them to prose."
chosen: row-rules
rationale: >-
  § 2.6 makes a Required cell `REQUIRED when <condition>`, and the stack
  writes many conditions a JSON Schema can't state: a sibling's absence, a
  value in another object, or a value only a party knows. Each row's cell is
  its own statement, so each is a rule of the row's object, and its vectors
  show the condition met and not met. The readings follow the text's own
  definitions: § 5.9 defines a deal mechanism as one that lands in a Deals API
  `Deal`, which its table marks; § 5.6.4 says a line item counts impressions
  when any of its counts, `pricing[]`, `commitment`, `availability`, or
  `committed_metrics[]`, is in impressions; § 5.6.5's table gives each cost
  method's unit and its `cost_parameters`; and § 4.1 says a version is frozen at the
  earliest of the proposal's `status` leaving `draft`, an entry naming it, or
  a counterparty receiving it, of which a payload shows the first two.
feedback: >-
  None needed.
