format: 1
id: G-145
date: 2026-11-11
question: What changes in the gates when the with-our-stack lock moves to the stack's head at `4f7ffff`, whose `action_type` takes its core terms from ECAPI 1.0?
decision: >-
  The lock reads op30-packages at `4f7ffff`. Its text adds `calendar_zone`
  to `cost_parameters`, an optional `IanaZone`; an optional `accreditation`
  term to `ImpressionMultiplier`, with the core terms `industry_currency`
  and `publisher_reported`, and its path to `LineItemSummary`'s list; three
  Deals API rows to § 1.1; and three `counted_by` statements in place of
  two, a CPP source, then a CPA source, otherwise the DOOH multiplier's,
  obligations of an implementation (D-057). § 5.6.5's `action_type` now
  takes as core terms ECAPI 1.0's `event_type` values other than `custom`
  (D-063). The kernel's lists gain ECAPI 1.0's `event_type` list, as ECAPI
  writes it at the commit the row's link pins, and a vocabulary that cites a
  list may leave out, under the list's `except`, a code an element it rests
  on names as left out; a `VocabularyTerm` row that takes a list of words as
  its core terms makes the vocabulary open, with namespaced extension terms
  (type rules § 6). The extractor's golden snapshot of the stack is the new
  text's.
rationale: >-
  No check is weaker for the lists the gates already read: each still holds
  one term for each code and is closed unless the list reserves vendor
  codes, since no row that cites them is a `VocabularyTerm`. The new
  allowances are narrower than a missing term: a left-out code must be a
  code of the list, must have no term, and must be named by an element the
  vocabulary rests on, and the test suite holds each of those three failures
  and a removed `except`. The fingerprints change because the kernel's lists,
  the model, and the mapping sources reach most gates; the other locks' IR
  and outputs are unchanged by the lock move.
