# Rule programs (src/rule-program.ts): each rule's check as data, which the
# gates run and every SDK is generated with, so one definition decides a
# rule everywhere. A rule here takes the place of a check written in
# TypeScript; the rules gate holds each program to its rule's vectors, and
# the SDK gates hold each SDK to them. `defs` are shared definitions, read on
# the rule owner's value.
format: 1
defs:
  # § 5.6.1: the pricing entry the commitment is under: the one `pricing_id` names, or the only entry.
  commitment: [get, [$], commitment]
  entries: [coalesce, [get, [$], pricing], [list]]
  committed:
    [if, [not, [ismap, [def, commitment]]], null,
      [if, [has, [def, commitment], pricing_id],
        [find, [def, entries], e, [eq, [get, [var, e], pricing_id], [get, [def, commitment], pricing_id]]],
        [if, [eq, [len, [def, entries]], 1], [at, [def, entries], 0], null]]]
  # The figures the commitment reads; a commitment with no committed entry, or no `agreed_rate`, has none.
  figured: [and, [ismap, [def, commitment]], [ismap, [def, committed]], [has, [def, committed], agreed_rate]]
  method: [get, [def, committed], cost_method]
  rate: [get, [def, committed], agreed_rate]
  basis: [get, [def, commitment], basis]
  amount: [coalesce, [get, [def, commitment], amount], 0]
  # § 3.1: the `delta_flat` of each option selected beyond `included[]`, and of each excluded one, in every selectable member.
  charges:
    [sum, [filter, [values, [$]], v, [and, [ismap, [var, v]], [has, [var, v], available]]], v,
      [sum,
        [concat,
          [filter, [coalesce, [get, [var, v], selected], [get, [var, v], included], [list]], n,
            [not, [contains, [coalesce, [get, [var, v], included], [list]], [var, n]]]],
          [coalesce, [get, [var, v], excluded], [list]]],
        n,
        [coalesce, [get, [get, [get, [var, v], deltas], [var, n]], delta_flat], 0]]]
  # § 5.6.5's table: the rate per of a core term; an extension term writes its own `rate_per`.
  rate_per:
    [coalesce, [get, [def, committed], rate_per],
      [table, [def, method], {CPM: 1000, CPMV: 1000, CPC: 1, CPCV: 1, CPV: 1, CPP: 1, CPA: 1, PLAY: 1000, TIME: 1, FLAT: 1}], 1]
  params: [if, [ismap, [get, [def, committed], cost_parameters]], [get, [def, committed], cost_parameters], null]
  size: [table, [get, [def, params], rate_unit], {hour: 3600, day: 86400, week: 604800}]
  starts: [instant, [get, [get, [def, commitment], flight], start]]
  ends: [instant, [get, [get, [def, commitment], flight], end]]
  timed: [and, [eq, [def, method], TIME], [isnum, [def, starts]], [isnum, [def, ends]], [isnum, [def, size]]]
  calendar: [and, [def, timed], [has, [def, params], calendar_zone], [eq, [get, [def, params], rate_unit], day]]
  zone: [get, [def, params], calendar_zone]
  # A zone the table doesn't hold leaves the count to the zone's own type check.
  unknown_zone: [and, [def, calendar], [eq, [local_day, [def, starts], [def, zone]], null]]
  # § 5.6.5, `TIME`: the calendar days in the zone the flight touches, or the flight's time, inclusive, in `rate_unit`s, half up.
  elapsed:
    [if, [def, calendar],
      [add, [sub, [local_day, [def, ends], [def, zone]], [local_day, [def, starts], [def, zone]]], 1],
      [if, [def, timed],
        [floor, [div, [add, [sub, [def, ends], [def, starts]], 1, [div, [def, size], 2]], [def, size]]],
        null]]
  flat: [eq, [def, method], FLAT]
  # § 5.6.5: the committed units, and the seller total.
  units:
    [if, [def, flat], null,
      [if, [isnum, [def, elapsed]], [def, elapsed],
        [if, [eq, [def, basis], spend],
          [if, [gt, [def, rate], 0], [floor, [mul, [div, [sub, [def, amount], [def, charges]], [def, rate]], [def, rate_per]]], null],
          [def, amount]]]]
  total:
    [if, [def, flat], [add, [def, rate], [def, charges]],
      [if, [isnum, [def, elapsed]], [add, [mul, [def, elapsed], [def, rate]], [def, charges]],
        [if, [eq, [def, basis], spend], [def, amount],
          [add, [mul, [div, [def, amount], [def, rate_per]], [def, rate]], [def, charges]]]]]
  checked: [and, [def, figured], [not, [def, unknown_zone]]]
  derived: [get, [def, commitment], derived_units]
  # § 4.4, read on the proposal that holds a change request: the line item the request's baseline names, among the
  # proposal's line items and its packages'.
  baseline_line_item_id: [get, [get, [$], baseline], line_item_id]
  requested_line_item:
    [coalesce,
      [find, [coalesce, [get, [up], line_items], [list]], x, [and, [ismap, [var, x]], [eq, [get, [var, x], line_item_id], [def, baseline_line_item_id]]]],
      [find,
        [get,
          [find, [coalesce, [get, [up], packages], [list]], p,
            [and, [ismap, [var, p]], [ne, [find, [coalesce, [get, [var, p], line_items], [list]], x, [and, [ismap, [var, x]], [eq, [get, [var, x], line_item_id], [def, baseline_line_item_id]]]], null]]],
          line_items],
        x, [and, [ismap, [var, x]], [eq, [get, [var, x], line_item_id], [def, baseline_line_item_id]]]]]
  # § 5.6.1, read on the line item that holds a pricing entry: the `pricing_id` of its committed entry, the one its
  # `commitment` names, or its only entry's.
  committed_id:
    [coalesce, [get, [get, [up], commitment], pricing_id],
      [if, [eq, [len, [get, [up], pricing]], 1], [get, [at, [get, [up], pricing], 0], pricing_id], null]]
  # § 5.6.4, read on the line item that holds the rule's owner: whether any of its counts is in impressions, a `pricing[]`
  # entry's cost method, `availability`'s `unit`, or a `committed_metrics[]` metric.
  counts_impressions:
    [or,
      [ne, [find, [coalesce, [get, [up], pricing], [list]], e, [and, [ismap, [var, e]], [contains, [list, CPM, CPMV], [get, [var, e], cost_method]]]], null],
      [and, [ismap, [get, [up], availability]], [contains, [list, impressions, viewable_impressions], [get, [get, [up], availability], unit]]],
      [ne, [find, [coalesce, [get, [up], committed_metrics], [list]], m, [and, [ismap, [var, m]], [eq, [get, [var, m], metric], impressions]]], null]]
rules:
  # § 5.6.5: "`FLAT` and `TIME` set these figures from the rate and the flight instead": a FLAT amount is the rate plus the
  # charges, and a TIME amount is the units the flight counts, or their seller total.
  sentence:5.6.5:aa43e614:
    owner: LineItem
    violations:
      - when: [and, [def, checked], [def, flat], [ne, [def, amount], [def, total]]]
        path: ""
        message: [str, "a FLAT amount is ", [def, total]]
      - when: [and, [def, checked], [isnum, [def, elapsed]], [ne, [def, amount], [if, [eq, [def, basis], units], [def, elapsed], [def, total]]]]
        path: ""
        message: [str, "a TIME commitment is for ", [def, elapsed], " units, ", [def, total], " in all"]
  # § 5.6.5, `spend`: "`derived_units` = (`amount` − those charges) ÷ `agreed_rate` × rate per, rounded down".
  sentence:5.6.5:4804c1fd:
    owner: LineItem
    violations:
      - when: [and, [def, checked], [not, [def, flat]], [not, [isnum, [def, elapsed]]], [eq, [def, basis], spend], [isnum, [def, units]], [has, [def, commitment], derived_units], [ne, [def, derived], [def, units]]]
        path: ""
        message: [str, "derived_units recomputes to ", [def, units]]
  # § 5.6.5, `units`: "`derived_units` is `amount`".
  sentence:5.6.5:03d899cb:
    owner: LineItem
    violations:
      - when: [and, [def, checked], [not, [def, flat]], [not, [isnum, [def, elapsed]]], [eq, [def, basis], units], [has, [def, commitment], derived_units], [ne, [def, derived], [def, units]]]
        path: ""
        message: [str, "derived_units recomputes to ", [def, units]]
  # § 5.6.5, `TIME`: "`derived_units` is the time from `commitment.flight.start` through `commitment.flight.end`, inclusive,
  # in `rate_unit`s rounded to the nearest whole unit, half up".
  sentence:5.6.5:d956510e:
    owner: LineItem
    violations:
      - when: [and, [def, checked], [def, timed], [not, [def, calendar]], [has, [def, commitment], derived_units], [ne, [def, derived], [def, elapsed]]]
        path: ""
        message: [str, "derived_units recomputes to ", [def, elapsed]]
  # § 5.6.5, `TIME` with `calendar_zone`: "the number of calendar days in that zone from the day of
  # `commitment.flight.start` through the day of `commitment.flight.end`".
  sentence:5.6.5:10182d60:
    owner: LineItem
    violations:
      - when: [and, [def, checked], [def, calendar], [has, [def, commitment], derived_units], [ne, [def, derived], [def, elapsed]]]
        path: ""
        message: [str, "derived_units recomputes to ", [def, elapsed]]
  # § 5.6.1: a commitment resolves only when it "fits `commitment_bounds.spend` and the committed entry's `unit_bounds`".
  sentence:5.6.1:78efd2ce:
    owner: LineItem
    violations:
      - when:
          [and, [def, checked],
            [or,
              [lt, [def, total], [get, [get, [get, [$], commitment_bounds], spend], min]],
              [gt, [def, total], [get, [get, [get, [$], commitment_bounds], spend], max]]]]
        path: ""
        message: [str, "seller total ", [def, total], " is outside commitment_bounds.spend"]
      - when:
          [and, [def, checked], [isnum, [def, units]],
            [or,
              [lt, [def, units], [get, [get, [def, committed], unit_bounds], min]],
              [gt, [def, units], [get, [get, [def, committed], unit_bounds], max]]]]
        path: ""
        message: [str, [def, units], " units are outside unit_bounds"]
  # § 5.6.4: `DeliveryCounting.impression_multiplier` is "REQUIRED when the line item counts impressions": when any of its
  # counts is in impressions, a `pricing[]` entry's cost method, `availability`'s `unit`, or a `committed_metrics[]` metric
  # (D-060). A vector that shows some of the line item's counts, none in impressions, can't say.
  rule:5.6.4:e58650b7:
    owner: DeliveryCounting
    on: LineItem
    undecided: [and, [ismap, [$]], [not, [def, counts_impressions]], [not, [and, [given, pricing], [given, availability], [given, committed_metrics]]]]
    violations:
      - when: [and, [ismap, [$]], [def, counts_impressions], [not, [has, [$], impression_multiplier]]]
        path: ""
        message: [str, "`impression_multiplier` is REQUIRED here"]
  # § 4.1: `buyer` REQUIRED when `type` is `custom` or `assent[]` is non-empty (D-060).
  rule:4.1:1ef7cbec:
    owner: Proposal
    violations:
      - when: [and, [ismap, [$]], [or, [eq, [get, [$], type], custom], [gt, [len, [get, [$], assent]], 0]], [not, [has, [$], buyer]]]
        path: ""
        message: "`buyer` is REQUIRED here"
  # § 4.1: `line_items[]` REQUIRED when `packages[]` is absent (D-060).
  rule:4.1:22f5a51a:
    owner: Proposal
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], packages]], [not, [has, [$], line_items]]]
        path: ""
        message: "`line_items` is REQUIRED here"
  # § 4.1: `packages[]` REQUIRED when `line_items[]` is absent (D-060).
  rule:4.1:94b23ce1:
    owner: Proposal
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], line_items]], [not, [has, [$], packages]]]
        path: ""
        message: "`packages` is REQUIRED here"
  # § 4.1: `negotiation_history[]` REQUIRED once the proposal is past `draft`, or has `assent[]` (D-060).
  rule:4.1:9c98396c:
    owner: Proposal
    violations:
      - when: [and, [ismap, [$]], [or, [and, [has, [$], status], [ne, [get, [$], status], draft]], [gt, [len, [get, [$], assent]], 0]], [not, [has, [$], negotiation_history]]]
        path: ""
        message: "`negotiation_history` is REQUIRED here"
  # § 4.1: a history path's `line_item_id` REQUIRED with `requested_value` (D-060).
  rule:4.1:71a584ca:
    owner: HistoryPath
    violations:
      - when: [and, [ismap, [$]], [has, [$], requested_value], [not, [has, [$], line_item_id]]]
        path: ""
        message: "`line_item_id` is REQUIRED here"
  # § 4.1: a history path's `requested_value` REQUIRED when its entry's `action` is `requested`; an entry that shows no `action` can't say (D-060).
  rule:4.1:d31e02ee:
    owner: HistoryPath
    on: HistoryEntry
    undecided: [and, [ismap, [$]], [not, [has, [up], action]]]
    violations:
      - when: [and, [ismap, [$]], [eq, [get, [up], action], requested], [not, [has, [$], requested_value]]]
        path: ""
        message: "`requested_value` is REQUIRED here"
  # § 5.2: `episodes` REQUIRED when `placement.feed` is 3 or 4 (D-060).
  rule:5.2:2f4f1aa3:
    owner: LineItem
    violations:
      - when: [and, [ismap, [$]], [contains, [list, 3, 4], [get, [get, [$], placement], feed]], [not, [has, [$], episodes]]]
        path: ""
        message: "`episodes` is REQUIRED here"
  # § 5.2: `placement` REQUIRED for a `video` or `audio` line item (D-060).
  rule:5.2:f8f39d84:
    owner: LineItem
    violations:
      - when: [and, [ismap, [$]], [contains, [list, video, audio], [get, [$], channel]], [not, [has, [$], placement]]]
        path: ""
        message: "`placement` is REQUIRED here"
  # § 5.2.2: `plcmt` REQUIRED on a `video` line item's placement; a line item that shows no `channel` can't say (D-060).
  rule:5.2.2:40e6089f:
    owner: Placement
    on: LineItem
    undecided: [and, [ismap, [$]], [not, [has, [up], channel]]]
    violations:
      - when: [and, [ismap, [$]], [eq, [get, [up], channel], video], [not, [has, [$], plcmt]]]
        path: ""
        message: "`plcmt` is REQUIRED here"
  # § 5.2.2: `feed` REQUIRED on an `audio` line item's placement; a line item that shows no `channel` can't say (D-060).
  rule:5.2.2:87d20470:
    owner: Placement
    on: LineItem
    undecided: [and, [ismap, [$]], [not, [has, [up], channel]]]
    violations:
      - when: [and, [ismap, [$]], [eq, [get, [up], channel], audio], [not, [has, [$], feed]]]
        path: ""
        message: "`feed` is REQUIRED here"
  # § 5.2.4: a property's `venue_type` REQUIRED on a `dooh` line item; a line item that shows no `channel` can't say (D-060).
  rule:5.2.4:02c220b8:
    owner: PropertyOption
    on: LineItem
    undecided: [and, [ismap, [$]], [not, [has, [up], channel]]]
    violations:
      - when: [and, [ismap, [$]], [eq, [get, [up], channel], dooh], [not, [has, [$], venue_type]]]
        path: ""
        message: "`venue_type` is REQUIRED here"
  # § 5.2.4: a property's `screens[]` REQUIRED with `allocation` `all` on a `dooh` line item; a line item that shows no `channel` can't say (D-060).
  rule:5.2.4:ea387bb0:
    owner: PropertyOption
    on: LineItem
    undecided: [and, [ismap, [$]], [and, [eq, [get, [$], allocation], all], [not, [has, [up], channel]]]]
    violations:
      - when: [and, [ismap, [$]], [and, [eq, [get, [$], allocation], all], [eq, [get, [up], channel], dooh]], [not, [has, [$], screens]]]
        path: ""
        message: "`screens` is REQUIRED here"
  # § 5.2.4: a property's `seller_accounts[]` REQUIRED for a reseller, or where the line item offers a deal mechanism; a line item that shows no `transaction_mechanism` can't say for an owner (D-060).
  rule:5.2.4:45d0b1fa:
    owner: PropertyOption
    on: LineItem
    undecided: [and, [ismap, [$]], [and, [ne, [get, [$], seller_relationship], reseller], [not, [has, [up], transaction_mechanism]]]]
    violations:
      - when: [and, [ismap, [$]], [or, [eq, [get, [$], seller_relationship], reseller], [ne, [find, [coalesce, [if, [ismap, [get, [up], transaction_mechanism]], [get, [get, [up], transaction_mechanism], available], [list]], [list]], o, [and, [ismap, [var, o]], [contains, [list, programmatic_guaranteed, preferred_deal, private_auction], [get, [var, o], id]]]], null]], [not, [has, [$], seller_accounts]]]
        path: ""
        message: "`seller_accounts` is REQUIRED here"
  # § 5.2.4: `apps[]` REQUIRED when `domains[]` is absent (D-060).
  rule:5.2.4:65ca47c9:
    owner: PropertyOption
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], domains]], [not, [has, [$], apps]]]
        path: ""
        message: "`apps` is REQUIRED here"
  # § 5.2.4: `domains[]` REQUIRED when `apps[]` is absent (D-060).
  rule:5.2.4:c8e6720e:
    owner: PropertyOption
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], apps]], [not, [has, [$], domains]]]
        path: ""
        message: "`domains` is REQUIRED here"
  # § 5.3: `combine` REQUIRED when more than one audience may be in effect (D-060).
  rule:5.3:153027ca:
    owner: AudienceSelectable
    violations:
      - when: [and, [ismap, [$]], [and, [gt, [len, [get, [$], available]], 1], [or, [not, [has, [$], max_select]], [gt, [get, [$], max_select], 1]]], [not, [has, [$], combine]]]
        path: ""
        message: "`combine` is REQUIRED here"
  # § 5.4: `format_specs` REQUIRED with `formats[]` once the proposal is past `draft`; a line item alone, or a proposal that shows no `status`, can't say (D-060).
  rule:5.4:3a677601:
    owner: LineItem
    on: Proposal
    undecided: [and, [ismap, [$]], [and, [has, [$], formats], [not, [has, [up], status]]]]
    violations:
      - when: [and, [ismap, [$]], [and, [has, [$], formats], [ne, [get, [up], status], draft]], [not, [has, [$], format_specs]]]
        path: ""
        message: "`format_specs` is REQUIRED here"
  # § 5.4: an asset's `markup` REQUIRED when `url` is absent (D-060).
  rule:5.4:45b02f49:
    owner: Asset
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], url]], [not, [has, [$], markup]]]
        path: ""
        message: "`markup` is REQUIRED here"
  # § 5.4: an asset's `url` REQUIRED when `markup` is absent (D-060).
  rule:5.4:e2c0968b:
    owner: Asset
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], markup]], [not, [has, [$], url]]]
        path: ""
        message: "`url` is REQUIRED here"
  # § 5.4: `at` REQUIRED when `before_start` is absent (D-060).
  rule:5.4:58ab1d09:
    owner: MaterialsDue
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], before_start]], [not, [has, [$], at]]]
        path: ""
        message: "`at` is REQUIRED here"
  # § 5.4: `before_start` REQUIRED when `at` is absent (D-060).
  rule:5.4:7a6f2ac4:
    owner: MaterialsDue
    violations:
      - when: [and, [ismap, [$]], [not, [has, [$], at]], [not, [has, [$], before_start]]]
        path: ""
        message: "`before_start` is REQUIRED here"
  # § 5.5: `time_zone` REQUIRED with a `daypart` or a `frequency_cap` (D-060).
  rule:5.5:4a35bd89:
    owner: LineItem
    violations:
      - when: [and, [ismap, [$]], [or, [has, [$], daypart], [has, [$], frequency_cap]], [not, [has, [$], time_zone]]]
        path: ""
        message: "`time_zone` is REQUIRED here"
  # § 5.6: `cost_parameters` REQUIRED for a cost method whose § 5.6.5 row names its keys (D-060).
  rule:5.6:0f8d396f:
    owner: PricingEntry
    violations:
      - when: [and, [ismap, [$]], [contains, [list, CPMV, CPV, CPP, CPA, TIME], [get, [$], cost_method]], [not, [has, [$], cost_parameters]]]
        path: ""
        message: "`cost_parameters` is REQUIRED here"
  # § 5.6: `rate_per` REQUIRED when `cost_method` is an extension term (D-060).
  rule:5.6:7235466d:
    owner: PricingEntry
    violations:
      - when: [and, [ismap, [$]], [and, [isstr, [get, [$], cost_method]], [contains, [get, [$], cost_method], ":"]], [not, [has, [$], rate_per]]]
        path: ""
        message: "`rate_per` is REQUIRED here"
  # § 5.6: `unit_label` REQUIRED when `cost_method` is an extension term (D-060).
  rule:5.6:7235466d-2:
    owner: PricingEntry
    violations:
      - when: [and, [ismap, [$]], [and, [isstr, [get, [$], cost_method]], [contains, [get, [$], cost_method], ":"]], [not, [has, [$], unit_label]]]
        path: ""
        message: "`unit_label` is REQUIRED here"
  # § 5.6: `cost_definition` REQUIRED when `cost_method` is an extension term (D-060).
  rule:5.6:7235466d-3:
    owner: PricingEntry
    violations:
      - when: [and, [ismap, [$]], [and, [isstr, [get, [$], cost_method]], [contains, [get, [$], cost_method], ":"]], [not, [has, [$], cost_definition]]]
        path: ""
        message: "`cost_definition` is REQUIRED here"
  # § 5.6: `price_type` REQUIRED when the entry is offered under a deal mechanism (D-060).
  rule:5.6:8288302a:
    owner: PricingEntry
    violations:
      - when: [and, [ismap, [$]], [ne, [find, [coalesce, [get, [$], transaction_mechanisms], [list]], m, [contains, [list, programmatic_guaranteed, preferred_deal, private_auction], [var, m]]], null], [not, [has, [$], price_type]]]
        path: ""
        message: "`price_type` is REQUIRED here"
  # § 5.6.1: `pricing_id` REQUIRED when the line item has more than one `pricing[]` entry; a line item that shows no `pricing` can't say (D-060).
  rule:5.6.1:7b200076:
    owner: Commitment
    on: LineItem
    undecided: [and, [ismap, [$]], [not, [has, [up], pricing]]]
    violations:
      - when: [and, [ismap, [$]], [gt, [len, [get, [up], pricing]], 1], [not, [has, [$], pricing_id]]]
        path: ""
        message: "`pricing_id` is REQUIRED here"
  # § 5.6.1: `availability` REQUIRED when an entry is declined on the ground of availability (D-060).
  rule:5.6.1:94be9998:
    owner: CommitResult
    violations:
      - when: [and, [ismap, [$]], [ne, [find, [coalesce, [get, [$], entries], [list]], e, [and, [ismap, [var, e]], [eq, [get, [var, e], role], decline], [eq, [get, [var, e], ground], availability]]], null], [not, [has, [$], availability]]]
        path: ""
        message: "`availability` is REQUIRED here"
