format: 1
id: D-022
status: proposed
kind: gap
author: agent
question: What type does `geo` take when § 5.5 lets it declare either the selectable structure or `allowed[]`?
covers:
  - ir: field:5.5:geo
    digest: 43710e564ef799d8f814bad00224216293ba574c123c139c7195b5d5c23058e6
    quote: "`geo` | Object | settable | `allowed[]` of geo codes the buyer may select within"
    locks: [main]
  - ir: field:5.5:geo
    digest: 889b802bbd3f71ad3e60d307f0c54fa98c95a997bca3a79ffb67203b3c685535
    quote: "`geo` | Object | selectable | `available[]` of geo codes with `included[]`, `pricing` deltas and `max_select` (§ 3.1), for a line item priced by market. A `geo` that declares only `allowed[]` is `settable`. See below"
    locks: [with-open-prs]
  - ir: rule:5.5:ac74a0a6
    digest: a0b915a0233da3dc5b56c9034c8408fbe6ee395de748014c263bb7fd758d0b3f
    quote: "`geo` MAY instead declare the selectable structure of § 3.1, so a line item can be priced by market."
    locks: [with-open-prs]
