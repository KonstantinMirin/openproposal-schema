options:
  - id: alias-where-equal
    summary: "A type whose form equals a type the other locks' texts write takes that type: `ClockTime` is the clock time of a daypart window, `HH:MM` up to `24:00`, `DayOfWeek` the day of a daypart window, `monday` to `sunday`, and `ZoneName` the line item's clock, an IANA zone or `viewer_local`. `ClockWindow`, `IanaZone`, `Instant`, the `https` form of a URL, and `RegistrableDomain`, whose forms no other lock writes, are types of their own."
  - id: all-own
    summary: "Each is a type of its own under the stack's name."
chosen: alias-where-equal
rationale: >-
  `ClockTime` is `HH:MM` from `00:00` to `23:59`, or `24:00`, which is the
  kernel's `TimeOfDay`; `DayOfWeek` is `monday` to `sunday`, the kernel's
  `DayName`; and `ZoneName` is an IANA zone or `viewer_local`, the kernel's
  `TimeZone`. One concept has one type, so each takes the kernel's. `IanaZone`
  has no `viewer_local`; `Instant` is in whole seconds and ends in `Z`,
  narrower than any kernel point in time; `HttpsUrl` is the stack's `Url` with
  the `https` scheme; and `RegistrableDomain` is a domain the Public Suffix
  List makes registrable, which names a business. Each is a concept of its
  own, so each is a type of its own.
feedback: >-
  None needed.
