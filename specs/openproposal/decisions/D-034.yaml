options:
  - id: narrow-reading
    summary: >-
      Read each rule as narrowly as its words allow, and give it the vectors
      that reading decides:

      - A field's status is the status of the document that holds it.

      - A settable value is bounds the buyer narrows.

      - Seller assent is the seller's version.

      - A MAY grants only the change it names.

      - A derived field changes only with the fields it is computed from.
  - id: no-vectors
    summary: Leave the prose-only mutability rules without vectors until the specification states them precisely.
chosen: narrow-reading
rationale: >-
  Type rules § 9 gives every rule a valid and an invalid vector, and a
  mutability rule's vector is a pair of versions plus the acting party, so
  leaving these rules without vectors fails the gate. The vectors read each
  rule as follows. `immutable`: the value never changes, and a version that
  first sets it after creation changes it. `seller-set`: only the seller
  changes the value, and only while the status of the document that holds the
  field, the line item or the proposal, is `draft` or `published`.
  `selectable`: the buyer changes `included[]` and leaves `available[]`,
  `pricing`, and `max_select`, the seller-declared set, as they are.
  `settable`: in draft 1 a settable field holds only its bounds (D-018), so
  the buyer's value is bounds within the seller's: `allowed[]` a subset of
  the seller's. `supplied`: the buyer sets the value, and a seller's version
  that sets it pre-populates it. `requestable`: a buyer's version that changes
  the value is a request; the request takes effect only in a version the
  seller makes, so a buyer can't grant its own hold request (`requested` to
  `held`). `derived`: neither party changes the value on its own, so a
  version that changes it and nothing else sets it directly. A MAY grants
  only the change it names: a buyer may request a later `materials_due`, not
  an earlier one, and a `committed_metrics[]` value above the seller's
  ceiling, not below it. `negotiation_history[]` keeps every entry of the
  earlier version, unchanged and in order, and may add entries after them.
  The hold `state` moves only along `none` → `requested` → `held` →
  (`expired` | `released` | `converted`), whichever party acts, and `expired`,
  `released`, and `converted` are terminal. `terms_ref` is hash-pinned when it
  carries `sha256`, and frozen when no version whose status is `agreed`
  changes it.
feedback: >-
  State each mutability rule as a check on two versions and the acting party.
  Also say:

  - whose status the `seller-set` rule reads

  - where a settable field holds the buyer's value

  - how a version shows seller assent to a request

  - whether a buyer may ask for an earlier `materials_due` or a lower committed
  metric

  - which party may move the hold `state`

  - whether `expired` and `released` are terminal, as `converted` is
