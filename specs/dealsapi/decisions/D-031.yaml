  - ir: field:object-inventory:inclinventory#description/values:1
    digest: 96b041c3c80699d7935cc53fe8d9c0282179d17bba1086ae658e57bce9588d15
    quote: "`1` (site) | `2` (app) | `3` (dooh) | `4` (audio) | `5` (endemic) | `6` (other)"
  - ir: field:object-curation:curfeetype#description/values:1
    digest: 74ab661b0a825540109857897ab7331f22f55d875d7da723b8839f16245613b3
    quote: "`0` (undisclosed) | `1` (percentage of spend) | `2` (flat fee) | `3` (CPM) | `4` (no fee is paid for curation services)"
  - ir: field:object-buyerstatus:status#description/values:1
    digest: 5b918970fa29b9656907c682521a48643bcd46a2062c468d61731738435c0ddc
    quote: "`0` (pending approval) | `1` (buyer has approved (ie. non PG deal is ready for bid requests)) | `2` (buyer has rejected) | `3` (ready to serve (ie. deal is in a campaign - ready to receive bid requests, relevant especially for PG deals)) | `4` (active (i.e. deal is actively serving impressions)) | `5` (paused) | `6` (complete (ie. buying system shows deal has completed))"
options:
  - id: by-meaning
    summary: >-
      After what its codes are, as the text names them: a seller's deal
      status, an ad type, auxiliary data, a publisher count, dynamic
      inventory, a price type, included inventory, a curation fee type, and
      a buyer's deal status.
  - id: by-field
    summary: >-
      After the field's name as written, such as `sellerstatus` and
      `curfeetype`.
chosen: by-meaning
rationale: >-
  A list is named for what its values are (type rules § 6), and the text
  names most of them in its headings and labels: Auxiliary Data, Publisher
  Count, Dynamic Inventory, Included Inventory, "Deal Price Type", the
  curation fee type. So the vocabularies are SellerDealStatus, AdType,
  AuxiliaryData, PublisherCount, DynamicInventory, PriceType,
  IncludedInventory, CurationFeeType, and BuyerDealStatus, the two statuses
  told apart by the system they are kept in.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L88"
feedback: >-
  Name each code list in the text, so that every implementation uses the
  same names for them.
