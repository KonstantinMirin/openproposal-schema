format: 1
id: G-059
date: 2026-10-27
question: Where do the type examples take a primitive's value when the specification's examples give none, and what keeps that value valid?
decision: >-
  Each primitive in `kernel/primitives.yaml` declares `showcase`, one or
  two values a reader's example payload shows, such as a realistic UUID, an
  amount of 18.5, or a sentence of prose; the second is for a list's second
  item. `kernel/kernel.schema.json` requires it, with one or two distinct
  values. `checkKernel` checks each showcase value with the Ajv validator
  that checks a valid vector, and runs each rule of the primitive on it, so
  a showcase currency is one ISO 4217 assigns and a showcase zone is one
  the IANA database lists. Two new kernel-check fixtures fail: an Amount
  showcase of -18.5, and a CurrencyCode showcase of `ABC`. A new kernel
  test covers both and a time zone the database doesn't list, the test
  suite holds 363 tests, and `MIN_TESTS` is 363.
rationale: >-
  The kernel gate checks more and relaxes nothing: every vector, mutant, and
  rule check runs as before, and the showcase values add checks of their
  own. The other gates change only because the `Primitive` declaration they
  reach gained the `showcase` member, the kernel schema they read requires
  it, and `src/kernel.ts` imports the rule checks; none of them changes
  what it checks, and the showcase values are no conformance vectors, so the
  corpus, the rules, and the SDK cases are unchanged.
