format: 1
id: G-065
date: 2026-10-27
question: What holds the public site, which `npm run site` builds from the repository, to working links, a strict Content-Security-Policy, public text, and repeatable bytes?
decision: >-
  `npm run site` builds the site into `site/`, which git ignores, with
  `src/site/build.ts`, which reads the committed outputs and resolves each
  lock's proposed and as-written builds in process. A new gate, site-builds
  (`buildSite` and `checkSite`), fails on an internal link or resource that
  names no file of the site, a link into the type map that names a type its
  build lacks, a script without `src`, an inline style or event handler, a
  resource from another origin, and text that names another protocol, an internal task
  or gate ID, or a local path, with a fixture for each. A new gate,
  site-deterministic, compares two runs of `npm run site` in separate
  processes with the in-process build. `spec-input/provenance/`, which
  `npm run provenance` writes from the open-PRs lock's clone, gives the
  site the PR that wrote each line of that lock. A variant's concepts now
  name their value domain, which variant-check checks against
  `kernel/domains.yaml`. Six site tests are added; the suite holds 386
  tests, and `MIN_TESTS` is 386.
rationale: >-
  The new gates add checks and relax none. The variant gates' fingerprints
  change because a variant concept gains a required `domain`, which the
  schema and `checkVariant` now check; the guard because the CI script runs
  the site gates; and npm-test because of the new tests. The site isn't
  committed: like the model under `build/`, it is a function of committed
  files, and the determinism gate holds it to that.
accepts:
