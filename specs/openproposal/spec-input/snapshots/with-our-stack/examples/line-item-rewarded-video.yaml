# OpenProposal 3.0 — Example: Rewarded video line item (spec § 6.7)
# Illustrative only. In-app rewarded video across a pack of puzzle games.
line_item_id:   "puzzle-games-rewarded"
status:         published
channel:        video
properties:     { available: [{ id: "puzzle-pack", name: "Puzzle game pack",
                                apps: [{ store: apple_app_store, bundle: "000002",
                                         developer_domain: "puzzle-games.example" }],
                                child_audience: general, seller_relationship: owner,
                                seller_accounts: [{ asi: "ssp-a.example", sid: "pub-4001" }] }],
                  included: ["puzzle-pack"] }
environments:   { available: ["app_mobile"], included: ["app_mobile"] }
placement:                             # every impression of this line item (§ 5.2)
  reward:       1
  instl:        1
  plcmt:        3                      # Interstitial (3)
  ssai:         1                      # all client-side (1)
  skip:         0                      # watched to the end for the reward
  playmethod:   [3]                    # Initiates on Click with Sound On (3)
  api:          [6, 7]                 # MRAID 3.0 (6), OMID 1.0 (7)
formats:        { available: ["video/30s"], included: ["video/30s"] }
format_specs:
  "video/30s":                         # seller-defined: no spec_ref
    spec:        { asset: video_file, duration: { nominal_s: 30, tolerance_ms: 500 } }
creative_delivery: { method: buyer_hosted, protocols: [13], secure_required: true }   # VAST 4.2 (13)

frequency_cap:  { count: { min: 1, max: 3, default: 2 }, period: day, per: device }
time_zone:      viewer_local

pricing:
  - { pricing_id: "rewarded-cpm-usd", cost_method: CPM, list_rate: 22.00, min_rate: 19.50, price_type: 3,
      price_valid_until: "2026-12-01T23:59:59Z", currency: USD }

commitment_bounds: { spend: { min: 10000.00 } }

committed_metrics:
  - { metric: completion_rate, level: 0.95, direction: at_least }
  - { metric: viewable_rate,   level: 0.90, direction: at_least }
measurement_source:                    # third-party vendors run through OMID 1.0 (7)
  available:    [{ id: ias, measured_by: "integralads.com" },
                 { id: dv, measured_by: "doubleverify.com" }]
  included:     ["ias"]
  max_select:   1
controlling_measurement:
  available:    [{ id: seller-count, counted_by: seller,
                   discrepancy_threshold: 0.10, final_after: "P30D" }]
  included:     ["seller-count"]
  max_select:   1
visibility:     public

transaction_mechanism:
  available:  [{ id: preferred_deal, delivery_type: non_guaranteed }]
  included:   ["preferred_deal"]
  max_select: 1
deal_origin:           "ssp-a.example"
