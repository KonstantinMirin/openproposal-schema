format: 1
id: D-046
status: proposed
kind: gap
author: agent
question: What names an object option in `included[]` and the `pricing` keys, and must a property's or an audience option's `id` be present?
covers:
  - ir: key:3.1:included[]
    digest: 8ec666d51bf96c60f03793156f832384d83126b7e98f3112259b423bc624b78b
    quote: "`included[]` | REQUIRED | Which options are in the base rate. MAY be empty"
  - ir: key:3.1:pricing
    digest: 539b0422b84a2eec4d1a6247ff1c0e887e86cb8cb997396fdca33c03477a03ce
    quote: "`pricing` | OPTIONAL | Delta per option beyond those included, as `{ option_id: { delta_cpm | delta_flat | delta_pct } }`"
  - ir: field:5.2:properties#description/object:1
    digest: d17ed59027f652ad048ca0fb7bae6984613c7b5dfc4273560958ce7006b42990
    quote: "{ id, name, domains, supported_formats }"
    locks:
