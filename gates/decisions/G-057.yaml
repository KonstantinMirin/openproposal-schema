format: 1
id: G-057
date: 2026-10-27
question: What keeps the example payload of every named type current and valid?
decision: >-
  `npm run type-examples` writes, per lock, a minimal and a full example of
  every named type the schemas emit to `type-examples/examples.json` (and
  `type-examples/with-open-prs/examples.json`). Five new gates check them on
  each lock: `type-examples-generate`, every example builds, is valid against
  its schema, and breaks no rule one payload decides; `type-examples-deterministic`,
  two runs write the same bytes; `type-examples-committed`, the committed file
  is what the generator writes; `type-examples-valid`, the committed file by
  itself has one entry per named type and passes the same check; and
  `type-examples-tracked`, every tracked file under `type-examples/` is one
  some lock writes. `type-examples/` joins the directories the `untracked`
  gate reads. The examples gate's rule lookup moves into `checksByType` and
  `copyOrders` in `src/examples.ts`, which the payload checker shares, and
  the corpus's part seeds into `partSeeds` in `src/corpus.ts`, which the
  full builder shares; neither changes what the code does. A new test file
  covers the generator and the check, the test suite holds 362 tests, and
  `MIN_TESTS` is 362.
rationale: >-
  The new gates add checks and relax none, and each has fixtures that fail
  it: a schema that rejects its primitive's first vector, a currency code the
  pinned list no longer assigns, differing runs, a stale committed file, a
  committed example its schema or a rule rejects, a type with no entry, and a
  hand-written file. `untracked` reads one more directory. `corpus-generates`,
  `fidelity`, `examples-validate`, and `comparison` change only because the
  code they reach was split into the shared helpers, with the same logic; the
  committed corpus, the examples' findings, and the comparison are unchanged.
  The guard reads the CI script, which runs the new gates, and the test tree
  gained a file, and its floor rises.
