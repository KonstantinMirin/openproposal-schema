format: 1
id: G-093
date: 2026-10-28
question: What gates hold AdCOM's drift report, which compares its lists with adcom-proto's and Prebid's enums?
decision: >-
  Four new gates run on a spec with a drift/ folder, AdCOM's. drift-sources
  checks that each artifact's snapshot file is its pinned blob; that a
  reachable clone has the commit, every pinned blob, and no other file of
  the pinned folder that defines an enum; that every list of the registry
  is paired once with each artifact's enum or none, and every enum with one
  list; and that every line of an enum reads, with seven fixtures.
  drift-deterministic, drift-committed, and drift-tracked hold the report to
  two runs of `npm run drift` in separate processes, to the committed
  files, and every tracked file under drift/ to the sources file, a pinned
  snapshot file, or a file the report writes. Its fingerprint covers
  `drift/sources.schema.json`. `drift` joins the outputs stage's folders
  (spec-profile), the folders no file may be untracked in (untracked), and
  the root's format folders (layout-tracked). The site gate changes because
  AdCOM's landing page reads the committed report, and because its registry
  fixture now names the citing type-map link by its route alone, which
  writes no relative path that the export's scan reads as a local one. The
  guard changes with
  scripts/ci.ts. The test suite holds 462 tests, and MIN_TESTS is 462.
rationale: >-
  The report is new and every gate on it is new; nothing existing is
  relaxed. The pairs of lists and enums are reviewed input, and the gates
  fail any list or enum they leave out. OpenProposal has no drift/ folder,
  so its gates and outputs don't change.
accepts:
