format: 1
id: G-034
date: 2026-10-26
question: Which gates change when kernel/lists.yaml pins ISO 4217 and the IANA time zone database, so the currency-code and zone-name rules have checks that run over the examples?
decision: >-
  kernel/lists.yaml pins ISO 4217 List One at its 2026-09-17 publication and
  the zone and link names of IANA tzdata 2026e, each with the URL of the file
  its keeper publishes, its version, and the file's SHA-256; the lists schema
  requires the version and the digest where the URL isn't a pinned GitHub
  commit, and admits zone names as codes. The two rules that rest on them,
  `kernel:CurrencyCode:assigned` and `kernel:TimeZone:listed`, have checks
  that read the pinned codes, so the rule-checks gate no longer sets them
  aside as resting on an unpinned list: it fails a payload rule with no
  check, and a check that rests on a list the gate isn't given. The rule
  checks gate and the examples gate take the pinned codes, and the examples
  run the two checks on every currency code and zone name they hold, which
  all pass. A fixture drops ISO 4217 from the codes. The test suite holds
  340 tests, so its floor rises to 340.
rationale: >-
  Two rules one payload decides ran nowhere because their lists weren't
  pinned. They now run on their vectors and on the examples, the unpinned
  exemption is gone, a new fixture fails the gate, and the test floor rises,
  so no gate is weaker.
