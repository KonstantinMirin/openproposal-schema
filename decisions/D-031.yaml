options:
  - id: obligations
    summary: "Each is an obligation of the seller: it rejects, replays, or conflicts a commitment attempt, which no single line item shows."
  - id: rules
    summary: Each is a rule on the commitment object.
chosen: obligations
rationale: >-
  Each statement says what the seller does with a commitment attempt or a
  publication: it rejects a stale version, an expired proposal or price, an
  unmet `requires`, or a cycle; returns the current version or the original
  result; and never interprets an `idempotency_key`. Deciding any of them
  needs the seller's state or the other line items of the proposal, not one
  payload, so none is a rule on the commitment. That holds for the two
  `requires` checks too, though they read only line items. The specification
  makes a proposal and a line item two documents (§ 2), and names no key of
  the proposal that holds its line items (D-028, D-033), so no payload holds
  both a line item's `requires` and the `line_item_id` of every line item in
  its proposal version. Whether each reference names a line item of the same
  proposal and version, and whether the references form a cycle, can't be
  decided from one payload. The meanings of `all_of[]` and `any_of[]` are the
  same kind of check, on the set of line items in one commitment.
feedback: >-
  Define the commitment attempt as a message, with its response and its error,
  so these requirements can be tested. As written, they are behavior with no
  payload to check. Name the key of a proposal that holds its line items. Then
  the two `requires` checks become rules on that document, with test vectors.
  One check is that each reference in `all_of[]`, `any_of[]`, and
  `min_commitment[].line_item_id` names a line item of the same proposal
  version. The other is that the references form no cycle.
