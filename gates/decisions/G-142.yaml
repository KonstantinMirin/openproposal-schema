format: 1
id: G-142
date: 2026-11-09
question: What changes in the gates when the with-our-stack lock moves to the stack's current head, and the impression multiplier's rule reads every count § 5.6.4 names?
decision: >-
  The lock reads op30-packages at `b718eb5`, which adds the Web Bot Auth
  profile's subsections (§ 2.8.1 to § 2.8.7), `ImpressionMultiplier.demographic`
  (§ 5.6.4), `tv_channel` and `tv_network` (§ 5.2.4), and makes `retention`
  `requestable`. The extractor reads the profile's two new informative
  tables, its signature rules and its failure statuses, in place of the one
  table they replace. The check of "`impression_multiplier` REQUIRED when the
  line item counts impressions" (D-060) reads the definition § 5.6.4 gives: a
  `pricing[]` entry in impressions or viewable impressions, an `availability`
  in either, or a `committed_metrics[]` tuple of `impressions`, and its
  vectors show each. The round trip records Appendix B's four prose figures
  that still count `retention` as `seller-set` (D-058), and the spec lint
  reports them; the feedback gate reads an appendix heading, such as
  "Appendix B", as the section its findings link, where it read no section.
rationale: >-
  No check is weaker: the extractor knows two more informative layouts, and
  an unknown layout still fails; the rule's check decides more payloads than
  before and decides every vector, which the rule-checks gate verifies; and
  each round-trip difference cites the decision that reads it. The feedback
  gate now checks an appendix finding's link against its appendix, where it
  had no section to check it against. The extractor's golden snapshot of the
  stack is the new text's. The other locks' IR and outputs are unchanged by
  the lock move.
