options:
  - id: closed
    summary: >-
      Each is a closed vocabulary of the values its row or sentence lists,
      named as the text names it. A value outside the list is invalid.
  - id: open
    summary: Each is an open vocabulary whose listed values are its core terms, so another party may add a term.
chosen: closed
rationale: >-
  § 2.2 writes an open list as a `VocabularyTerm`: a field that takes one
  lists its core terms, and anyone may define an extension term. `Side`,
  `ProposalStatus`, `ApprovalStatus`, and `CalendarUnit` are not
  `VocabularyTerm`s. Their Form cells are the values themselves, so the
  text closes them. `ApprovalStatus` keeps OpenDirect 2.1's uppercase
  spelling, as its row says.
feedback: >-
  None needed. § 2.2 already tells an open list from a closed one: an open
  list is a `VocabularyTerm`.
