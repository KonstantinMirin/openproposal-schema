    quote: "`0` (undisclosed) | `1` (inventory will NOT update once the deal goes live) | `2` (inventory where this deal may run is updated dynamically.)"
  - ir: field:object-terms:pricetype#description/values:1
    digest: 474f321e54bd54eab1921d7b09104a0348d398494a579ae6c3640eed98654d41
