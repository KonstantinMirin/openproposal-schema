format: 1
id: G-020
date: 2026-10-26
question: Which gates change when a selectable field's `included[]` and `pricing` keys are typed by what names an option, the option's own type or its UUID `id`?
decision: >-
  `Selectable` takes a second parameter, `K`, the type that names an option
  in `included[]` and the `pricing` keys, and a parameter may say which
  parameter's options it names (`names`). The constructor check fails a use
  whose `K` isn't `T` for an option whose values are strings, a string
  primitive or a vocabulary, or isn't `Uuid` for any other option, the `id`
  the seller mints (D-007, D-037); two fixtures name an object option by an
  external ID and a format by an external ID. Every use in the mapping gives
  `K`: the format IDs are checked in `formats.included[]` and its `pricing`
  keys too, and the property, audience, production, measurement source,
  reporting, cancellation, and exclusivity options are named by a UUID. The
  `Selectable` vectors add a format ID without its channel in `included[]`
  and in a `pricing` key, both invalid. The examples gate rests a map whose
  key its key type rejects on the key type's elements, and records 13 new
  findings, 10 on `main` and 13 with the open PRs, where an example names an
  object option by a readable name or by another member, each under D-037.
  The SDKs' `Selectable` generic takes `K`. The tests check the copy's
  `included[]` and `pricing`, the `K` check, and the SDK expressions.
rationale: >-
  The slot said an object option is named by its `id`, which is a UUID, but
  typed every name `ExternalId`, so no name was checked at all. Each name now
  validates as what it names, so a schema rejects names it accepted before,
  and only where the text or a decision says what the name is; the examples
  that disagree are recorded findings, not exemptions; the constructor check
  gains a failure and two fixtures; and no gate's test floor falls, so no
  gate is weaker.
