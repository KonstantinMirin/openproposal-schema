format: 1
id: G-077
date: 2026-10-27
question: What changes in the gates when OpenProposal's inputs and outputs move into specs/openproposal/, so that more specifications can join the repository?
decision: >-
  Every folder of OpenProposal's inputs and outputs moves with git mv to
  specs/openproposal/: the locks, the IR, the mapping, the decision records,
  the vectors, the variants, the recorded findings and differences, the
  per-field examples, the plain-generator exemptions, and the generated
  schemas, rules, corpora, type examples, comparisons, and feedback. The
  format schemas, the kernel, the SDK trees, the tools, the gates, and the
  gate decisions stay at the root, so no format schema's $id and no Go
  module path changes. A lock's paths, and every spec input and output,
  resolve from repoRoot(lock), which is now the spec's folder, so every path
  string a lock or an output holds is the one it held before. scripts/ci.ts
  runs sections 2 to 18a for each folder under specs/ that holds
  spec-input/, and fails when there is none. Each format schema is read from
  the repository's root, and each data file from the spec's folder. A gate's
  exemption paths name every spec's file with a * segment, as
  specs/*/ir/exceptions.yaml, and a pattern that matches no file now fails
  the fingerprint, where a missing directory used to add nothing. The
  untracked sweep adds specs/ and keeps the old folders, which must stay
  empty. releases-tracked reads the root's releases/, which holds the format
  schema, and the spec's, which holds its frozen releases. A guard fixture
  changes the spec's exception registry and expects the extraction gate's
  fingerprint to change. Five tests cover the layout module, a CLI's spec,
  and the pattern paths; the suite holds 415 tests, and MIN_TESTS is 415.
rationale: >-
  The move changes no generated byte: every committed output is a 100%
  rename of its file at c11f790, feedback/comment.md and details.md keep
  their SHA-256, and the site differs only where a decision page links its
  record's YAML file, now at specs/openproposal/decisions/. Most
  fingerprints change because the code they reach now names the spec's
  folder, and because the CI script and the harness, which the guard reads,
  changed. No gate is weaker: each still reads the same files, now from the
  spec's folder; an exemption pattern can only add files to a fingerprint,
  and one that matches nothing fails instead of reading nothing; and the
  untracked sweep covers more folders than before.
