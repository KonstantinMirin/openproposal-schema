    digest: aafbf8178f16173d1bb333bc69b942832a17100d282908c02d766ca4442dd0e7
    quote: "`name` | string, recommended | Name of the deal as created in the origin system. Note: This name may be displayed to the buyer. The person inputting the deal into the `origin` system should consider that when setting up the deal."
