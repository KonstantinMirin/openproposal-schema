format: 1
id: G-120
date: 2026-10-28
question: What changes in the gates when the kernel gains the Deals API's value domains, a model property carries its stated default, and no emitted enum may hold an integer?
decision: >-
  The kernel gains `CountryCode`, an ISO 3166-1 alpha-3 code of the new place
  domain's concept `country`, with the rule `kernel:CountryCode:assigned`,
  whose check reads ISO 3166-1's alpha-3 codes as kernel/lists.yaml pins them
  from the iso-codes project's release 4.20.1, with a copy under
  kernel/sources/ whose SHA-256 and codes the kernel gate checks, as it checks
  ISO 4217's; and `Ext`, a part of the new extension domain's concept
  `extension`, an object that takes any members, for a specification that
  leaves members to its parties, as the Deals API's `ext`. `CountryCode` and
  `CurrencyCode` share one structure, three capital letters, which the domain
  file lists with why a receiver processes them differently. `IntegerFlag`
  (G-118) is the Deals API's `guar` too, so a field that copies an IAB flag
  and one that the Deals API defines take one type: a primitive validates
  differently from the boolean, and its titled codes name both values, while
  each field's description keeps its own words. OpenProposal and AdCOM bind
  the new items as absent. A model property carries the default its row
  states, and a sibling that a concept requires, as money requires its
  currency, is satisfied by a stated default, so neither `required` nor
  `dependentRequired` applies to it. No emitted `enum` holds an integer
  anywhere: the conventions and the output check fail one, and an integer
  extension leaves out the one code it would also match with a `not` of its
  `const`, so AdCOM's Start Delay Modes' media offset now writes `not: {
  const: 0 }`; Ajv and the reference oracle give the same verdicts on its
  schema before and after, on twenty values from -1000 to 2^53 and of every
  JSON type. Three fixtures cover the new checks: an integer enum inside a
  branch, a model enum that holds an integer, and ISO 3166-1's list without
  a code its copy holds.
rationale: >-
  Each check is new or stricter; none is relaxed. AdCOM's lists file changes
  in one keyword with the same verdicts, so its release manifests and
  OpenProposal's with-open-prs manifest, which digests the imported file,
  change with it; no other output of either spec changes.
