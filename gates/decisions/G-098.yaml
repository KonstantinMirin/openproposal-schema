format: 1
id: G-098
date: 2026-10-28
question: What changes in the gates when each plugin states how its text identifies sections, instead of the emitter and the site guessing it from the shape of a section's ID?
decision: >-
  A plugin's text front end now states `sections`, `numbered` or
  `anchored`, in place of the optional `numbered` flag that defaulted to
  true; OpenProposal's and the widgets fixture's say `numbered`, and
  AdCOM's `anchored`. The emitter's module descriptions (src/emit.ts) read
  it from the schema names, which carry it from the plugin, and no longer
  test section IDs against a numbered pattern; the site's citation labels
  (src/site/sources.ts) name a section by its heading only for an anchored
  text, and no longer test the ID either. The lint's unnumbered-heading
  check reads the flag as before. Extraction now fails where a heading
  disagrees with the flag: an anchored text's plugin that reads a number,
  or a numbered text's plugin that gives a heading an ID of its own, with
  a test of each on the widgets fixture, and a test that the module
  description follows the flag alone. The SDK emitter takes the flag to
  emit the schemas whose digest it states. Every gate that reaches the
  plugins, the emitter, or the SDK emitter changes its fingerprint. The
  test suite holds 474 tests, and MIN_TESTS is 474.
rationale: >-
  The behavior is the same on every spec: AdCOM's and OpenProposal's
  schemas, site, and SDK trees are byte-identical. A guess becomes a
  stated flag that extraction holds every heading to, so a check is added
  and none relaxed.
