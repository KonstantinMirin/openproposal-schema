options:
  - id: json-type
    summary: >-
      The JSON type, the default, and whether the attribute is required:
      `int` and `integer` name one JSON type, `;` and `,` one separator,
      and `recommended` an optional attribute that a sender should send,
      which no schema keyword states.
  - id: recommended-required
    summary: >-
      `recommended` makes the attribute required, so a deal without it
      fails.
chosen: json-type
rationale: >-
  The Type cells write the integer type as `int` in ten rows and as
  `integer` in three, and put a `;` before `required` or `default` in two
  rows where the others put a `,`; neither changes what a value may be, so
  the schemas keep the JSON type, and the round trip writes `int` and `,`
  throughout. `recommended` says a sender should send the attribute, and a
  payload without it is still valid, so the attribute is optional, as type
  rules § 4 reads RECOMMENDED, and its description keeps the row's words.
evidence:
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L85"
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L111"
  - "https://github.com/IABTechLab/deal-api/blob/3028ddcb8d5faea44bdab272aeaa9be6b5980f81/deal1.0.md#L126"
feedback: >-
  Write each Type cell one way: `int` or `integer` throughout, and a `,`
  before `required` and `default`, as most rows do. Say what
  `recommended` asks of a sender, and whether a receiver may rely on it.
