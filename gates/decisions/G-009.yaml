  - { gate: extraction, fingerprint: e77c281dd698de6e82a88087662f52f3b598b26e7965051307c4255e5aee5531 }
  - { gate: npm-test, fingerprint: df302aa9e5ea0a046bfd20e8bb3c67c4414918082673d1ca8f165e452c151992 }
