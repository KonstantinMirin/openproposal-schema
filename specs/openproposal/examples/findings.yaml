# The places where an example fails against the emitted schemas, uses a key
# the model doesn't define, or breaks a rule that one payload decides.
# `npm run examples` prints every failure; each one here cites the decision
# records its location rests on. Its reason says where the example disagrees
# with the text, or, for a change we propose, that the example follows the
# text and what the change would write. A finding of a SHOULD rule is
# `severity: warning`. Under `undecided` are the rules' checks that an
# example's values can't decide, each with the decision that says why. The
# examples gate in `npm run ci` fails on a failure or an undecided check not
# recorded here, on a recorded one whose value changed, and on one that no
# longer occurs.
format: 1
findings:
  - example: code:5.5:1
    path: /exclusions/list_ref/sha256
    kind: invalid
    value: "<hash>"
    locks: [with-open-prs]
    decisions: [D-003]
    reason: >-
      A SHA-256 hash is 64 lowercase hex digits. The § 5.5 block writes the
      placeholder `<hash>`.
  - example: code:5.5:1
    path: /exclusions/list_ref/url
    kind: invalid
    value: "<url>"
    locks: [with-open-prs]
    decisions: [D-006]
    reason: >-
      A URL is an absolute `https` URL. The § 5.5 block writes the placeholder
      `<url>`.
