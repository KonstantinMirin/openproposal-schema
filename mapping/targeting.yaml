# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: targeting
sections: [ "5.5" ]
depends: [ inventory ]
types:
  - name: Geo
    kind: union
    ir: field:5.5:geo
    locks: [ with-open-prs ]
    source: { decisions: [ D-019, D-022 ] }
    any_of:
      - { kind: apply, constructor: Selectable, arguments: { T: { kind: named, name: ExternalId }, K: { kind: named, name: ExternalId } } }
      - { kind: apply, constructor: Settable, arguments: { T: { kind: named, name: ExternalId } } }
  - name: FrequencyCapPeriod
    kind: vocabulary
    ir: field:5.5:frequency_cap#description/object:1
    source: { decision: D-044 }
    open: false
    terms: [ hour, day, week, month, flight ]
    description: "The period a frequency cap counts over. Each term is OpenDirect 2.1's code spelled as the specification spells its terms. `hour`, `day`, `week`, and `month` are calendar periods on the line item's clock, so a `day` runs from midnight to midnight and a count starts again at midnight, not 24 hours after an impression, and a week starts on Monday. `flight`, OpenDirect's `LineDuration`, is no calendar period: it runs from the flight's start to its end, between two Timestamps."
    list:
      name: Line.frequencyinterval
      codes: { hour: Hour, day: Day, week: Week, month: Month, flight: LineDuration }
  - name: Enforcement
    kind: vocabulary
    ir: field:5.5:exclusions_accepted#description/object:1
    locks: [ with-open-prs ]
    source: { decisions: [ D-013, D-014, D-025 ] }
    open: false
    terms: [ pre_serve, best_effort ]
  - name: ExclusionType
    kind: vocabulary
    ir: field:5.5:exclusions#description/object:1
    locks: [ with-open-prs ]
    source: { decisions: [ D-013, D-014, D-025 ] }
    open: false
    terms: [ domain, app_bundle, iab_content_category, keyword ]
  - name: ListRef
    kind: object
    ir: field:5.5:exclusions#description/object:1
    locks: [ with-open-prs ]
    source: { decision: D-025 }
    open: false
    members:
      url: { type: { kind: named, name: Url }, presence: optional }
      sha256: { type: { kind: named, name: Digest }, presence: optional }
