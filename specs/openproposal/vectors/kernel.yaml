# Rule vectors for the kernel's sections: the § 3 mutability markers, each
# a rule owned by the `Marker` vocabulary (type rules § 2), and the § 2.2
# catalog-reference rule. A marker rule's vectors are pairs of versions of a
# line item and the party that made the change (type rules § 9). The schema
# accepts every payload; the rule alone decides each vector. Regenerate a
# digest with `npm run cite -- <rule ID>`.
format: 1
module: kernel
rules:
  - rule: marker:3:immutable
    digest: 36e4c2830d95e3c4ae4166cdaccae23edbe3bfa8a26898faea72ba1cb8e37586
    locks: [main, with-open-prs]
    decision: D-034
    type: LineItem
    valid:
      - party: seller
        before: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", channel: display, status: draft, min_spend: 10000 }
        after: { line_item_id: "3f6c2a10-5b7e-4c1d-9a8e-2b4d6f8a0c01", channel: display, status: draft, min_spend: 20000 }
    invalid:
