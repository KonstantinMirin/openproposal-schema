options:
  - id: duration
    summary: An ISO 8601 duration in the grammar of RFC 3339 Appendix A, as `hold_duration` is.
  - id: as-written
    summary: Each as the specification or its examples write it, prose for `lead_time`, a word for `cadence` and `granularity`, `30d` for `attribution_window`, and integer seconds for `skipafter` and `min_interval_s`.
chosen: duration
rationale: >-
  Each of these is a length of time: a production lead time, a reporting
  option's cadence, the granularity of an
  availability figure, a measurement's attribution window, how long an ad
  plays before it may be skipped, and the shortest interval between
  refreshes. The specification already writes `hold_duration` as an ISO 8601
  duration, so one concept takes one form, and a receiver reads every length
  of time with one parser. For most of them the text names no form, and the
  examples write prose, a word, or `30d`: "10 business days" and `0` for a
  lead time, `daily` for a cadence, and `30d` for an attribution window. A
  frequency cap's period isn't one: it is a calendar period, a term (D-044).
  For `skipafter` and `min_interval_s` the text does name
  one: § 5.2.2 says its keys follow AdCOM 1.0 and that each takes an
  integer, and it counts both in seconds, as AdCOM 1.0 and OpenRTB 2.6 write
  `skipafter` and `minint`; no example writes either. The schema departs from
  both: each is a duration, which a seller converts to whole seconds when it
  builds a bid request.
feedback: >-
  Write every length of time as an ISO 8601 duration, as `hold_duration` is.
  That covers a production option's `lead_time`, a reporting option's `cadence`,
  `availability`'s `granularity`, and a measurement source's
  `attribution_window`. It also covers `placement.skipafter` and
  `refresh.min_interval_s`. The examples write "10 business days" and `0` for a
  lead time. They write `daily` for a cadence and `30d` for an attribution
  window, which are `P1D` and `P30D` as durations. § 5.2.2 writes `skipafter`
  and `min_interval_s` as integer seconds, because AdCOM 1.0 and OpenRTB 2.6
  write `skipafter` and `minint` that way. A seller that builds a bid request
  converts each duration to whole seconds, such as `PT5S` to `5`. The `_s` in
  `min_interval_s` names the unit, which a duration carries, so rename the key
  `min_interval`. Business days need a calendar the specification doesn't
  define, so a lead time in business days needs one too.
