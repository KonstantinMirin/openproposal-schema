format: 1
id: G-013
date: 2026-10-26
question: How does a vocabulary take its terms from a code list another standard keeps, such as the frequency cap's period from OpenDirect 2.1?
decision: >-
  `kernel/lists.yaml`, validated by `kernel/lists.schema.json`, holds the code
  lists other standards keep, each with its codes and labels as the standard
  writes them at the commit its URL pins, and the kernel loads it beside the
  domains. A declared vocabulary may cite a list with `list`, and `codes`
  maps a term to the code it stands for where the specification spells it
  differently. The sources gate checks such a vocabulary against its list
  in place of the elements that write its terms: each term stands for one
  code, each code has a term, and the list is named by an element the
  vocabulary rests on or a decision it cites gives the list's URL as
  evidence. The model labels each term with its code's label, or with the
  code where the two differ, and the vocabulary's schema names the list. The
  mapping-sources input carries the lists. The plain generator's PG-6 drops
  the line item's dependency baseline, whose period is now a term, not a
  `P1D` the generator re-encodes. A test checks each failure of a list
  vocabulary, and the emit test checks that a period is a term, not a
  duration. The test suite holds 312 tests, so its floor rises to 312.
rationale: >-
  The text with the open PRs says the period is a calendar period like
  OpenDirect 2.1's calendar Day, and names the list, whose intervals no
  element writes, so the sources gate could only accept the terms by
  dropping its check. The list check is as strict as the element check: a
  term must stand for a pinned code, the vocabulary can't drop or add one,
  and the list must be cited, so no gate is weaker. The exemption that goes
  names a case that no longer diverges, and the test floor rises. The other
  gates' fingerprints change because they reach the kernel's loader or the
  model's resolver.
