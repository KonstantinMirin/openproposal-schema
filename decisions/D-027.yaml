options:
  - id: as-listed
    summary: Each member takes the schema type or value list its meaning names.
  - id: open-objects
    summary: Each object accepts any members.
chosen: as-listed
rationale: >-
  In `negotiation_history[]`, `version` is the proposal's revision number, a `Count`,
  `fields_changed[]` lists the fields the step changed, each named by its
  path as the tables write it, such as `pricing[].gross_rate`; the text
  states no grammar for those paths, so they validate like any other ID a
  list defines, here the specification's own field tables, and each is an
  `ExternalId` whose description says what it names. `at` is a
  `Timestamp`. A committed metric is a `Metric`, whose core terms are the two
  the prose names, `viewable_rate` and `completion_rate`, with a `Fraction`
  value (D-005) and a basis of the open vocabulary `MeasurementBasis` (D-041),
  such as `mrc`. A measurement source names its `vendor` as the vendor writes
  its name, an `ExternalId`, its `attribution_window` as a `Duration` (D-040),
  and its `qualifier` as `Text`. A reporting option's `cadence` is the length
  of time between reports, a `Duration` (D-040), its `delivery_mechanism` a
  term of the open vocabulary `ReportingDeliveryMechanism` (D-041),
  `metrics_provided[]` lists
  `Metric`s, the concept a committed metric names, and `latency` is a
  `Duration`. A credential's `issuer` is an `ExternalId` and `id_required` a
  boolean. With the open PRs, `terms_ref` is `{ url, sha256, version }`, whose
  `version` is the terms document's version as its publisher writes it, an
  `ExternalId`, and no
  member is required: no statement requires one, and "`terms_ref` MUST be
  hash-pinned" is a rule of its own (D-030). `buyer_requirements` is one
  object whose members are those of its two inline objects (D-012): the seat
  requirement is a boolean, the DSPs and seat IDs are `ExternalId`, and the
  seat owner is `Text`. An external reference's `system`, `namespace`, and
  `id` are `ExternalId`; its `role` is the open vocabulary
  `ExternalReferenceRole`, with no core terms on `main` (D-041) and, with the
  open PRs, the two documented roles, `io` and `agreement`. Billing IDs are
  `ExternalId`, and `payment_terms` and `invoicing_party` are `Text`. An
  agreement reference has an `ExternalId`, a list of party IDs, its type, and
  a validity window of `Timestamp`s, like the proposal's.
evidence:
  - examples/line-item-display.yaml (committed_metrics, measurement_source, reporting, required_credentials, buyer_requirements)
feedback: >-
  Type the members of each inline object and say which are required.
