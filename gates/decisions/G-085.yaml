format: 1
id: G-085
date: 2026-10-27
question: What changes in the gates when the extractor reads AdCOM's HTML tables, its anchored headings, and its inline HTML?
decision: >-
  The extractor reads a table written in HTML into the same table node a
  pipe table gives, with each row's and cell's source bytes kept, so the
  layouts, rows, digests, and quotes work as they do for Markdown; a table
  that a blank line splits into several HTML blocks is read whole. It knows
  the tags a table and its cells use and fails on any other, and it reads a
  stray closing tag, a cell with no row before it, and a cell that leaves
  its bold open as a browser does. Inline HTML in prose and headings, an
  anchor, a line break, a code span, bold, or italics, reads as Markdown
  would write it, and any other tag fails. A heading's own anchor may be its
  section's ID. A layout may say that its value or key cells are text, which
  column means and which types a key, and an object its heading names is a
  name its table defines; a plugin may turn off inline objects and section
  numbers, give its own lint checks, and read RFC 2119 keywords in any case,
  which the profile states. The lint checks appendices only where the
  profile turns them on, and section numbers only where the text numbers its
  headings. Two lint kinds join: a section anchor that misspells or misses
  its pattern, and a list with no codes. Two extraction fixtures fail on an
  unknown tag in an HTML table cell and on an HTML table with no end. AdCOM
  reaches its extraction stage on both locks. The test suite holds 441
  tests, and MIN_TESTS is 441.
rationale: >-
  Every check stays, and the extraction gate adds two fixtures. OpenProposal
  writes no HTML, so its IR and findings regenerate to their bytes; its
  profile places the two new lint kinds in the feedback's "other" row, and
  the extraction report lists them with zero findings.
