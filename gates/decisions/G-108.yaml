format: 1
id: G-108
date: 2026-10-28
question: What changes in the gates when every integer-coded vocabulary is emitted as titled const branches, so each code carries its name, in place of a bare enum with its codes in the description?
decision: >-
  An integer-coded vocabulary, each of AdCOM's 42 lists and so each one
  OpenProposal references, emits as `type: integer` and `oneOf` a branch
  per code, `{ const, title, description }`, the title the code's name (its
  row's own name before a colon, or its text) and the description its row's
  text where that says more; a vendor range adds `{ type: integer, minimum:
  500, title: "Vendor-specific" }`, and Start Delay Modes' media offset a
  branch of its primitive's constraints with `not` the code 0 it would also
  match, so every value matches exactly one branch. The vocabulary keeps a
  title, its list's heading, and a short description naming the list. The
  conventions check (schemas-conventions) fails an integer-coded vocabulary
  written as a bare enum, plain or open, a code's branch with no title, a
  code listed twice, and more than one extension branch, with five
  fixtures; it allows such a `oneOf` at a vocabulary's root beside the
  tagged unions it allowed. The corpus reads an integer-coded `oneOf` as one
  constraint, its `type` as implied, and builds its mutants from integers no
  branch takes. The registry import reads a vocabulary's list from its
  title. The fidelity gate's ten fixtures on AdCOM's lists, AdCOM's own
  and those OpenProposal's references reach, change the titled branches
  in place of the enum, and the vendor range's floor is the branch's. The type map lists each integer-coded vocabulary's codes with their
  names. Type rules § 2 and § 6 state the rule and the SDK naming rule the
  emitter phase will use, UPPER_SNAKE of the title; no SDK is generated. The
  test suite holds 493 tests, and MIN_TESTS is 493.
rationale: >-
  The wire format and every verdict are unchanged: every case of the
  corpora committed before, AdCOM's on both locks and OpenProposal's on
  both locks and both variants, gives the same verdict under the trees
  before and after, Ajv's and the oracle's, and the vocabulary vectors hold
  every code, the vendor boundary, and the media offset's boundary both
  ways. AdCOM's corpus has 16 fewer constraints, since each open list's
  enum and anyOf are one oneOf now. OpenProposal's schema files, SDK trees,
  and feedback don't change. The conventions check gains four rules and
  loses none.
