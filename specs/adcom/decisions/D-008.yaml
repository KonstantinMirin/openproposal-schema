options:
  - id: where-500-row
    summary: >-
      Only a list whose table has a `500+` row takes vendors' codes, from
      500 up; each such vocabulary is open to a vendor's code, an integer of
      at least 500.
  - id: every-list
    summary: >-
      Every list takes vendors' codes from 500 up, as "typically" suggests.
chosen: where-500-row
rationale: >-
  "Typically" and "when indicated" leave the set of lists open, and a `500+`
  row is the only place a list indicates it. Fifteen lists have one; the
  other 27 say nothing, and some of them, such as Device Types, are codes a
  receiver acts on, where an unknown vendor code is a new device type no one
  agreed on. Reading the rows keeps every open vocabulary to what its own
  table says.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L187"
feedback: >-
  Write a `500+` row on every list that reserves vendors' codes, and say in
  the principle that a list without one reserves none. Today "typically
  starting at 500" leaves a reader to guess for the 27 lists that have no
  such row.
