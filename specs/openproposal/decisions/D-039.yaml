options:
  - id: boolean
    summary: A JSON boolean, as every other flag of the specification is.
  - id: integer
    summary: The integers `0` and `1`, as § 5.2.2, AdCOM 1.0, and OpenRTB 2.6 write them.
chosen: boolean
rationale: >-
  § 5.2.2 says its keys follow AdCOM 1.0 and that each takes an integer, and
  it writes `reward`, `instl`, and `skip` as `0` (no) or `1` (yes), as AdCOM
  1.0 and OpenRTB 2.6 write them. Every other yes-or-no value of the
  specification is a JSON boolean, such as `hold_available` and
  `terms_acceptance_required`. One encoding for one concept lets every
  receiver read a flag the same way, and a boolean can't take a third value,
  which an integer key can. The schema departs from the § 5.2.2 text: a
  seller that builds a bid request writes `true` as `1` and `false` as `0`.
feedback: >-
  Write `placement.reward`, `instl`, and `skip` as JSON booleans, as every other
  flag of the specification is. Say they mean what the AdCOM fields of the same
  name mean. AdCOM 1.0 and OpenRTB 2.6 write these flags as the integers `0` and
  `1`. A seller that builds a bid request writes `true` as `1` and `false` as
  `0`, and reads them back the same way.
