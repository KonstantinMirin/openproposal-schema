format: 1
id: G-101
date: 2026-10-28
question: What changes in the gates to close the gaps an independent review of the plugin's sections flag found?
decision: >-
  The site read the flag through a spec's plugin with a silent default to
  numbered; it now reads it from the lock's plugin, which throws for a spec
  with none, and a test holds the labels to the flag in both directions, on
  synthetic IDs of either shape and on AdCOM's and OpenProposal's builds. In
  a numbered text, a heading with no number of its own is cited by its
  parent's number and its heading, as `§ 5.4, under "Creative inspection
  and previews"`, where the site showed the internal ID; this changes
  OpenProposal's D-032 page. The lint takes the flag itself, required, in
  place of an optional boolean that defaulted to numbered, so extraction's
  gate changes. The SDK emitter takes the whole schema names a lock's
  plugin and profile give, in place of the flag alone, so the SDK gate
  changes, and the profile's part of those names is schemaIdsOf. G-098 said
  extraction fails where a heading disagrees with the flag; it fails where
  the plugin's reading of a heading disagrees, and the site's labels are
  decided in src/site/data.ts, which src/site/sources.ts follows. The test
  suite holds 479 tests, and MIN_TESTS is 479.
rationale: >-
  A default becomes a required value, and a label that named an internal
  ID names its section; one test is added and no check is relaxed.
  Schemas, SDK trees, and feedback are byte-identical.
